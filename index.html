<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pre$u</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pre$u">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<link rel="icon" type="image/png" href="iconos/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>/* Tema elegido en Ajustes (antes de pintar, para que no parpadee) */
try { var t = localStorage.getItem('presu_tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.setAttribute('data-tema', t); } catch (e) {}</script>
<style>
:root{
  --bg:#f2f2f7;--card:#ffffff;--campo:#f2f2f7;--txt:#111114;--sub:#8a8a8e;--sep:rgba(60,60,67,.12);
  --acento:#0e9f6e;--acento-txt:#ffffff;--acento-suave:rgba(14,159,110,.12);--rojo:#ff3b30;--verde:#0e9f6e;--rojo-suave:rgba(255,59,48,.07);
  --sombra:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);
}
/* Modo oscuro: automático (según el móvil) o elegido en Ajustes */
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){--bg:#0b0b0e;--card:#1c1c1f;--campo:#2a2a2e;--txt:#f5f5f7;--sub:#8e8e93;--sep:rgba(255,255,255,.07);
    --acento:#34d399;--acento-txt:#06281c;--acento-suave:rgba(52,211,153,.15);--rojo:#ff6961;--verde:#4cd97b;--rojo-suave:rgba(255,105,97,.11);--sombra:none}
}
:root[data-tema="oscuro"]{--bg:#0b0b0e;--card:#1c1c1f;--campo:#2a2a2e;--txt:#f5f5f7;--sub:#8e8e93;--sep:rgba(255,255,255,.07);
    --acento:#34d399;--acento-txt:#06281c;--acento-suave:rgba(52,211,153,.15);--rojo:#ff6961;--verde:#4cd97b;--rojo-suave:rgba(255,105,97,.11);--sombra:none}
:root[data-tema="claro"]{color-scheme:light}
:root[data-tema="oscuro"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);overflow-x:clip}   /* que la animación al cambiar de pantalla no deje mover la página de lado */
body{margin:0 auto;max-width:460px;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,system-ui,sans-serif;
  -webkit-text-size-adjust:100%;line-height:1.35}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;user-select:none;-webkit-user-select:none}
.oculto{display:none!important}

/* ===== Cuestionario ===== */
.paso{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top)) 22px calc(18px + env(safe-area-inset-bottom))}
.arriba{display:flex;align-items:center;gap:14px;height:40px;flex:none}
.atras{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sombra);
  display:flex;align-items:center;justify-content:center;flex:none}
.atras svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.progreso{flex:1;height:5px;border-radius:3px;background:var(--sep);overflow:hidden}
.progreso i{display:block;height:100%;background:var(--acento);border-radius:3px;transition:width .35s ease}
.cuerpo{flex:1;padding-top:30px;animation:entra .28s ease}
@keyframes entra{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.cuerpo.vuelve{animation-name:vuelve}
@keyframes vuelve{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.emoji{font-size:40px;line-height:1;margin-bottom:14px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px;line-height:1.15}
.ayuda{color:var(--sub);font-size:15.5px;margin:0 0 26px}
.abajo{flex:none;padding-top:16px}
.boton{width:100%;padding:16px;font-size:17px;font-weight:650;border:0;border-radius:15px;background:var(--acento);color:var(--acento-txt)}
.boton:disabled{opacity:.35}
.boton.sec{background:none;color:var(--sub);font-weight:600;padding:12px;margin-top:4px}

input.texto{display:block;width:100%;font-size:18px;padding:15px 16px;border:0;border-radius:14px;background:var(--card);
  box-shadow:var(--sombra);outline:none;-webkit-appearance:none}
input.texto:focus{box-shadow:0 0 0 2px var(--acento)}
input.importe{display:block;width:100%;font-size:52px;font-weight:800;letter-spacing:-.03em;border:0;background:none;
  text-align:center;outline:none;padding:6px 0 4px;margin:0}
input.importe::placeholder,input.texto::placeholder{color:var(--sub);opacity:.55}
input[type=date].texto{min-height:52px}

/* Tarjetas para elegir */
.opciones{display:flex;flex-direction:column;gap:11px}
.opcion{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:18px;padding:16px;
  background:var(--card);box-shadow:var(--sombra);transition:box-shadow .15s, background .15s}
.opcion .ico{width:44px;height:44px;border-radius:13px;background:var(--campo);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.opcion b{display:block;font-size:16.5px;font-weight:650}
.opcion span.sub{display:block;color:var(--sub);font-size:13.5px;margin-top:2px}
.opcion .marca{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--sep);flex:none;display:flex;align-items:center;justify-content:center}
.opcion.on{box-shadow:0 0 0 2px var(--acento)}
.opcion.on .ico{background:var(--acento-suave)}
.opcion.on .marca{background:var(--acento);border-color:var(--acento)}
.opcion.on .marca::after{content:"";width:10px;height:6px;border:2.5px solid var(--acento-txt);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}

/* Segmentos y chips */
.etq{font-size:13.5px;color:var(--sub);margin:24px 2px 9px;font-weight:500}
.seg{display:flex;background:var(--campo);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:10px 4px;border-radius:10px;font-size:15px;color:var(--sub);font-weight:500}
.seg button.on{background:var(--card);color:var(--txt);font-weight:650;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.seg.tres button{font-size:14px;white-space:nowrap;padding:10px 2px}
.dias{display:flex;gap:6px}
.dias button{flex:1;border:0;background:var(--campo);border-radius:11px;padding:11px 0;font-size:15px;font-weight:600;color:var(--sub)}
.dias button.on{background:var(--acento);color:var(--acento-txt)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--card);box-shadow:var(--sombra);border-radius:20px;padding:10px 14px;font-size:15px}
.chip.on{background:var(--acento);color:var(--acento-txt);font-weight:600}
.paso-dia{display:flex;align-items:center;justify-content:space-between;background:var(--campo);border-radius:12px;padding:6px 6px 6px 16px;font-size:16px}
.paso-dia .ctrl{display:flex;align-items:center;gap:6px}
.paso-dia button{width:40px;height:40px;border:0;border-radius:10px;background:var(--card);font-size:20px;font-weight:600}
.paso-dia b{min-width:34px;text-align:center;font-size:18px}
.nota{color:var(--sub);font-size:13px;margin:10px 2px 0;line-height:1.4}
.tarjeta{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--sombra)}

/* Lista de gastos fijos */
.fijo{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--sep)}
.fijo:first-child{border-top:0;padding-top:2px}
.fijo:last-child{padding-bottom:2px}
.fijo .ico{font-size:20px;width:30px;text-align:center;flex:none}
.fijo input.nom{flex:1;min-width:0;border:0;background:none;font-size:16px;outline:none;padding:6px 0}
.fijo input.cant{width:84px;border:0;border-radius:10px;background:var(--campo);font-size:16px;font-weight:650;text-align:right;padding:9px 10px;outline:none}
.fijo .frec{border:0;border-radius:10px;background:var(--campo);font-size:13px;color:var(--sub);padding:10px 8px;min-width:58px}
.fijo{flex-wrap:wrap}
.fijo .extra{flex-basis:100%;display:flex;gap:6px;padding-left:40px;margin-top:-2px}
.fijo .frec{padding:7px 10px}
.fijo .frec.cta{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
.fijo .quitar{border:0;background:none;color:var(--sub);font-size:16px;padding:6px 2px;opacity:.7}

/* Bienvenida y plan */
.logo{width:76px;height:76px;filter:drop-shadow(0 6px 16px rgba(14,159,110,.35));margin-bottom:26px}
.bienvenida .cuerpo{display:flex;flex-direction:column;justify-content:center;padding-top:0}
.bienvenida h1{font-size:34px}
.plan-luego{margin-top:14px;display:flex;flex-direction:column;gap:3px}
.plan-alerta{margin-top:14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 0 0 1.5px var(--rojo) inset}
.plan-alerta b{font-size:16px}
.plan-alerta span{color:var(--sub);font-size:14.5px;line-height:1.4}
.plan-alerta .boton{margin-top:6px}
.hoy-toca{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.hero .grande.espera{color:var(--txt);opacity:.75}
.hero-espera{margin-top:4px;font-size:13.5px;color:var(--sub);text-align:center}
.pista-cuadre{margin:2px 0 10px;padding:10px 12px;border-radius:12px;background:var(--acento-suave);font-size:13.5px;line-height:1.4;color:var(--txt)}
.pista-cuadre .enlace{display:block;margin-top:6px;padding:0;font-size:14px;border:0;background:none;color:var(--acento);font-weight:600;text-align:left}
.ca-mes{display:block;margin-top:6px;padding:0;font-size:13px;text-align:left;border:0;background:none;color:var(--acento);font-weight:600}
.hoy-toca .ht-tit{font-weight:650;font-size:16px}
.hoy-toca .ht-sub{color:var(--sub);font-size:14px;line-height:1.35}
.hoy-toca .seg button{font-size:14px}
.plan-luego span{color:var(--sub);font-size:14.5px}
.plan-luego b{font-size:18px;font-weight:700}
.enlace-copia{display:block;margin:14px auto 0;border:0;background:none;color:var(--acento);font-weight:600;font-size:15px;padding:8px}
.cuadra-aviso{display:flex;flex-direction:column;gap:12px;background:var(--acento-suave);box-shadow:none}
.cuadra-aviso .ca-txt b{display:block;font-size:16px;font-weight:700}
.cuadra-aviso .ca-txt span{display:block;font-size:14px;color:var(--sub);margin-top:3px}
.cuadra-aviso .ca-bot{display:flex;gap:8px}
.copia-aviso{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px}
.copia-aviso .deu-ico{font-size:20px;flex:none}
.copia-aviso .txt{flex:1;min-width:0;font-size:15px;font-weight:600}
.copia-aviso .txt small{display:block;color:var(--sub);font-size:12.5px;font-weight:500;margin-top:1px}
.copia-aviso .mini-b{flex:none;padding:9px 16px}
.copia-aviso .cerrar{border:0;background:none;color:var(--sub);font-size:15px;padding:8px 2px 8px 4px;flex:none}
.hoja input.importe.ah-peq{font-size:38px;margin:4px 0 6px}
.bienvenida .privado{margin:22px auto 0;max-width:300px;font-size:13px;line-height:1.45;color:var(--sub);text-align:center}
.grande{font-size:56px;font-weight:800;letter-spacing:-.03em;margin:2px 0 4px;line-height:1.05}
.pos{color:var(--verde)}.neg{color:var(--rojo)}
.linea{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--sep);font-size:15.5px}
.linea:first-child{border-top:0;padding-top:0}
.linea:last-child{padding-bottom:0}
.linea span{color:var(--sub)}
.linea.total{font-weight:700}
.linea.total span{color:var(--txt)}
.linea small{color:var(--sub);font-size:12.5px}

#aviso{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:30;transform:translateX(-50%) translateY(10px);
  background:rgba(28,28,30,.95);color:#fff;padding:12px 20px;border-radius:24px;font-size:15px;opacity:0;transition:all .25s;pointer-events:none;
  white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#aviso.ver{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== App (parte 3) ===== */
:root{--barra:rgba(255,255,255,.82);--apagado:rgba(120,120,128,.2)}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){--barra:rgba(38,38,42,.82);--apagado:rgba(120,120,128,.36)}}
:root[data-tema="oscuro"]{--barra:rgba(38,38,42,.82);--apagado:rgba(120,120,128,.36)}
.app{padding:calc(12px + env(safe-area-inset-top)) 16px calc(116px + env(safe-area-inset-bottom));animation:entra .25s ease}
.app.quieta{animation:none}
.cab{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 2px 18px;min-height:44px}
.cab-izq{display:flex;align-items:center;gap:12px;min-width:0}
.cab .logo{width:42px;height:42px;margin:0;filter:none;flex:none}
.cab-hola{font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cab-sub{font-size:13.5px;color:var(--sub);margin-top:1px}
.cab h1{margin:0;font-size:30px}
.cab .atras svg.rueda{width:21px;height:21px;stroke-width:1.9}
.app .tarjeta{margin-bottom:14px}
.tit-tarjeta{font-size:17px;font-weight:700;margin:0 0 12px}

.hero{text-align:center;padding:22px 18px 14px}
.hero-etq{color:var(--sub);font-size:15px}
.hero .grande{font-size:52px;margin:4px 0 2px}
.hero-fechas{color:var(--sub);font-size:13.5px}
.hero-sobra{color:var(--sub);font-size:13px;margin-top:8px}
.ult-copia{text-align:center;font-size:15px;font-weight:600;color:var(--verde);margin:0 0 12px}
.ult-copia.vieja{color:var(--rojo)}
.barrita{height:6px;border-radius:3px;background:var(--campo);overflow:hidden;margin:16px 0 0}
.barrita i{display:block;height:100%;border-radius:3px;background:var(--acento);transition:width .35s ease}
.barrita i.neg{background:var(--rojo)}
.desglose{margin-top:12px;text-align:left}
.desglose .linea{font-size:14.5px;padding:9px 0}
.desglose .linea:first-child{padding-top:4px}
.desglose .nota{text-align:left;margin-top:8px}

.pregunta{background:var(--acento-suave);box-shadow:none}
.preg-tit{font-size:16.5px;font-weight:650}
.preg-sub{color:var(--sub);font-size:14px;margin:3px 0 12px}
.preg-bot{display:flex;gap:8px}
.mini-b{flex:1;border:0;border-radius:12px;padding:11px 4px;font-size:14.5px;white-space:nowrap;font-weight:600;background:var(--card);color:var(--txt)}
.preg-bot .mini-b:nth-child(2){flex:1.5}
.mini-b.si{background:var(--acento);color:var(--acento-txt)}
.preg-otra{display:flex;gap:8px;margin-top:10px}
.preg-otra input.texto{flex:1;min-width:0;font-size:16px;padding:11px 14px;box-shadow:none}
.preg-otra input.texto:focus{box-shadow:0 0 0 2px var(--acento)}
.preg-otra .mini-b{flex:none;padding:11px 16px}
.pregunta .nota{margin-top:10px}

.app .tarjeta .chip{background:var(--campo);box-shadow:none}
.app .tarjeta .chip.on{background:var(--acento);color:var(--acento-txt)}
.app .etq{margin:16px 2px 8px}
.app input.texto.campo{background:var(--campo);box-shadow:none;font-size:16px;padding:13px 14px}
.app input.texto.campo:focus{box-shadow:0 0 0 2px var(--acento)}
.atajos{display:flex;gap:8px;overflow-x:auto;margin:12px -18px 0;padding:2px 18px;scrollbar-width:none}
.atajos::-webkit-scrollbar{display:none}
/* Categorías que se deslizan (Apuntar) */
.cats-desliza{display:flex;gap:4px;overflow-x:auto;margin:4px -18px 10px;padding:2px 14px 2px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats-desliza::-webkit-scrollbar{display:none}
.cat-t{flex:none;width:68px;border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:6px;scroll-snap-align:start;color:var(--sub)}
.cat-e{width:50px;height:50px;border-radius:16px;background:var(--campo);display:flex;align-items:center;justify-content:center;font-size:24px;transition:background .15s,box-shadow .15s}
.cat-t.largo{width:86px}.cat-t.largo .cat-n{max-width:84px}
.cat-n{font-size:12.5px;font-weight:500;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-t.on .cat-e{background:var(--acento-suave);box-shadow:inset 0 0 0 2px var(--acento)}
.cat-t.on .cat-n{color:var(--txt);font-weight:650}
.cat-mas{justify-content:flex-start}
.cat-mas .cat-e{background:var(--acento-suave);color:var(--acento);font-size:30px;font-weight:500}
.emo-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emo-grid button{border:0;background:var(--campo);border-radius:12px;font-size:24px;height:46px;padding:0}
.emo-grid button.on{background:var(--acento-suave);box-shadow:inset 0 0 0 2px var(--acento)}
.emo-ver{width:64px;height:64px;border-radius:20px;background:var(--acento-suave);display:flex;align-items:center;justify-content:center;font-size:34px;margin:4px auto 12px}
.emo-propio{display:flex;align-items:center;gap:10px;margin-top:12px}
.emo-propio span{flex:1;color:var(--sub);font-size:14px}
.emo-propio input{width:64px;text-align:center;font-size:24px;padding:8px;border-radius:12px;border:0;background:var(--campo);color:var(--txt)}
.atajos .chip{flex:none;font-size:14px;padding:8px 12px;white-space:nowrap}
.atajos .chip.repetir{color:var(--acento);font-weight:600}
.apuntar input.importe{font-size:46px;margin:10px 0 8px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--campo);border-radius:12px;
  padding:6px 6px 6px 14px;margin-top:14px;font-size:15.5px;min-height:48px}
.fila small{display:block;color:var(--sub);font-size:12.5px;margin-top:1px}
.fila .enlace{border:0;background:none;color:var(--acento);font-weight:600;padding:8px 10px;font-size:15px}
.app input[type=date].texto.campo{margin-top:8px}
.interruptor{width:51px;height:31px;border-radius:16px;background:var(--apagado);position:relative;border:0;flex:none;transition:background .2s;margin-right:2px}
.interruptor::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.interruptor.on{background:var(--acento)}
.interruptor.on::after{transform:translateX(20px)}
.apuntar .boton{margin-top:16px}
.apuntar .boton.contorno{margin-top:8px}

.pronto{text-align:center;padding:34px 20px;color:var(--sub);font-size:15px}
.pronto .emoji{margin-bottom:10px}
.boton.peligro{background:var(--card);color:var(--rojo);box-shadow:var(--sombra)}

.barra{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;
  width:calc(100% - 32px);max-width:428px;display:flex;padding:6px;border-radius:24px;background:var(--barra);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 6px 24px rgba(0,0,0,.12),0 0 0 .5px var(--sep)}
.barra button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 6px;
  border-radius:18px;color:var(--sub);font-size:11.5px;font-weight:600}
.barra svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.barra button.on{color:var(--acento);background:var(--acento-suave)}

/* ===== Movimientos ===== */
.nav-per{display:flex;align-items:center;gap:10px;padding:12px}
.nav-per>button{width:40px;height:40px;border-radius:50%;border:0;background:var(--campo);display:flex;align-items:center;justify-content:center;flex:none;color:var(--txt)}
.nav-per>button.apagado{opacity:.25}
.nav-per svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.nav-per .centro{flex:1;text-align:center;min-width:0}
.nav-per .centro b{display:block;font-size:17px;font-weight:700}
.nav-per .centro span{display:block;color:var(--sub);font-size:13.5px;margin-top:1px}
.nav-per .centro .queda{margin-top:4px;font-size:14.5px;font-weight:600;color:var(--txt)}
.nav-per .centro .queda span{display:inline;font-size:inherit;margin:0;font-weight:750}
.nav-per .queda span.pos{color:var(--verde)}.nav-per .queda span.neg{color:var(--rojo)}
.nav-per .centro .queda-sub{margin-top:2px;font-size:13px;color:var(--sub)}
.sec-tit{font-size:13px;color:var(--sub);font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin:22px 6px 8px}
.lista{padding:4px 16px}
.mov{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--sep);cursor:pointer}
.mov:first-child{border-top:0}
.mov .ico{width:40px;height:40px;border-radius:12px;background:var(--campo);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.mov .txt{flex:1;min-width:0}
.mov .txt b{display:block;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .txt span{display:block;color:var(--sub);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .cant{font-weight:650;font-size:15.5px;white-space:nowrap;text-align:right}
.mov .cant.mas{color:var(--verde)}
.mov .cant small{display:block;color:var(--sub);font-size:12px;font-weight:500;margin-top:2px}
.mov .cant.tachado{text-decoration:line-through;color:var(--sub);font-weight:500}
.mov .borrar{border:0;background:none;color:var(--sub);font-size:15px;padding:10px 0 10px 4px;opacity:.7;flex:none}
.estado{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 7px;border-radius:7px;background:var(--campo);color:var(--sub);margin-top:3px}
.estado.espera{background:var(--acento-suave);color:var(--acento)}
.vacio{text-align:center;color:var(--sub);padding:22px 10px;font-size:15px}

/* Hoja que sube desde abajo (para cambiar algo) */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40;opacity:0;transition:opacity .22s}
.velo.ver{opacity:1}
.hoja{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:460px;z-index:41;background:var(--bg);
  border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;max-height:92dvh;overflow-y:auto;
  transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -6px 30px rgba(0,0,0,.15)}
.hoja.ver{transform:translate(-50%,0)}
.hoja .asa{width:38px;height:5px;border-radius:3px;background:var(--apagado);margin:0 auto 16px;cursor:grab}
.hoja h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px}
.hoja .ayuda{margin:0 0 16px;font-size:14.5px}
.hoja .tarjeta .chip{background:var(--campo);box-shadow:none}
.hoja .tarjeta .chip.on{background:var(--acento);color:var(--acento-txt)}
.hoja .etq{margin:16px 2px 8px}
.hoja input.texto.campo{background:var(--campo);box-shadow:none;font-size:16px;padding:13px 14px}
.hoja input.texto.campo:focus{box-shadow:0 0 0 2px var(--acento)}
.hoja input.importe{font-size:46px}
.chips.centrados{justify-content:center;margin-top:6px}
.botones-hoja{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.boton.suave{background:var(--card);color:var(--txt);box-shadow:var(--sombra)}
.boton.rojo-txt{background:none;color:var(--rojo);padding:12px}

/* ===== Resumen ===== */
.res-fila{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--sep)}
.res-fila:first-child{border-top:0;padding-top:2px}
.res-fila:last-child{padding-bottom:2px}
.res-fila.toca{cursor:pointer}
.res-fila.toca .cant::after{content:'›';margin-left:6px;color:var(--sub);font-weight:400}
.res-fila .ico{width:40px;height:40px;border-radius:12px;background:var(--campo);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.res-fila .txt{flex:1;min-width:0}
.res-fila .txt b{display:block;font-size:15.5px;font-weight:600}
.res-fila .txt span{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.res-fila .cant{font-weight:700;font-size:16px;white-space:nowrap}
.res-total{display:flex;justify-content:space-between;font-weight:700;padding-top:12px;margin-top:2px;border-top:1px solid var(--sep);font-size:15.5px}
.cat-fila{padding:9px 0}
.lv{padding:15px 16px 0;margin-top:12px}
.lv-cab{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lv-cab b{font-size:17px;font-weight:700}
.lv-cab span{font-size:13px;color:var(--sub);white-space:nowrap}
.lv-cifra{font-size:15px;color:var(--sub);margin-top:3px}
.lv-cifra b{font-size:21px;font-weight:750;color:var(--txt);margin-left:3px;letter-spacing:-.01em}
.lv-cifra b.neg,.lv-cifra b .neg{color:var(--rojo)}
.lv.ahora .lv-cifra b{color:var(--acento)}
.lv.ahora .lv-cifra b.neg{color:var(--rojo)}
.lv.justo{background:var(--rojo-suave)}
.lv-aviso{font-size:14px;font-weight:650;color:var(--rojo);margin-top:3px}
.lv-lista{margin-top:10px}
.lv-f{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--sep);cursor:pointer}
.lv-f .e{width:26px;text-align:center;font-size:19px;flex:none}
.lv-f .t{flex:1;min-width:0}
.lv-f .t b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-f .t small{display:block;font-size:12.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-f .c{font-weight:650;font-size:15px;white-space:nowrap}
.lv-f .c{text-align:right}
.lv-f .c small{display:block;font-size:12px;color:var(--sub);font-weight:500;margin-top:1px}
.lv-f .c.mas{color:var(--verde)}
.lv-f .c.suave{color:var(--sub);font-weight:550}
.lv-f .c.tachado{text-decoration:line-through;color:var(--sub);font-weight:500}
.lv-nota{cursor:default}
.lv-despues{margin-top:0;padding-bottom:4px}
.lv-despues .lv-lista{margin-top:0}
.lv-despues .lv-f:first-child{border-top:0}
.lv-nada{font-size:14px;color:var(--sub);padding:8px 0 10px}
.lv-prog{display:block;width:100%;border:0;border-top:1px solid var(--sep);background:none;color:var(--acento);font:inherit;font-weight:600;font-size:15px;padding:12px 0 13px;text-align:left;cursor:pointer}
.lv-racha{font-size:14.5px;font-weight:650;margin:0 6px 2px}
.lv-racha span{font-weight:550;color:var(--sub)}
.cat-nav{padding:10px 0 0}
.cat-rango{text-align:center;margin:10px 0 0}
.cat-frase{font-size:15px;line-height:1.4;margin:14px 2px 4px;color:var(--txt)}
.cat-frase b{font-weight:700}
.donut-caja{position:relative;width:220px;max-width:70%;margin:6px auto 4px;aspect-ratio:1}
.donut{width:100%;height:100%;display:block;overflow:visible}
.donut .trozo{cursor:pointer;transition:opacity .15s,stroke-width .15s}
.donut .trozo.apagado{opacity:.25}
.donut .trozo.on{stroke-width:36}
.donut-centro{position:absolute;inset:22%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.donut-centro b{font-size:21px;font-weight:750;letter-spacing:-.3px}
.donut-centro span{color:var(--sub);font-size:12.5px;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut-centro .dc-e{font-size:22px;color:inherit;margin:0 0 2px}
.cat-lista{list-style:none;margin:8px 0 0;padding:0}
.cat-lista li{display:flex;align-items:center;gap:10px;padding:10px 6px;margin:0 -6px;border-radius:12px;font-size:15.5px;cursor:pointer}
.cat-lista li.on{background:var(--campo)}
.cat-lista .num{width:18px;color:var(--sub);font-size:13px;font-weight:600;text-align:right;flex:none}
.cat-lista i{width:10px;height:10px;border-radius:50%;flex:none}
.cat-lista .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-lista .nom small{display:block;color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.cat-lista .pct{color:var(--sub);font-size:13px;font-weight:500}
.cat-lista b{font-weight:650}
.cat-fila .arriba-cat{display:flex;align-items:center;gap:10px;font-size:15.5px}
.cat-fila .arriba-cat span{flex:1;min-width:0}
.cat-fila .arriba-cat small{color:var(--sub);font-size:13px;font-weight:500;margin-right:4px}
.cat-fila .barrita{margin:7px 0 0 32px;height:7px}
.cab-tarjeta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cab-tarjeta .tit-tarjeta{margin:0}
.cab-tarjeta .enlace{border:0;background:none;color:var(--acento);font-weight:600;font-size:15px;padding:4px 0}
.periodo-res .grande{font-size:40px;margin:2px 0 0}
.periodo-res .sub-res{color:var(--sub);font-size:14px;margin-top:2px}
.periodo-res .barrita{margin-top:14px}
.periodo-res .pie{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-top:8px}
.boton.contorno{background:var(--acento-suave);color:var(--acento);margin-top:4px}
.saldo-fila{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--sep)}
.saldo-fila:first-child{border-top:0;padding-top:2px}
.saldo-fila span{flex:1;font-size:16px}
.saldo-fila input{width:120px;border:0;border-radius:10px;background:var(--campo);font-size:16px;font-weight:650;text-align:right;padding:10px 12px;outline:none}
.saldo-fila input:focus{box-shadow:0 0 0 2px var(--acento)}
.saldo-fila span small{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.saldo-fila span small b{font-weight:600}
.saldo-fila > b{font-size:17px;font-weight:700;white-space:nowrap}
/* 🤝 Deudas */
.deu-tit{display:flex;justify-content:space-between;align-items:baseline;color:var(--sub);font-size:13.5px;font-weight:600;margin:4px 2px 2px}
.deu-tit + .res-fila{border-top:0}
.deu-tit b{font-size:15.5px;font-weight:700}
.deu-grupo + .deu-grupo{margin-top:14px;padding-top:12px;border-top:1px solid var(--sep)}
.res-fila.deu{cursor:pointer}
.res-fila .tick{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--acento-suave);color:var(--acento);font-size:16px;font-weight:700;display:grid;place-items:center;margin-left:2px}
.res-fila .tick.on{background:var(--campo);color:var(--sub)}
.como-pago{display:flex;flex-direction:column;gap:8px;padding:2px 0 12px 52px}
.como-pago.hija{padding-left:44px}
.como-pago span{font-size:13.5px;color:var(--sub);font-weight:600}
.como-pago div{display:flex;gap:8px}
.como-pago .mini-b{flex:1;padding:10px 6px;background:var(--campo)}
.como-pago .mini-b.si{background:var(--acento)}
.como-pago .chips{flex-wrap:wrap}
.como-pago .chip.sug{box-shadow:inset 0 0 0 2px var(--acento)}
.chip.apagado{opacity:.4}
.avatar.grupo{border-radius:12px;background:var(--campo);font-size:19px}
.grupo-fila .desplegar{flex:none;display:flex;transition:transform .2s}
.grupo-fila .desplegar.on{transform:rotate(90deg)}
.grupo-fila .desplegar svg{width:16px;height:16px;fill:none;stroke:var(--sub);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hijas{margin-left:14px;padding-left:12px;border-left:2px solid var(--sep)}
.hijas .res-fila{padding:9px 0}
.hijas .avatar{width:32px;height:32px;font-size:14px}
#deshacer{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:60;transform:translateX(-50%) translateY(10px);display:flex;align-items:center;gap:12px;
  background:rgba(28,28,30,.96);color:#fff;padding:8px 8px 8px 18px;border-radius:24px;font-size:14.5px;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px)}
#deshacer.ver{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#deshacer span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#deshacer button{flex:none;border:0;border-radius:18px;background:rgba(255,255,255,.16);color:#7ef0c0;font-weight:700;font-size:14.5px;padding:8px 14px}
.deu-linea{display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left;padding:14px 16px;color:var(--txt);font-size:15.5px}
.deu-linea .deu-ico{font-size:20px;flex:none}
.deu-linea .deu-txt{flex:1;min-width:0;line-height:1.45}
.deu-linea .deu-txt span{white-space:nowrap}
.deu-linea .deu-txt b{font-weight:700}
.deu-linea .deu-txt i{font-style:normal;color:var(--sub);margin:0 7px}
.deu-flecha{flex:none;margin-left:auto;display:flex}
.deu-flecha svg{width:18px;height:18px;fill:none;stroke:var(--sub);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hoja .opcion{background:var(--card)}
.res-fila.deu .txt b,.res-fila.deu .txt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--acento-suave);color:var(--acento);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex:none}
.avatar.debo{background:var(--campo);color:var(--txt)}
.res-fila.saldada{opacity:.6}
.deu-grande{font-size:44px;font-weight:800;letter-spacing:-.03em;text-align:center;margin:6px 0 2px;line-height:1.1}
.deu-sub{text-align:center;color:var(--sub);font-size:14.5px;margin:0 0 6px}
.deu-mas{display:block;margin:12px auto 0;border:0;background:none;color:var(--acento);font-weight:600;font-size:15px;padding:6px 10px}
.persona{gap:8px}
.persona span{display:flex;align-items:center;gap:10px;min-width:0;font-size:16px}
.persona span i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.persona .avatar{width:32px;height:32px;font-size:14px}
.persona input{width:96px}
.persona .quitar{border:0;background:none;color:var(--sub);font-size:15px;padding:8px 0 8px 2px;flex:none}
.deu-anadir{display:flex;gap:8px;margin-top:10px}
.deu-anadir input.texto.campo{flex:1;min-width:0;margin:0}
.deu-anadir .mini-b{flex:none;padding:11px 16px}
.yo-fila{margin:0 0 6px}
#dRecientes{margin-top:10px}
#dRecientes .chip,#uRecientes .chip{font-size:14px;padding:8px 12px}
#uRecientes{margin:10px 0 2px}
.historial .res-fila .ico{font-size:18px}
/* ¿Te cuadra con tu banco? */
.cuadre{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--sep);font-size:14.5px;color:var(--sub)}
.cuadre-b{display:flex;gap:8px}
.cuadre-b .mini-b{flex:none;padding:8px 16px;background:var(--campo)}
.cuadre-b .mini-b.si{background:var(--acento)}
.cuadre.ok span{color:var(--verde);font-weight:600}
.cuadre .enlace{border:0;background:none;color:var(--sub);font-size:14px;padding:4px 0}
.obj-b{cursor:pointer}
.obj-b .txt-b{flex:1;min-width:0}
.obj-b .txt-b b{display:block;font-size:16px;font-weight:600}
.obj-b .txt-b span{display:block;font-size:13px;color:var(--sub);margin-top:1px}
.obj-fila{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--sep);cursor:pointer}
.obj-fila:first-of-type{border-top:0}
#jObjetivos .obj-fila:first-child{border-top:0}
.obj-fila .ico{width:40px;height:40px;border-radius:12px;background:var(--acento-suave);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.obj-fila .txt{flex:1;min-width:0}
.obj-fila .txt b{display:block;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obj-fila .txt span{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.obj-fila .barrita{margin-top:7px;height:6px}
.obj-fila .cant{font-weight:700;font-size:15.5px;white-space:nowrap;text-align:right;align-self:flex-start;margin-top:2px}
.obj-fila .cant small{display:block;color:var(--sub);font-size:12px;font-weight:500;margin-top:2px}
.barrita i.hecho{background:var(--verde)}
.obj-barra{margin:12px 8px 0}
.etq small{font-weight:400}
.sobra-op{display:flex;flex-direction:column;gap:6px;padding:0 0 10px}
.sobra-op>button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:12px;background:var(--campo);padding:10px 12px;color:var(--txt)}
.sobra-op>button i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--sep)}
.sobra-op>button.on{box-shadow:0 0 0 2px var(--acento)}
.sobra-op>button.on i{border:6px solid var(--acento)}
.sobra-op>button b{display:block;font-size:15px;font-weight:600}
.sobra-op>button small{display:block;font-size:12.5px;color:var(--sub);margin-top:1px}
.paso-n{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0 4px}
.paso-n button{width:36px;height:36px;border-radius:50%;border:0;background:var(--campo);color:var(--txt);font-size:20px;font-weight:600}
.paso-n b{font-size:15px;min-width:96px;text-align:center}
.cuadre-efecto{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:15px}
.cuadre-efecto s{color:var(--sub)}
.cuadre-efecto b{font-size:17px}
.ah-cuentas{margin-top:10px}
.ah-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--sep);margin-top:4px;padding-top:12px;font-size:15px;color:var(--sub)}
.ah-total b{font-size:20px;color:var(--txt);font-weight:750}

/* ===== Ajustes ===== */
.aj-rapido .etq:first-child{margin-top:0}
.aj-dia{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;color:var(--txt);font:inherit;font-size:16px;
  margin-top:14px;padding:13px 0 1px;border-top:1px solid var(--sep);text-align:left;cursor:pointer}
.aj-dia .ir{color:var(--sub);font-size:22px;line-height:1;opacity:.6}
.ajuste-fila{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px}
.ajuste-fila input{flex:1;min-width:0;border:0;background:none;text-align:right;font-size:16px;outline:none;color:var(--sub);padding:6px 0}
.ajuste-fila input:focus{color:var(--txt)}
.app .tarjeta .etq:first-child{margin-top:0}
.mov .ir{color:var(--sub);font-size:22px;line-height:1;opacity:.6;flex:none}
.anadir{display:block;width:100%;border:0;background:none;color:var(--acento);font-weight:600;font-size:15.5px;padding:13px 0 11px;text-align:left;border-top:1px solid var(--sep)}
.lista .anadir:first-child{border-top:0}
.chip .x{margin-left:6px;color:var(--sub);font-size:13px}
.fila-anadir{display:flex;gap:8px;margin-top:12px}
.fila-anadir input.texto.campo{flex:1;min-width:0;padding:11px 14px}
.fila-anadir .mini-b{flex:none;padding:11px 16px;background:var(--acento-suave);color:var(--acento)}
.hoja .dias button{background:var(--campo)}
.hoja .dias button.on{background:var(--acento);color:var(--acento-txt)}
.hoja .paso-dia button{background:var(--card)}

/* ===== Apple Pay ===== */
.guia-foto{margin-top:14px;padding-top:12px;border-top:1px solid var(--sep)}
.guia-foto span{display:block;font-size:13.5px;color:var(--sub);margin-bottom:8px}
.guia-foto img{display:block;width:100%;height:auto;border-radius:14px}
.applepay{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px}
.applepay .txt{flex:1;min-width:0}
.applepay .txt b{display:block;font-size:15.5px;font-weight:650}
.applepay .txt span{display:block;color:var(--sub);font-size:13px;margin-top:1px}
.applepay .mini-b{flex:none;padding:10px 16px}
.pago{background:var(--card);border-radius:18px;padding:14px 14px 12px;margin-bottom:10px;box-shadow:var(--sombra);transition:opacity .2s}
.pago.fuera{opacity:.45}
.pago .aviso-repe{margin-top:8px;font-size:13px;line-height:1.35;color:var(--txt);background:rgba(255,159,10,.16);border-radius:10px;padding:7px 10px}
.pago.fuera .aviso-repe{opacity:1}
.pago .arriba-pago{display:flex;align-items:center;gap:10px}
.pago .arriba-pago .txt{flex:1;min-width:0}
.pago .arriba-pago b{display:block;font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pago .arriba-pago span{display:block;color:var(--sub);font-size:13px;margin-top:1px}
.pago .arriba-pago .cant{font-weight:750;font-size:17px;white-space:nowrap}
.pago .quitar-pago{border:0;background:var(--campo);color:var(--sub);width:30px;height:30px;border-radius:50%;font-size:13px;flex:none}
.pago .fila-chips{display:flex;gap:6px;overflow-x:auto;margin:10px -14px 0;padding:2px 14px;scrollbar-width:none}
.pago .fila-chips::-webkit-scrollbar{display:none}
.pago .fila-chips .chip{flex:none;font-size:13.5px;padding:7px 11px;white-space:nowrap;background:var(--campo);box-shadow:none}
.pago .fila-chips .chip.on{background:var(--acento);color:var(--acento-txt)}
.hoja textarea{display:block;width:100%;min-height:110px;border:0;border-radius:14px;background:var(--card);box-shadow:var(--sombra);padding:12px 14px;font:inherit;font-size:15px;color:inherit;outline:none;resize:vertical}
.guia ol{margin:0;padding-left:22px;font-size:15px;line-height:1.5}
.guia li{margin-bottom:9px}
/* Guía de Apple Pay: «Antes de empezar» (qué lee Pre$u y dónde se guarda) */
.antes-ap{border:1.5px solid var(--acento);background:var(--acento-suave)}
.antes-ap .tit-antes{font-weight:700;font-size:16px;margin-bottom:8px}
.antes-ap ul{margin:0;padding-left:20px;font-size:15px;line-height:1.5}
.antes-ap li{margin-bottom:7px}
.antes-ap li:last-child{margin-bottom:0}
.guia code{background:var(--campo);border-radius:6px;padding:1px 6px;font-size:13.5px;word-break:break-all}
</style>
</head>
<body>

<div id="raiz"></div>
<div id="aviso"></div>

<script>
// =====================================================================
//  Pre$u · Parte 2: cuestionario de inicio
//  Todo se guarda solo en este móvil (localStorage). No hay servidor.
// =====================================================================

const $ = id => document.getElementById(id);
const leer = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
// Si el móvil no deja guardar (sin espacio, modo privado…), se avisa: si no, se perdería lo apuntado sin enterarse
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch (e) { setTimeout(() => aviso('⚠️ No se ha podido guardar. ¿Tienes el móvil sin espacio o estás en modo privado?'), 60); return false; } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
// Lee cantidades escritas a la española: «1.234,56», «12,5», «12.5» y también «1.000» (mil, no uno)
const num = s => { s = String(s ?? '').trim().replace(/[€\s]/g, ''); if (!s) return NaN;
  if (s.includes(',')) return parseFloat(s.replace(/\./g, '').replace(',', '.'));
  if (/^[-+]?[1-9]\d{0,2}(\.\d{3})+$/.test(s)) return parseFloat(s.replace(/\./g, ''));
  return parseFloat(s); };
// Pone los puntos de los miles: «1234567» → «1.234.567» (en castellano, 1.000 también lleva punto)
const puntos = e => String(e).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
// Cantidades en euros: «1.000,00 €», «1.000.000,00 €», «-12,50 €» (a mano, porque el móvil no pone el punto en los números de 4 cifras)
const eur = (n, dec) => {
  const d = dec === 0 ? 0 : 2, v = Number(n || 0), a = Math.round(Math.abs(v) * 10 ** d) / 10 ** d;
  const [e, f] = a.toFixed(d).split('.');
  return (v < 0 && a > 0 ? '-' : '') + puntos(e) + (f ? ',' + f : '') + '\u00a0€';
};
const r2 = n => Math.round(n * 100) / 100;
const nuevoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function hoyIso() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
// Número para dentro de una casilla: «1.387,13» (con los puntos de los miles; num() lo vuelve a leer bien)
const txtNum = n => { const v = r2(n), [e, f] = String(Math.abs(v)).split('.'); return (v < 0 ? '-' : '') + puntos(e) + (f ? ',' + f : ''); };
const fmtImporte = n => (n || n === 0) && !isNaN(n) && n > 0 ? txtNum(n) : '';

// Si algo falla, que salga un aviso en vez de quedarse la pantalla sin hacer nada
window.addEventListener('error', () => aviso('Algo ha fallado. Cierra Pre$u y vuelve a abrirla.'));

// ---------- Puntos de los miles mientras escribes (pedido por Carles el 24/10) ----------
// En todas las casillas de dinero (inputmode="decimal"): escribes «1000» y sale «1.000»; la coma es para los céntimos.
// Si tu teclado tiene «.» en vez de «,», el punto que escribes cuenta como coma (los de los miles los pone Pre$u).
function formatoEscrito(raw, caret, tecleado, pegado) {
  let s = String(raw), neg = /^\s*-/.test(s);
  let iDec = s.indexOf(',');
  if (iDec < 0 && tecleado === '.' && s[caret - 1] === '.') iDec = caret - 1;
  if (iDec < 0 && pegado && /^\s*-?\d+\.\d{1,2}\s*$/.test(s) && !/^\s*-?\d{1,3}\.\d{3}\s*$/.test(s)) iDec = s.indexOf('.');   // pegado «12.5»
  const hayDec = iDec >= 0;
  let ent = (hayDec ? s.slice(0, iDec) : s).replace(/\D/g, '').replace(/^0+(?=\d)/, '');
  const dec = hayDec ? s.slice(iDec + 1).replace(/\D/g, '').slice(0, 2) : '';
  if (hayDec && !ent) ent = '0';
  const v = (neg ? '-' : '') + puntos(ent) + (hayDec ? ',' + dec : '');
  if (caret >= s.length) return { v, pos: v.length };
  // El cursor se queda detrás de la misma cifra (los puntos que aparecen o desaparecen no lo mueven)
  let sig = 0;
  for (let i = 0; i < caret; i++) if (/\d/.test(s[i]) || i === iDec) sig++;
  let pos = 0, k = 0;
  while (pos < v.length && k < sig) { if (/[\d,]/.test(v[pos])) k++; pos++; }
  return { v, pos };
}
const esCasillaDinero = el => el && el.tagName === 'INPUT' && el.getAttribute('inputmode') === 'decimal';
document.addEventListener('beforeinput', e => {
  const el = e.target;
  if (!esCasillaDinero(el) || e.inputType !== 'deleteContentBackward') return;
  const a = el.selectionStart, b = el.selectionEnd;
  // Borrar justo detrás de un punto de los miles: se borra la cifra de antes (si no, el punto volvería a salir y parecería que no borra)
  if (a === b && a > 1 && el.value[a - 1] === '.' && !el.value.includes(',')) {
    e.preventDefault();
    const raw = el.value.slice(0, a - 2) + el.value.slice(a), r = formatoEscrito(raw, a - 2);
    el.value = r.v; try { el.setSelectionRange(r.pos, r.pos); } catch (x) {}
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }
}, true);
document.addEventListener('input', e => {
  const el = e.target;
  if (!esCasillaDinero(el) || e.isComposing) return;
  const caret = el.selectionStart == null ? el.value.length : el.selectionStart;
  const r = formatoEscrito(el.value, caret, e.data, /paste|drop/i.test(e.inputType || ''));
  if (r.v !== el.value) { el.value = r.v; try { el.setSelectionRange(r.pos, r.pos); } catch (x) {} }
}, true);
let tAviso;
function aviso(t) {
  const a = $('aviso'); a.textContent = t; a.classList.add('ver');
  clearTimeout(tAviso); tAviso = setTimeout(() => a.classList.remove('ver'), 2200);
}

const LOGO = `<svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#3EE0A5"/><stop offset="1" stop-color="#0E9F6E"/></linearGradient></defs>
  <rect width="64" height="64" rx="15" fill="url(#lg)"/><circle cx="32" cy="32" r="19" fill="#fff" opacity=".18"/>
  <path d="M38.5 24.2c-1.5-1.9-3.9-3-6.6-3-4 0-6.9 2.1-6.9 5.3 0 7.4 14.2 3.6 14.2 10.9 0 3.3-3.1 5.5-7.3 5.5-3 0-5.6-1.2-7.2-3.3M32 16.5v4.7M32 42.9v4.6"
  fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const FLECHA = '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';

// ---------- Tipos de dinero que entra ----------
const FUENTES = {
  paga:   { emoji: '👨‍👩‍👧', titulo: 'Paga de mis padres',        sub: 'Lo que te dan para ti',                   frec: 'semana', dia: 1, oculta: true },   // ya no sale en el cuestionario (20/10)
  semana: { emoji: '🛒',     titulo: 'Paga o dinero para la semana', nombre: 'Paga', sub: 'De tus padres: para tus cosas, comida, transporte…', frec: 'semana', dia: 1 },   // (28/10, q22)
  sueldo: { emoji: '💼',     titulo: 'Sueldo',                      sub: 'Trabajas y cobras',                     frec: 'mes',    dia: 1 },
  otro:   { emoji: '✨',     titulo: 'Otro ingreso',                sub: 'Beca, clases particulares, ventas…',    frec: 'mes',    dia: 1 }
};
const FIJOS_RAPIDOS = [
  ['🏠', 'Piso'], ['📱', 'Móvil'], ['🏋️', 'Gimnasio'], ['🎵', 'Spotify'], ['🚌', 'Transporte'], ['📺', 'Netflix'], ['➕', 'Otro']
];
const BANCOS_RAPIDOS = ['Revolut', 'BBVA', 'Santander', 'CaixaBank', 'ING', 'Bankinter', 'Sabadell', 'Openbank', 'N26', 'Unicaja', 'Kutxabank', 'Abanca'];
const emojiCuenta = n => /efectivo|cash|met[aá]l/i.test(n) ? '💶' : '🏦';
// Devuelve una cuenta que exista (por si se borró la que estaba elegida)
const cuentaValida = id => (B.cuentas.some(c => c.id === id) ? id : (B.cuentas[0] || {}).id);
const nombreCuenta = id => ((B.cuentas.find(c => c.id === id) || {}).nombre || '').trim();
// Botones para elegir cuenta (solo salen si tiene más de una)
function selectorCuenta(idHtml, actual, titulo) {
  if (B.cuentas.length < 2) return '';
  return `<div class="etq">${titulo}</div><div class="chips" id="${idHtml}">${B.cuentas.map(c =>
    `<button class="chip ${c.id === actual ? 'on' : ''}" data-v="${c.id}">${emojiCuenta(c.nombre)} ${esc(c.nombre.trim() || 'Sin nombre')}</button>`).join('')}</div>`;
}
function montarSelectorCuenta(idHtml, cb) {
  if (!$(idHtml)) return;
  $(idHtml).querySelectorAll('.chip').forEach(b => b.onclick = () => { cb(b.dataset.v); guardarBorrador(); pintar(true); });
}
// Ahorros repartidos en varias cuentas (ej.: 100 € en Revolut y 40 € en Bankinter): una fila por cuenta
const sumaPorCuenta = v => r2(Object.values(v || {}).reduce((s, x) => s + (x > 0 ? x : 0), 0));
const cuentaMayor = (v, porDefecto) => Object.entries(v || {}).reduce((m, [id, x]) => (!m || x > v[m] ? id : m), '') || porDefecto;
function filasAhorroCuentas(cuentas, valores) {
  return `<div class="ah-cuentas">${cuentas.map(c => `<div class="saldo-fila"><span>${emojiCuenta(c.nombre)} ${esc(c.nombre.trim() || 'Sin nombre')}</span>
      <input class="ah-imp" data-id="${c.id}" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0 €" value="${fmtImporte(valores[c.id])}"></div>`).join('')}</div>
    <div class="ah-total"><span>Total</span><b id="ahTotal">${eur(sumaPorCuenta(valores))}</b></div>`;
}
function montarAhorroCuentas(valores, alCambiar) {
  document.querySelectorAll('.ah-imp').forEach(i => i.oninput = () => {
    const n = num(i.value);
    if (n > 0) valores[i.dataset.id] = r2(n); else delete valores[i.dataset.id];
    $('ahTotal').textContent = eur(sumaPorCuenta(valores));
    alCambiar();
  });
}
const DIAS_SEM = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];   // 1 = lunes … 7 = domingo
const DIAS_NOMBRE = ['', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];

// ---------- Borrador del cuestionario (se guarda en cada paso por si se cierra la app) ----------
const VACIO = () => ({
  paso: 0, nombre: '', periodo: '', cuentas: [], fuentes: [], sinIngresos: false, ingresos: {},
  fijos: [], saldos: {}, guardar: null, ahorro: { importe: null, porCuenta: {} }, restoHasta: '', restoOtra: false,
  tieneObjetivos: null, objetivos: [], sobrante: ''
});
let B = Object.assign(VACIO(), leer('presu_borrador') || {});
let direccion = 1;
const guardarBorrador = () => guardar('presu_borrador', B);

// Lista de pasos (cambia según lo que elijas: un paso por cada tipo de ingreso)
function pasos() {
  return ['bienvenida', 'nombre', 'periodo', 'cuentas', 'fuentes', ...B.fuentes.map(f => 'ingreso:' + f), 'fijos', 'saldos', 'guardar', 'objetivos', 'sobrante', 'plan'];
}
const palabraPeriodo = () => B.periodo === 'mes' ? 'mes' : 'semana';

function ir(delta) {
  const lista = pasos();
  B.paso = Math.max(0, Math.min(lista.length - 1, B.paso + delta));
  direccion = delta;
  guardarBorrador();
  pintar();
  window.scrollTo(0, 0);
}

// ---------- Validación de cada paso ----------
function puedeSeguir(id) {
  if (id === 'nombre') return B.nombre.trim().length > 0;
  if (id === 'periodo') return !!B.periodo;
  if (id === 'cuentas') {
    const n = B.cuentas.map(c => c.nombre.trim().toLowerCase());
    return n.length > 0 && n.every(Boolean) && new Set(n).size === n.length;
  }
  if (id === 'fuentes') return B.fuentes.length > 0 || B.sinIngresos;
  if (id.startsWith('ingreso:')) { const i = B.ingresos[id.slice(8)]; return i && i.importe > 0 && (id.slice(8) !== 'otro' || (i.nombre || '').trim()); }
  if (id === 'fijos') return B.fijos.every(x => x.importe > 0 && x.nombre.trim());
  if (id === 'saldos') return B.cuentas.every(c => isFinite((B.saldos || {})[c.id])) && !faltaHoy();
  if (id === 'guardar') return !queFaltaGuardar();
  if (id === 'objetivos') return B.tieneObjetivos === false || (B.tieneObjetivos === true && B.objetivos.length > 0);
  if (id === 'sobrante') return !!B.sobrante;
  return true;
}
function porQueNo(id) {
  if (id === 'nombre') return 'Escribe tu nombre';
  if (id === 'periodo' || id === 'sobrante') return 'Elige una opción';
  if (id === 'fuentes') return 'Elige al menos una opción';
  if (id === 'cuentas') {
    if (!B.cuentas.length) return 'Añade al menos una cuenta';
    if (B.cuentas.some(c => !c.nombre.trim())) return 'Ponle nombre a cada cuenta (o quítala con ✕)';
    return 'Hay dos cuentas con el mismo nombre';
  }
  if (id.startsWith('ingreso:')) return id === 'ingreso:otro' && !(B.ingresos.otro.nombre || '').trim() ? 'Ponle un nombre' : 'Escribe la cantidad';
  if (id === 'fijos') return 'Pon nombre y cantidad a cada gasto (o quítalo con ✕)';
  if (id === 'saldos') return faltaHoy() && B.cuentas.every(c => isFinite((B.saldos || {})[c.id])) ? 'Dinos si lo de hoy ya está en lo que has puesto'
    : B.cuentas.length > 1 ? 'Pon cuánto tienes en cada cuenta (aunque sea 0)' : 'Pon cuánto tienes (aunque sea 0)';
  if (id === 'guardar') return queFaltaGuardar();
  if (id === 'objetivos') return B.tieneObjetivos === true ? (B.tipoObj === 'colchon' ? 'Crea tu colchón (o elige «No, de momento no»)' : 'Añade tu objetivo (o elige «No, de momento no»)') : 'Elige una opción';
  return '';
}

// ---------- Pantallas ----------
function opcion(o) {
  return `<button class="opcion ${o.on ? 'on' : ''}" data-v="${esc(o.v)}">
    <div class="ico">${o.emoji}</div><div><b>${esc(o.titulo)}</b>${o.sub ? `<span class="sub">${esc(o.sub)}</span>` : ''}</div>
    <div class="marca"></div></button>`;
}
function seg(id, valores, actual) {
  return `<div class="seg" id="${id}">${valores.map(([v, t]) => `<button data-v="${v}" class="${v === actual ? 'on' : ''}">${t}</button>`).join('')}</div>`;
}

const PANTALLAS = {
  bienvenida: () => ({
    clase: 'bienvenida', sinArriba: true,
    html: `${LOGO}<h1>Hola 👋<br>Esto es Pre$u</h1>
      <p class="ayuda">Vamos a montar tu presupuesto en un minuto. Todo se queda en tu móvil y podrás cambiarlo cuando quieras.</p>
      <p class="privado">🔒 Sin registro ni cuentas. Lo que pongas no sale de tu móvil: nadie lo ve, ni siquiera nosotros.</p>
      <button class="enlace-copia" id="bRecuperar">¿Ya usabas Pre$u? Recupera tu copia</button>`,
    boton: 'Empezar',
    alMontar() { $('bRecuperar').onclick = elegirCopia; }
  }),

  nombre: () => ({
    html: `<div class="emoji">🙂</div><h1>¿Cómo te llamas?</h1><p class="ayuda">Para saludarte al abrir la app.</p>
      <input id="iNombre" class="texto" type="text" maxlength="30" autocomplete="given-name" enterkeyhint="next" placeholder="Tu nombre" value="${esc(B.nombre)}">`,
    alMontar() { const i = $('iNombre'); i.oninput = () => { B.nombre = i.value; guardarBorrador(); actualizarBoton(); }; setTimeout(() => i.focus(), 250); }
  }),

  periodo: () => ({
    html: `<div class="emoji">🗓️</div><h1>¿Cómo quieres ver tu dinero?</h1>
      <p class="ayuda">Te diremos cuánto puedes gastar en cada periodo. Lo puedes cambiar luego en Ajustes.</p>
      <div class="opciones" id="oPeriodo">
        ${opcion({ v: 'semana', emoji: '📅', titulo: 'Por semanas', sub: '«Te quedan 40 € esta semana»', on: B.periodo === 'semana' })}
        ${opcion({ v: 'mes', emoji: '🗓️', titulo: 'Por meses', sub: '«Te quedan 300 € este mes»', on: B.periodo === 'mes' })}
      </div>`,
    alMontar() { elegirUna('oPeriodo', v => { B.periodo = v; }); }
  }),

  cuentas: () => {
    const tiene = n => B.cuentas.some(c => c.nombre.trim().toLowerCase() === n.toLowerCase());
    return {
      html: `<div class="emoji">🏦</div><h1>¿Dónde tienes tu dinero?</h1>
        <p class="ayuda">Tus bancos, tarjetas o efectivo. Añade todas las que uses.</p>
        <div class="chips" id="cRapidas">
          ${BANCOS_RAPIDOS.map(n => `<button class="chip ${tiene(n) ? 'on' : ''}" data-n="${n}">${n}</button>`).join('')}
          <button class="chip ${tiene('Efectivo') ? 'on' : ''}" data-n="Efectivo">💶 Efectivo</button>
          <button class="chip" data-n="">➕ Otra</button>
        </div>
        <div class="tarjeta ${B.cuentas.length ? '' : 'oculto'}" style="margin-top:18px">
          ${B.cuentas.map(c => `<div class="fijo" data-id="${c.id}">
            <span class="ico">${emojiCuenta(c.nombre)}</span>
            <input class="nom" type="text" maxlength="24" value="${esc(c.nombre)}" placeholder="Nombre (ej: Tarjeta del Santander)">
            <button class="quitar" aria-label="Quitar">✕</button></div>`).join('')}
        </div>
        <div class="nota">Podrás añadir, quitar o cambiar el nombre en Ajustes.</div>`,
      alMontar() {
        $('cRapidas').querySelectorAll('.chip').forEach(b => b.onclick = () => {
          const n = b.dataset.n;
          if (n && tiene(n)) B.cuentas = B.cuentas.filter(c => c.nombre.trim().toLowerCase() !== n.toLowerCase());
          else B.cuentas.push({ id: nuevoId(), nombre: n });
          guardarBorrador(); pintar(true);
          if (!n) { const filas = document.querySelectorAll('.fijo .nom'); filas[filas.length - 1].focus(); }
        });
        document.querySelectorAll('.fijo').forEach(fila => {
          const c = B.cuentas.find(x => x.id === fila.dataset.id);
          fila.querySelector('.nom').oninput = e => { c.nombre = e.target.value; fila.querySelector('.ico').textContent = emojiCuenta(c.nombre); guardarBorrador(); actualizarBoton(); };
          fila.querySelector('.quitar').onclick = () => { B.cuentas = B.cuentas.filter(x => x !== c); guardarBorrador(); pintar(true); };
        });
      }
    };
  },

  fuentes: () => ({
    html: `<div class="emoji">💶</div><h1>¿De dónde te llega el dinero?</h1>
      <p class="ayuda">Marca todas las que tengas.</p>
      <div class="opciones" id="oFuentes">
        ${Object.entries(FUENTES).filter(([v, f]) => !f.oculta || B.fuentes.includes(v)).map(([v, f]) => opcion({ v, emoji: f.emoji, titulo: f.titulo, sub: f.sub, on: B.fuentes.includes(v) })).join('')}
        ${opcion({ v: 'nada', emoji: '🚫', titulo: 'No tengo ingresos', sub: 'Solo quiero organizar mis ahorros', on: B.sinIngresos })}
      </div>`,
    alMontar() {
      $('oFuentes').querySelectorAll('.opcion').forEach(b => b.onclick = () => {
        const v = b.dataset.v;
        if (v === 'nada') { B.sinIngresos = !B.sinIngresos; if (B.sinIngresos) B.fuentes = []; }
        else {
          B.sinIngresos = false;
          B.fuentes = B.fuentes.includes(v) ? B.fuentes.filter(x => x !== v) : Object.keys(FUENTES).filter(k => k === v || B.fuentes.includes(k));
          if (!B.ingresos[v]) B.ingresos[v] = { importe: null, frec: FUENTES[v].frec, dia: FUENTES[v].dia, nombre: '', cuenta: '' };
        }
        guardarBorrador(); pintar(true);
      });
    }
  }),

  ingreso: tipo => {
    const f = FUENTES[tipo], i = B.ingresos[tipo];

      ? `<div class="etq">¿Qué día te llega?</div><div class="dias" id="iDias">${DIAS_SEM.map((d, k) => `<button data-v="${k + 1}" class="${i.dia === k + 1 ? 'on' : ''}">${d}</button>`).join('')}</div>`
      : `<div class="etq">¿Qué día del mes te llega?</div>
         <div class="paso-dia"><span>Día</span><div class="ctrl"><button id="dMenos" aria-label="Un día menos">−</button><b id="dDia">${i.dia}</b><button id="dMas" aria-label="Un día más">+</button></div></div>
         <div class="nota">Si el mes es más corto, cuenta el último día.</div>`;
    return {
      html: `<div class="emoji">${f.emoji}</div><h1>${tipo === 'otro' ? 'Otro ingreso' : esc(f.titulo)}</h1>
        <p class="ayuda">Pon lo normal. Si ${i.frec === 'mes' ? 'algún mes' : 'alguna semana'} es distinto, lo podrás cambiar solo esa vez.</p>
        ${tipo === 'otro' ? `<input id="iNomOtro" class="texto" type="text" maxlength="30" placeholder="¿Qué es? (ej: beca)" value="${esc(i.nombre)}" style="margin-bottom:18px">` : ''}
        <div class="tarjeta">

          ${seg('iFrec', [['semana', 'Cada semana'], ['mes', 'Cada mes']], i.frec)}

          ${selectorCuenta('iCuenta', i.cuenta, '¿Dónde te llega?')}

      alMontar() {
        const imp = $('iImporte');

        if ($('iNomOtro')) $('iNomOtro').oninput = e => { i.nombre = e.target.value; guardarBorrador(); actualizarBoton(); };
        segmento('iFrec', v => { i.frec = v; i.dia = 1; guardarBorrador(); pintar(true); });
        montarSelectorCuenta('iCuenta', v => { i.cuenta = v; });
        if ($('iDias')) $('iDias').querySelectorAll('button').forEach(b => b.onclick = () => { i.dia = +b.dataset.v; guardarBorrador(); pintar(true); });
        if ($('dMas')) {
          const cambia = d => { i.dia = ((i.dia - 1 + d + 31) % 31) + 1; $('dDia').textContent = i.dia; guardarBorrador(); };
          $('dMas').onclick = () => cambia(1); $('dMenos').onclick = () => cambia(-1);
        }

  },

  fijos: () => ({
    html: `<div class="emoji">📌</div><h1>¿Pagas algo fijo?</h1>
      <p class="ayuda">Cosas que se repiten: piso, móvil, gimnasio… Se restan antes de calcular lo que puedes gastar.</p>
      <div class="chips" id="fRapidos">${FIJOS_RAPIDOS.map(([e, n]) => `<button class="chip" data-e="${e}" data-n="${n}">${e} ${n}</button>`).join('')}</div>
      <div class="tarjeta ${B.fijos.length ? '' : 'oculto'}" id="fLista" style="margin-top:18px">
        ${B.fijos.map(x => `<div class="fijo" data-id="${x.id}">
          <span class="ico">${x.emoji}</span>
          <input class="nom" type="text" maxlength="30" value="${esc(x.nombre)}" placeholder="Nombre">

          ${B.cuentas.length > 1 ? `<button class="frec cta" title="Desde qué cuenta lo pagas">${emojiCuenta(nombreCuenta(cuentaValida(x.cuenta)))} ${esc(nombreCuenta(cuentaValida(x.cuenta)))}</button>` : ''}</div></div>`).join('')}
      </div>

      $('fRapidos').querySelectorAll('.chip').forEach(c => c.onclick = () => {

        const id = nuevoId();
        B.fijos.push({ id, emoji: c.dataset.e, nombre, importe: null, frec: 'mes', cuenta: cuentaValida('') });
        guardarBorrador(); pintar(true);
        const fila = document.querySelector(`.fijo[data-id="${id}"]`);
        (nombre ? fila.querySelector('.cant') : fila.querySelector('.nom')).focus();
      });
      document.querySelectorAll('.fijo').forEach(fila => {
        const x = B.fijos.find(y => y.id === fila.dataset.id);
        fila.querySelector('.nom').oninput = e => { x.nombre = e.target.value; guardarBorrador(); actualizarBoton(); };
        fila.querySelector('.cant').oninput = e => { x.importe = num(e.target.value); guardarBorrador(); actualizarBoton(); };
        if (fila.querySelector('.cta')) fila.querySelector('.cta').onclick = e => {
          const k = B.cuentas.findIndex(c => c.id === cuentaValida(x.cuenta));
          x.cuenta = B.cuentas[(k + 1) % B.cuentas.length].id; e.target.textContent = emojiCuenta(nombreCuenta(x.cuenta)) + ' ' + nombreCuenta(x.cuenta); guardarBorrador();
        };
        fila.querySelector('.frec:not(.cta):not(.dia)').onclick = e => { x.frec = x.frec === 'mes' ? 'semana' : 'mes'; x.dia = 1; e.target.textContent = x.frec === 'mes' ? 'al mes' : 'a la sem.'; fila.querySelector('.dia').textContent = textoDiaFijo(x); guardarBorrador(); };
        fila.querySelector('.dia').onclick = () => hojaDiaFijo(x, () => { fila.querySelector('.dia').textContent = textoDiaFijo(x); guardarBorrador(); });
        fila.querySelector('.quitar').onclick = () => { B.fijos = B.fijos.filter(y => y !== x); guardarBorrador(); pintar(true); };
      });
    }
  }),

  // 🐷 ¿Quieres guardar una parte? (de lo que tienes ahora) → va a la hucha. Lo demás: ¿hasta cuándo te tiene que durar?
  guardar: () => {
    const a = B.ahorro, varias = B.cuentas.length > 1;
    a.porCuenta = a.porCuenta || {};
    Object.keys(a.porCuenta).forEach(id => { if (!B.cuentas.some(c => c.id === id)) delete a.porCuenta[id]; });
    return {
      html: `<div class="emoji">🐷</div><h1>¿Quieres guardar una parte?</h1>
        <p class="ayuda">Tienes ${eur(totalSaldos())}. Lo que guardes va a tu hucha: no cuenta para gastar, pero podrás usarlo si hay un imprevisto.</p>
        <div class="opciones" id="oGuardar">
          ${opcion({ v: 'no', emoji: '💸', titulo: 'No, me lo puedo gastar todo', on: B.guardar === false })}
          ${opcion({ v: 'si', emoji: '🐷', titulo: 'Sí, quiero guardar una parte', on: B.guardar === true })}
        </div>
        ${B.guardar ? `<div class="tarjeta" style="margin-top:18px">
            <div class="sub" style="text-align:center;color:var(--sub);font-size:14px">¿Cuánto quieres guardar?</div>
            ${varias ? filasAhorroCuentas(B.cuentas, a.porCuenta)
              : `<input id="gImporte" class="importe" type="text" inputmode="decimal" enterkeyhint="done" placeholder="0 €" autocomplete="off" value="${fmtImporte(a.importe)}">`}
          </div>` : ''}
        <div id="gResto">${B.guardar === null ? '' : bloqueResto()}</div>`,
      alMontar() {
        elegirUna('oGuardar', v => { B.guardar = v === 'si'; if (B.guardar && !(a.importe > 0)) setTimeout(() => { const x = $('gImporte') || document.querySelector('.ah-imp'); if (x) x.focus(); }, 250); }, true);
        const resto = () => { $('gResto').innerHTML = B.guardar === null ? '' : bloqueResto(); montarResto(); actualizarBoton(); };
        const montarResto = () => {
          if (!$('rRapidas')) return;
          $('rRapidas').querySelectorAll('.chip').forEach(c => c.onclick = () => {
            if (c.dataset.f === 'otra') { B.restoHasta = ''; B.restoOtra = true; } else { B.restoHasta = c.dataset.f; B.restoOtra = false; }
            guardarBorrador(); resto(); if (c.dataset.f === 'otra' && $('rFecha')) $('rFecha').focus();
          });
          if ($('rFecha')) $('rFecha').onchange = e => { B.restoHasta = e.target.value; guardarBorrador(); resto(); };
        };
        montarResto();
        if (!B.guardar) return;
        if (varias) montarAhorroCuentas(a.porCuenta, () => { a.importe = sumaPorCuenta(a.porCuenta) || null; a.cuenta = cuentaMayor(a.porCuenta, a.cuenta); guardarBorrador(); resto(); });
        else { a.cuenta = cuentaValida(a.cuenta); $('gImporte').oninput = e => { a.importe = num(e.target.value); if (a.importe > 0) a.porCuenta = { [a.cuenta]: r2(a.importe) }; else a.porCuenta = {}; guardarBorrador(); resto(); }; }
      }
    };
  },

  // 🎯 ¿Estás ahorrando para algo? (uno o varios objetivos)
  objetivos: () => {
    const P = B.periodo === 'mes' ? 'mes' : 'semana';
    return {
      html: `<div class="emoji">🎯</div><h1>¿Estás ahorrando para algo?</h1>
        <p class="ayuda">Un viaje, un móvil, el carnet… Pre$u apartará un poco ${P === 'mes' ? 'cada mes' : 'cada semana'} para que llegues.</p>
        <div class="opciones" id="oTieneObj">
          ${opcion({ v: 'no', emoji: '🙅', titulo: 'No, de momento no', sub: 'Podrás crear objetivos cuando quieras', on: B.tieneObjetivos === false })}
          ${opcion({ v: 'si', emoji: '🎯', titulo: 'Sí, tengo un objetivo', on: B.tieneObjetivos === true && B.tipoObj !== 'colchon' })}
          ${opcion({ v: 'colchon', emoji: '🛟', titulo: 'Sí, quiero tener un colchón', sub: 'Ahorrar para imprevistos: hasta una cantidad o sin final', on: B.tieneObjetivos === true && B.tipoObj === 'colchon' })}
        </div>
        ${B.tieneObjetivos ? `${B.objetivos.length ? `<div class="tarjeta" style="margin-top:18px">${B.objetivos.map((o, i) => `<div class="fijo obj-b" data-i="${i}">
            <span class="ico">${o.emoji || '🎯'}</span><div class="txt-b"><b>${esc(o.nombre)}</b><span>${esc(resumenBorrador(o, P))}</span></div>
            <button class="quitar" data-q="${i}" aria-label="Quitar">✕</button></div>`).join('')}</div>` : ''}
          <button class="boton contorno" id="oAnadir" style="margin-top:14px">＋ ${B.objetivos.length ? 'Añadir otro objetivo' : B.tipoObj === 'colchon' ? 'Crear mi colchón' : 'Añadir mi objetivo'}</button>
          ${B.objetivos.length && !B.objetivos.some(o => o.colchon) ? '<button class="boton contorno" id="oColchon" style="margin-top:10px">🛟 Añadir un colchón</button>' : ''}` : ''}`,
      alMontar() {
        elegirUna('oTieneObj', v => { B.tieneObjetivos = v !== 'no'; B.tipoObj = v; }, true);
        if (!B.tieneObjetivos) return;
        const colchonPrimero = B.tipoObj === 'colchon' && !B.objetivos.length;
        $('oAnadir').onclick = () => hojaObjetivo(null, Object.assign(ctxBorrador(null), colchonPrimero ? { colchon: true } : {}));
        if ($('oColchon')) $('oColchon').onclick = () => hojaObjetivo(null, Object.assign(ctxBorrador(null), { colchon: true }));
        document.querySelectorAll('.obj-b').forEach(el => el.onclick = e => {
          if (e.target.closest('.quitar')) return;
          const o = B.objetivos[+el.dataset.i]; hojaObjetivo(o, ctxBorrador(o));
        });
        document.querySelectorAll('.obj-b .quitar').forEach(b => b.onclick = () => { B.objetivos.splice(+b.dataset.q, 1); guardarBorrador(); pintar(true); });
        if (!B.objetivos.length && !document.querySelector('.hoja')) setTimeout(() => { if ($('oAnadir') && !document.querySelector('.hoja')) $('oAnadir').click(); }, 350);
      }
    };
  },

  sobrante: () => {
    const p = palabraPeriodo(), sig = p === 'mes' ? 'Al mes siguiente' : 'A la semana siguiente';
    return {
      html: `<div class="emoji">🎯</div><h1>Si te sobra dinero ${p === 'mes' ? 'un mes' : 'una semana'}…</h1>
        <p class="ayuda">¿Qué hacemos con lo que no gastes?</p>
        <div class="opciones" id="oSobrante">
          ${opcion({ v: 'ahorro', emoji: '🐷', titulo: 'Guardarlo como ahorro', sub: 'Lo que sobra se va sumando a lo ahorrado', on: B.sobrante === 'ahorro' })}
          ${opcion({ v: 'siguiente', emoji: '➡️', titulo: sig, sub: p === 'mes' ? 'Lo que sobra se suma al mes siguiente' : 'Lo que sobra se suma a la semana siguiente', on: B.sobrante === 'siguiente' })}
          ${B.tieneObjetivos && B.objetivos.length ? opcion({ v: 'objetivos', emoji: '🎯', titulo: 'Guardarlo para tus objetivos', sub: B.objetivos.length > 1 ? 'Se reparte entre tus objetivos: más al que más le falta' : 'Se suma a «' + B.objetivos[0].nombre + '» y lo tendrás antes', on: B.sobrante === 'objetivos' }) : ''}
        </div>`,
      alMontar() {
        if (B.sobrante === 'objetivos' && !(B.tieneObjetivos && B.objetivos.length)) { B.sobrante = ''; guardarBorrador(); actualizarBoton(); }
        elegirUna('oSobrante', v => { B.sobrante = v; });
      }
    };
  },

  // ¿Cuánto tienes ahora? (lo que hay en el banco; con eso se gasta hasta que cobras)
  saldos: () => {
    B.saldos = B.saldos || {};
    Object.keys(B.saldos).forEach(id => { if (!B.cuentas.some(c => c.id === id)) delete B.saldos[id]; });
    const varias = B.cuentas.length > 1, uno = B.cuentas[0];
    const val = id => isFinite(B.saldos[id]) ? txtSaldo(B.saldos[id]) : '';
    return {
      html: `<div class="emoji">💳</div><h1>¿Cuánto tienes ahora?</h1>
        <p class="ayuda">Mira la app de tu banco y pon lo que hay ahora mismo${varias ? ' en cada cuenta' : ''}, ahorros incluidos. En el siguiente paso eliges si quieres guardar una parte.</p>
        <div class="tarjeta" style="margin-top:4px">
          ${varias ? `${B.cuentas.map(c => `<div class="saldo-fila"><span>${emojiCuenta(c.nombre)} ${esc(c.nombre.trim() || 'Sin nombre')}</span>
              <input class="s-imp" data-id="${c.id}" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0 €" value="${val(c.id)}"></div>`).join('')}
            <div class="ah-total"><span>Total</span><b id="sTotal">${eur(totalSaldos())}</b></div>`
          : `<div class="sub" style="text-align:center;color:var(--sub);font-size:14px">${emojiCuenta(uno.nombre)} ${esc(uno.nombre.trim())}</div>
            <input id="sImporte" class="importe" type="text" inputmode="decimal" enterkeyhint="done" placeholder="0 €" autocomplete="off" value="${val(uno.id)}">`}
        </div>
        <div id="sHoy">${bloqueHoy()}</div>`,
      alMontar() {
        const poner = (id, v) => { const n = num(v); if (isFinite(n)) B.saldos[id] = r2(n); else delete B.saldos[id]; };
        const cambio = () => { guardarBorrador(); actualizarBoton(); if ($('sTotal')) $('sTotal').textContent = eur(totalSaldos()); };
        cosasDeHoyBorrador().forEach(({ x }) => segmento('ht-' + x.id, v => { B.hoy[x.id] = v; guardarBorrador(); pintar(true); }));
        if (varias) document.querySelectorAll('.s-imp').forEach(i => i.oninput = () => { poner(i.dataset.id, i.value); cambio(); });
        else $('sImporte').oninput = e => { poner(uno.id, e.target.value); cambio(); };
        const primero = $('sImporte') || document.querySelector('.s-imp');
        if (primero && !primero.value) setTimeout(() => primero.focus(), 250);
      }
    };
  },

  // El plan: se calcula con las mismas cuentas que usará la app
  plan: () => {
    const d = datosDelBorrador(), h = hoyIso(), mes = d.periodo === 'mes', esteP = mes ? 'al mes' : 'a la semana';
    // Lo que te llega hoy y aún no tenías («Todavía no»): el plan cuenta con ello (en la app se preguntará «¿Te ha llegado?»)
    (d.hoyNo || []).forEach(id => { const it = d.ingresos.find(x => x.id === id); if (it) d.cambios[clave(it, d.creado)] = { importe: it.importe }; });
    const c = calcular(d, h), conCobro = hayIngresoMensual(d), c0 = inicioCiclo(d.creado);
    // Un periodo «normal»: el primero después de lo que tenías al empezar
    let p1 = siguientePeriodo(c.ini, d.periodo);
    if (!mes && conCobro) while (cicloDeSemana(d, p1) === c0) p1 = masDias(p1, 7);
    const r1 = calcular(d, h, p1), normal = r2(r1.entra + r1.deInicio + r1.deAhorros - r1.fijos - (r1.aObjetivos || 0));
    const cobro = conCobro && d.ingresos.some(x => x.frec === 'mes' && x.dia === d.diaMes) && (mes || primerCicloSem(d) === c0);
    const filas = [];
    if (c.deInicio) filas.push([d.inicialHasta ? `Lo que tienes ahora (${eur(d.inicial)} hasta el ${fechaCorta(d.inicialHasta)})`
      : c.ciclo && c.ciclo.arranque && c.ciclo.n > 1 ? `Lo que tienes ahora (${eur(d.inicial)} entre ${c.ciclo.n} semanas)` : 'Lo que tienes ahora', '+' + eur(c.deInicio)]);
    if (c.entra) filas.push(['Te entra', '+' + eur(c.entra)]);
    if (c.deAhorros) filas.push(['De tus ahorros', '+' + eur(c.deAhorros)]);
    if (c.fijos) filas.push(['Gastos fijos', '−' + eur(c.fijos)]);
    if (c.aObjetivos) filas.push(['🎯 Para tus objetivos', '−' + eur(c.aObjetivos)]);
    const hucha = d.ahorro ? d.ahorro.importe : 0;
    const despues = cobro ? 'Cuando cobres (' + fechaCorta(cicloSiguiente(c0)) + ')'
      : !mes && conCobro ? 'Desde el ' + fechaCorta(p1) : mes ? 'Los demás meses' : 'Las demás semanas';
    // ⚠️ Avisos (27/10, prueba de 16 personajes): empezar en negativo o casi a cero, los objetivos se lo llevan casi todo,
    // o «Hasta que cobre» con un ingreso pequeño (Pau: 900 € para 9 días y luego 40 € al mes)
    const aObj = r2(c.aObjetivos || 0), aObj1 = r2(r1.aObjetivos || 0);
    const pocoObj = (t, a) => a > 0 && t < 0.25 * (t + a);
    let alerta = '';
    if (c.total < 0 || normal < 0) alerta = aObj > 0 || aObj1 > 0
      ? `Tus objetivos piden más de lo que tienes ${mes ? 'este mes' : 'esta semana'}. Dales más tiempo o pon menos.`
      : `Pagas más de lo que tienes. Revisa las cantidades.`;
    else if (pocoObj(c.total, aObj) || pocoObj(normal, aObj1)) alerta = `Tus objetivos se llevan casi todo: te quedan unos ${eur(Math.min(c.total, normal))} ${esteP} para gastar. Si es poco, dales más tiempo o pon menos.`;
    // (28/10, q06) también por semanas: Bea tenía 1.124 € la primera semana y luego 74 €, sin aviso
    const acantilado = (B.restoHasta === 'cobro' || !B.restoHasta) && c.total > 100 && normal < c.total / 3;
    const alertaCobro = acantilado ? `Ojo: ahora tienes ${eur(c.total)} hasta el ${cobro ? fechaCorta(cicloSiguiente(c0)) : fechaCorta(masDias(p1, -1))} y después unos ${eur(normal)} ${esteP}. Si lo que tienes te tiene que durar más, elige una fecha.` : '';
    return {
      html: `<div class="emoji">🎉</div><h1>Listo, ${esc(B.nombre.trim())}</h1>
        <p class="ayuda">Este es tu plan:</p>
        <div class="tarjeta" style="text-align:center;padding:24px 18px">
          <div style="color:var(--sub);font-size:15px">${mes ? 'Este mes' : 'Esta semana'} puedes gastar</div>
          <div class="grande ${c.total < 0 ? 'neg' : 'pos'}">${eur(c.total)}</div>
          <div style="color:var(--sub);font-size:15px">${textoRangoD(d, c.ini, c.fin)}</div>
        </div>

// Fechas para «¿Hasta cuándo?» (ahorros para gastar y lo que tienes si no cobras cada mes)
function fechasRapidas() {

function datosDelBorrador() {

  const periodo = B.periodo || 'semana';

    version: 1,

// ---------- Fechas (siempre texto 'yyyy-MM-dd', hora local) ----------
const aUTC = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const deUTC = t => new Date(t).toISOString().slice(0, 10);
const masDias = (s, n) => deUTC(aUTC(s) + n * 864e5);
const diaSemana = s => ((new Date(aUTC(s)).getUTCDay() + 6) % 7) + 1;      // 1 = lunes … 7 = domingo
const lunesDe = s => masDias(s, 1 - diaSemana(s));
const diasDelMes = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();     // m: 1–12
const primeroDe = s => s.slice(0, 7) + '-01';
const finDeMes = s => { const [y, m] = s.split('-').map(Number); return s.slice(0, 8) + String(diasDelMes(y, m)).padStart(2, '0'); };
const mesSiguiente = s => { let [y, m] = s.split('-').map(Number); if (++m > 12) { m = 1; y++; } return y + '-' + String(m).padStart(2, '0') + '-01'; };
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fechaCorta = s => +s.slice(8) + ' ' + MESES[+s.slice(5, 7) - 1];
const mayus = s => s.charAt(0).toUpperCase() + s.slice(1);

// Periodos: una semana empieza en lunes; un mes, el día que cobras (DIA_MES; 1 = mes normal).
// Ej.: si cobras el 27, «tu mes» va del 27 al 26 del mes siguiente. Si el mes es más corto, el último día.
let DIA_MES = 1;
const fijarDiaMes = d => { DIA_MES = (d && d.diaMes) || 1; };
const diaEnMes = (s, dia) => { const [y, m] = s.split('-').map(Number); return s.slice(0, 8) + String(Math.min(dia, diasDelMes(y, m))).padStart(2, '0'); };
const inicioCiclo = s => { const c = diaEnMes(s, DIA_MES); return s >= c ? c : diaEnMes(masDias(primeroDe(s), -1), DIA_MES); };
const cicloSiguiente = c => diaEnMes(mesSiguiente(c), DIA_MES);
const finCiclo = c => masDias(cicloSiguiente(c), -1);

    const deAhorrado = r2(movs.filter(x => x.tipo === 'ingreso' && !x.destino && x.origen === 'ahorrado').reduce((s, x) => s + x.importe, 0));   // 💰 lo ahorrado que usas esta semana
    movs.forEach(x => { if (conDestino(x) && x.destino === 'objetivo' && objAcc[x.obj] != null) objAcc[x.obj] = r2(objAcc[x.obj] + x.importe); });

    const aApartar = r2(movs.filter(x => x.tipo === 'apartar').reduce((s, x) => s + x.importe, 0));
    let deRepartos = 0;
    trMovs.forEach(t => { if (t.desde <= p && p <= t.ultimo) deRepartos += cuotaTramo(t, p, P); });
    deRepartos = r2(deRepartos);
    let aRepartos = 0;

    aRepartos = r2(aRepartos);
    const aAnual = r2(anual.cargo(p));
    const gastado = movs.filter(x => x.tipo === 'gasto' && !x.hucha && !x.objetivo && !esRepartido(x)).reduce((s, x) => s + x.importe, 0);
    const total = entra + deInicio + deAhorros + deRepartos + deAhorrado - fijos - aObjetivos - aAnual - aRepartos - aApartar + arrastre + extras;

  const aHucha = r2(d.movimientos.filter(x => conDestino(x) && x.destino === 'hucha').reduce((s, x) => s + x.importe, 0));
  const hucha = a && a.modo === 'hucha' || aHucha > 0 ? r2((a && a.modo === 'hucha' ? a.importe : 0) + aHucha - d.movimientos.filter(x => x.hucha).reduce((s, x) => s + x.importe, 0)) : null;

  trMovs.forEach(t => { for (let p = siguientePeriodo(actual, P); p <= t.ultimo; p = siguientePeriodo(p, P)) if (p >= t.desde) repartosQueda += cuotaTramo(t, p, P); });

  let gastosRepQueda = 0;
  trGas.forEach(t => { for (let p = siguientePeriodo(actual, P); p <= t.ultimo; p = siguientePeriodo(p, P)) if (p >= t.desde) gastosRepQueda += cuotaTramo(t, p, P); });

  ahorrado -= d.movimientos.filter(x => (x.origen === 'capricho' || x.origen === 'ahorrado') && x.fecha <= finPeriodo(actual, P)).reduce((s, x) => s + x.importe, 0);

}
