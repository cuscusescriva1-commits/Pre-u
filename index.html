// ---------- Hoja que sube desde abajo ----------
let hojaActual = null;
function abrirHoja(construir) {
  document.querySelectorAll('.velo, .hoja').forEach(e => e.remove());
  const velo = document.createElement('div'), hoja = document.createElement('div');
  velo.className = 'velo'; hoja.className = 'hoja'; hoja.id = 'hoja';
  document.body.append(velo, hoja);
  hojaActual = construir; pintarHoja();
  void hoja.offsetHeight;   // para que se vea la animación
  velo.classList.add('ver'); hoja.classList.add('ver');
  velo.onclick = cerrarHoja;
  arrastrarHoja(hoja, velo);
}
// Arrastrar la hoja hacia abajo para cerrarla (como en iOS). Solo si está arriba del todo (si no, hace scroll).
function arrastrarHoja(hoja, velo) {
  let x0 = 0, y0 = 0, t0 = 0, dy = 0, estado = 'no';   // estado: '' (aún no se sabe) · 'arrastra' · 'no'
  const empezar = (x, y) => { x0 = x; y0 = y; t0 = Date.now(); dy = 0; estado = hoja.scrollTop <= 0 ? '' : 'no'; };
  const mover = (x, y, e) => {
    if (estado === 'no') return;
    const d = y - y0;
    if (estado === '') {
      if (Math.abs(d) < 6 && Math.abs(x - x0) < 6) return;
      if (d <= 0 || Math.abs(x - x0) > Math.abs(d)) { estado = 'no'; return; }   // hacia arriba o de lado: normal
      estado = 'arrastra'; hoja.style.transition = 'none'; velo.style.transition = 'none';
      if (document.activeElement && hoja.contains(document.activeElement)) document.activeElement.blur();
    }
    if (e.cancelable) e.preventDefault();
    dy = Math.max(0, d);
    hoja.style.transform = 'translate(-50%,' + dy + 'px)';
    velo.style.opacity = String(Math.max(0, 1 - dy / Math.max(hoja.offsetHeight, 1)));
  };
  const soltar = () => {
    if (estado !== 'arrastra') { estado = 'no'; return; }
    estado = 'no';
    const rapido = dy / Math.max(Date.now() - t0, 1) > 0.5;
    hoja.style.transition = ''; velo.style.transition = ''; hoja.style.transform = ''; velo.style.opacity = '';
    if (dy > Math.min(140, hoja.offsetHeight * 0.3) || (dy > 40 && rapido)) cerrarHoja();   // si no, vuelve a su sitio
  };
  hoja.addEventListener('touchstart', e => empezar(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
  hoja.addEventListener('touchmove', e => mover(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
  hoja.addEventListener('touchend', soltar);
  hoja.addEventListener('touchcancel', soltar);
  // Con ratón (para probar en el ordenador): arrastrando desde una zona sin botones
  hoja.addEventListener('mousedown', e => {
    if (e.button || e.target.closest('button, input, textarea, select, a, label')) return;
    empezar(e.clientX, e.clientY);
    const mm = ev => mover(ev.clientX, ev.clientY, ev);
    const mu = () => { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); soltar(); };
    document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
  });
}
function pintarHoja() {
  const h = hojaActual(), el = $('hoja');
  el.innerHTML = '<div class="asa"></div>' + h.html;
  if ($('hCancelar')) $('hCancelar').onclick = cerrarHoja;
  if (h.montar) h.montar();
}
function cerrarHoja() {
  const v = document.querySelector('.velo'), h = $('hoja');
  if (!h) return;
  if (document.activeElement) document.activeElement.blur();
  h.id = ''; v.classList.remove('ver'); h.classList.remove('ver');
  setTimeout(() => { v.remove(); h.remove(); }, 300);
}

function hojaMovimiento(id) {

  if (!m) return;
  const E = { importe: fmtImporte(m.importe), desc: m.desc, cat: m.cat || 'Otros', cuenta: cuentaApp(m.cuenta), fecha: m.fecha, hucha: !!m.hucha };

        ${D.cuentas.length > 1 ? `<div class="etq">${gasto ? '¿Con qué has pagado?' : '¿Dónde te ha llegado?'}</div><div class="chips" id="eCtas">${D.cuentas.map(k =>

// ---------- 📊 Resumen ----------
let resTodo = false;   // gasto por categoría: false = este periodo, true = desde el principio

// «Deberías tener» en una cuenta: el saldo que puso + lo que ha entrado − lo que ha salido de esa cuenta desde entonces
function saldoCuenta(c) {
  if (c.saldo == null) return null;
  const h = hoyIso(), desde = c.saldoFecha, ts = c.saldoEn || 0;
  let s = c.saldo;
  D.movimientos.forEach(m => {
    if (m.cuenta !== c.id || m.fecha > h) return;
    if (m.fecha > desde || (m.fecha === desde && (m.ts || 0) > ts)) s += m.tipo === 'ingreso' ? m.importe : -m.importe;
  });
  const diaSig = masDias(desde, 1);
  if (diaSig <= h) {
    D.ingresos.forEach(it => { if (it.cuenta === c.id) fechasDe(it, diaSig, h).forEach(f => { const x = D.cambios[clave(it, f)]; if (x && !x.no) s += x.importe; }); });
    D.fijos.forEach(it => { if (it.cuenta === c.id) fechasDe(it, diaSig, h).forEach(f => { const x = D.cambios[clave(it, f)]; s -= x ? (x.no ? 0 : x.importe) : it.importe; }); });
  }
  return r2(s);
}

function vistaResumen() {
  const c = calcular(D), h = hoyIso(), mes = D.periodo === 'mes', a = D.ahorro;
  const pct = c.total > 0 ? Math.min(100, Math.max(0, c.gastado / c.total * 100)) : (c.gastado > 0 ? 100 : 0);
  const dias = Math.round((aUTC(c.fin) - aUTC(h)) / 864e5) + 1;
  const porDia = c.queda > 0 ? `Te ${dias === 1 ? 'queda 1 día' : 'quedan ' + dias + ' días'} · unos ${eur(c.queda / dias)} al día` : (c.queda < 0 ? 'Te has pasado ' + eur(-c.queda) : 'No te queda nada para gastar');

  // Ahorros
  const ahorros = [];
  if (D.sobrante === 'ahorro') ahorros.push(['💰', 'Ahorrado', c.ahorrado > 0 ? 'Lo que te ha sobrado otras ' + (mes ? 'veces' : 'semanas') : 'Lo que te sobre se irá guardando aquí', eur(c.ahorrado)]);
  if (c.hucha !== null) {
    const usado = a.importe - c.hucha;
    ahorros.push(['🐷', 'Hucha', usado > 0 ? 'Has usado ' + eur(usado) + ' de ' + eur(a.importe) : 'Para imprevistos', eur(c.hucha)]);
  }
  if (c.gastarQueda !== null) ahorros.push(['💸', 'Ahorros para gastar', 'Se reparten hasta el ' + fechaCorta(a.hasta) + ' ' + a.hasta.slice(0, 4), eur(c.gastarQueda)]);

  // Deberías tener
  const saldos = D.cuentas.map(k => ({ k, s: saldoCuenta(k) }));
  const conSaldo = saldos.filter(x => x.s !== null);

  // Gasto por categoría (lo pagado con la hucha va aparte)
  // «Desde el principio» llega hasta el final de este periodo: lo apuntado para semanas o meses futuros aún no cuenta
  const gastos = D.movimientos.filter(m => m.tipo === 'gasto' && !m.hucha && m.fecha <= c.fin && m.fecha >= (resTodo ? fechaMin() : c.ini));
  const porCat = {};
  gastos.forEach(m => { porCat[m.cat || 'Otros'] = (porCat[m.cat || 'Otros'] || 0) + m.importe; });
  const cats = Object.entries(porCat).sort((x, y) => y[1] - x[1]);
  const totalCat = cats.reduce((t, x) => t + x[1], 0), maxCat = cats.length ? cats[0][1] : 0;
  const fila = ([ico, tit, sub, cant]) => `<div class="res-fila"><div class="ico">${ico}</div><div class="txt"><b>${tit}</b><span>${sub}</span></div><div class="cant">${cant}</div></div>`;

  return {
    html: `<div class="cab"><h1>Resumen</h1>${botonAjustes}</div>
      <div class="tarjeta periodo-res">
        <div class="hero-etq">${mes ? 'Este mes' : 'Esta semana'} has gastado</div>
        <div class="grande">${eur(c.gastado)}</div>
        <div class="sub-res">de ${eur(Math.max(0, c.total))} que tenías ${mes ? 'para el mes' : 'para la semana'}</div>
        <div class="barrita"><i class="${c.queda < 0 ? 'neg' : ''}" style="width:${pct}%"></i></div>
        <div class="pie"><span>${porDia}</span></div>
      </div>

      ${ahorros.length ? `<div class="tarjeta"><div class="tit-tarjeta">Tus ahorros</div>${ahorros.map(fila).join('')}</div>` : ''}

      <div class="tarjeta">
        <div class="cab-tarjeta"><div class="tit-tarjeta">Deberías tener</div></div>
        ${conSaldo.length ? saldos.map(x => fila([x.k.emoji, esc(x.k.nombre),
            x.s === null ? 'Sin saldo puesto' : 'Desde el ' + fechaCorta(x.k.saldoFecha), x.s === null ? '—' : `<span class="${x.s < 0 ? 'neg' : ''}">${eur(x.s)}</span>`])).join('')
          + (conSaldo.length > 1 ? `<div class="res-total"><span>Total</span><span>${eur(conSaldo.reduce((t, x) => t + x.s, 0))}</span></div>` : '')
          + (D.cuadrado === h
            ? `<div class="cuadre ok"><span>✓ Te cuadra · comprobado hoy</span><button class="enlace" id="rCuadraNo">Corregir</button></div>`
            : `<div class="cuadre"><span>¿Te cuadra con tu banco?</span><div class="cuadre-b"><button class="mini-b" id="rCuadraNo">No</button><button class="mini-b si" id="rCuadraSi">Sí</button></div></div>`)
          : `<p class="nota" style="margin:0 0 12px">Pon cuánto tienes ahora en ${D.cuentas.length > 1 ? 'cada cuenta' : D.cuentas[0] ? esc(D.cuentas[0].nombre) : 'tu cuenta'} y Pre$u te dirá cuánto deberías tener, para comprobar que no se te olvida apuntar nada.</p>
             <button class="boton contorno" id="rSaldos">Poner lo que tengo</button>`}
      </div>

      <div class="tarjeta">
        <div class="tit-tarjeta">Gasto por categoría</div>
        ${seg('rCat', [['periodo', mes ? 'Este mes' : 'Esta semana'], ['todo', 'Desde el principio']], resTodo ? 'todo' : 'periodo')}
        <div style="margin-top:10px">
        ${cats.length ? cats.map(([k, v]) => `<div class="cat-fila"><div class="arriba-cat"><span>${emojiCat(k)} ${esc(k)}</span><small>${Math.round(v / totalCat * 100)} %</small><b>${eur(v)}</b></div>
            <div class="barrita"><i style="width:${(v / maxCat * 100).toFixed(1)}%"></i></div></div>`).join('')
          + `<div class="res-total"><span>Total</span><span>${eur(totalCat)}</span></div>`
          : `<div class="vacio">${resTodo ? 'Aún no has apuntado gastos.' : 'Aún no has apuntado gastos ' + (mes ? 'este mes.' : 'esta semana.')}</div>`}
        </div>
      </div>`,
    montar() {
      if ($('rSaldos')) $('rSaldos').onclick = hojaCuadrar;
      if ($('rCuadraNo')) $('rCuadraNo').onclick = hojaCuadrar;
      if ($('rCuadraSi')) $('rCuadraSi').onclick = () => { D.cuadrado = hoyIso(); guardarDatos(); aviso('Perfecto, todo cuadra ✓'); pintarApp(); };
      segmento('rCat', v => { resTodo = v === 'todo'; pintarApp(); });
    }
  };
}

// Poner lo que hay en cada cuenta, o cuadrarlas si no coincide con el banco.
// - Cuenta sin saldo puesto: se guarda como punto de partida (no cambia el presupuesto).
// - Cuenta con saldo: si lo real no coincide con lo que dice Pre$u, la diferencia se apunta como «⚖️ Descuadre» hoy
//   (falta dinero → gasto; sobra → ingreso extra), así cambia lo que te queda para gastar. Antes se pide confirmar.
const txtSaldo = n => String(r2(n)).replace('.', ',');
function hojaCuadrar() {
  const mes = D.periodo === 'mes', h = hoyIso();
  const filas = D.cuentas.map(k => { const e = saldoCuenta(k); return { k, esperado: e, txt: e === null ? '' : txtSaldo(e) }; });
  const hayAlguno = filas.some(f => f.esperado !== null);
  const real = f => { const t = String(f.txt).trim(); return t ? num(t) : null; };
  const difs = () => filas.filter(f => f.esperado !== null && real(f) !== null && !isNaN(real(f)) && r2(real(f) - f.esperado) !== 0)
    .map(f => Object.assign({ d: r2(real(f) - f.esperado) }, f));
  const nuevos = () => filas.filter(f => f.esperado === null && real(f) !== null && !isNaN(real(f)));
  const lineaDif = f => {
    if (f.esperado === null) return '';
    const r = real(f), d = r === null || isNaN(r) ? 0 : r2(r - f.esperado);
    return d === 0 ? 'Pre$u dice ' + eur(f.esperado) : d < 0 ? `<b class="neg">Faltan ${eur(-d)}</b>` : `<b class="pos">Sobran ${eur(d)}</b>`;
  };
  let paso = 'poner';
  abrirHoja(() => {
    if (paso === 'poner') return {
      html: `<h2>${hayAlguno ? '¿Cuánto tienes de verdad?' : '¿Cuánto tienes ahora?'}</h2>
        <p class="ayuda">${hayAlguno ? 'Mira la app de tu banco y cambia lo que no cuadre. Pre$u apunta la diferencia por ti.'
          : 'Mira la app de tu banco (o tu cartera) y pon lo que tienes hoy. Desde aquí, Pre$u suma lo que entra y resta lo que gastas.'}</p>
        <div class="tarjeta">${filas.map((f, i) => `<div class="saldo-fila"><span>${f.k.emoji} ${esc(f.k.nombre)}${f.esperado !== null ? `<small id="cd${i}">${lineaDif(f)}</small>` : ''}</span>
          <input data-i="${i}" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0 €" value="${esc(f.txt)}"></div>`).join('')}</div>
        <div class="botones-hoja"><button class="boton" id="hGuardar">${hayAlguno ? 'Cuadrar' : 'Guardar'}</button><button class="boton sec" id="hCancelar">Cancelar</button></div>`,
      montar() {
        document.querySelectorAll('.saldo-fila input').forEach(inp => {
          inp.oninput = () => { const f = filas[+inp.dataset.i]; f.txt = inp.value; if ($('cd' + inp.dataset.i)) $('cd' + inp.dataset.i).innerHTML = lineaDif(f); };
          inp.onfocus = () => inp.select();
        });
        const vacio = document.querySelector('.saldo-fila input[value=""]');
        if (!hayAlguno && vacio) setTimeout(() => vacio.focus(), 300);
        $('hGuardar').onclick = () => {
          const mal = filas.find(f => real(f) !== null && isNaN(real(f)));
          if (mal) return aviso('Revisa la cantidad de ' + mal.k.nombre);
          if (difs().length) { paso = 'confirmar'; return pintarHoja(); }
          guardarCuadre([], nuevos());
        };
      }
    };
    // Paso 2: confirmar (cambia lo que te queda para gastar)
    const ds = difs(), neto = r2(ds.reduce((t, f) => t + f.d, 0)), c = calcular(D), despues = r2(c.queda + neto);
    const cuando = mes ? 'este mes' : 'esta semana';
    return {
      html: `<h2>¿Cuadramos tus cuentas?</h2>
        <p class="ayuda">Se apuntará la diferencia como <b>⚖️ Descuadre</b> con fecha de hoy.</p>
        <div class="tarjeta">${ds.map(f => `<div class="saldo-fila"><span>${f.k.emoji} ${esc(f.k.nombre)}<small>${f.d < 0 ? 'Gastos sin apuntar' : 'Dinero que no habías apuntado'}</small></span>
          <b class="${f.d < 0 ? 'neg' : 'pos'}">${f.d < 0 ? '−' : '+'}${eur(Math.abs(f.d))}</b></div>`).join('')}</div>
        ${neto !== 0 ? `<div class="tarjeta cuadre-efecto"><span>Te queda ${cuando}</span>
          <div><s>${eur(c.queda)}</s> → <b class="${despues < 0 ? 'neg' : ''}">${eur(despues)}</b></div></div>
          ${despues < 0 ? `<p class="nota" style="margin:8px 6px 0">Lo que falte se restará ${mes ? 'del mes que viene' : 'de la semana que viene'}.</p>` : ''}`
        : `<p class="nota" style="margin:8px 6px 0">Una cuenta sube y otra baja lo mismo: lo que te queda ${cuando} no cambia.</p>`}
        <div class="botones-hoja"><button class="boton" id="hConfirmar">Confirmar</button><button class="boton sec" id="hCancelar">Cancelar</button></div>`,
      montar() { $('hConfirmar').onclick = () => guardarCuadre(ds, nuevos()); }
    };
  });
  function guardarCuadre(ds, ns) {
    const ahora = Date.now();
    ds.forEach((f, i) => D.movimientos.push({ id: nuevoId(), tipo: f.d < 0 ? 'gasto' : 'ingreso', importe: Math.abs(f.d), desc: 'Descuadre',
      cat: 'Descuadre', cuenta: f.k.id, fecha: h, ts: ahora + i, origen: 'cuadre' }));
    ns.forEach(f => Object.assign(f.k, { saldo: r2(real(f)), saldoFecha: h, saldoEn: ahora + 50 }));
    if (ds.length || hayAlguno) D.cuadrado = h;
    guardarDatos(); cerrarHoja();
    aviso(ds.length ? 'Cuentas cuadradas ✓' : ns.length ? 'Guardado ✓' : 'Todo cuadra ✓'); pintarApp();
  }
}

// ---------- ⚙️ Ajustes ----------
const activo = it => !it.hasta || it.hasta >= hoyIso();
const descFijo = it => eur(it.importe) + (it.frec === 'mes' ? ' al mes · día ' + it.dia : ' a la semana · ' + DIAS_NOMBRE[it.dia])
  + (D.cuentas.length > 1 ? ' · ' + nombreCta(it.cuenta) : '');

// Ajustes es un menú (como en iOS): cada apartado se abre en su propia pantalla
let subAj = '';   // '' = el menú · perfil · apariencia · ingresos · fijos · ahorros · cuentas · categorias · applepay
const APARTADOS = {

  apariencia: ['🎨', 'Apariencia'],

  ahorros:    ['🐷', 'Ahorros'],
  cuentas:    ['🏦', 'Cuentas'],
  categorias: ['🏷️', 'Categorías'],
  applepay:   ['📲', 'Apple Pay']
};
function irAjuste(k) { subAj = k; pintarApp(true); window.scrollTo(0, 0); }

      montar() {

        document.querySelectorAll('.menu-aj .mov').forEach(el => el.onclick = () => irAjuste(el.dataset.s));
        $('bBorrar').onclick = () => {
          if (!confirm('¿Seguro? Se borrará todo lo que tienes en Pre$u y volverás a empezar.')) return;
          localStorage.removeItem('presu'); localStorage.removeItem('presu_borrador');
          D = null; F = null; vista = 'inicio'; subAj = ''; B = VACIO(); direccion = 1;
          pintar(); window.scrollTo(0, 0);
        };

  // ----- Cada apartado -----
  const cuerpo = {
    perfil: `<div class="tarjeta"><div class="ajuste-fila"><span>🙂 Tu nombre</span><input id="jNombre" type="text" maxlength="30" value="${esc(D.nombre)}" enterkeyhint="done"></div></div>
      <div class="tarjeta">

        <div class="etq">Si te sobra dinero…</div>

      </div>

        <div class="txt"><b>Tu mes empieza el día ${DIA_MES}</b><span>${D.ingresos.some(x => x.frec === 'mes' && x.dia === DIA_MES) ? 'El día que cobras' : 'Lo mensual va de ese día al anterior'}</span></div><div class="ir">›</div></div></div>` : ''}`,
    apariencia: `<div class="tarjeta">${seg('jTema', [['auto', 'Automático'], ['claro', '☀️ Claro'], ['oscuro', '🌙 Oscuro']], temaActual())}</div>

      ${nota('Si cambias una cantidad, cuenta desde hoy: lo de antes no cambia. Para cambiarlo solo una vez, hazlo desde Movimientos.')}`,

        <div class="txt"><b>Tus ahorros</b><span style="white-space:normal">${esc(descAhorro)}</span></div><div class="ir">›</div></div></div>
      ${a && a.porCuenta && Object.keys(a.porCuenta).length > 1 ? nota('Lo tienes en: ' + Object.entries(a.porCuenta).map(([id, x]) => esc(nombreCta(id)) + ' ' + eur(x)).join(' · ')) : ''}
      ${a && a.modo === 'gastar' ? nota('Se reparten a partes iguales hasta esa fecha: cada ' + (mes ? 'mes' : 'semana') + ' se suma un trozo a lo que puedes gastar. Por eso lo que queda va bajando.') : ''}`,
    cuentas: `<div class="tarjeta lista" id="jCuentas">${D.cuentas.map(k => `<div class="mov" data-id="${k.id}"><div class="ico">${k.emoji}</div>
        <div class="txt"><b>${esc(k.nombre)}</b>${k.saldo != null ? `<span>Saldo puesto el ${fechaCorta(k.saldoFecha)}</span>` : ''}</div><div class="ir">›</div></div>`).join('')}
        <button class="anadir" id="jAddCta">＋ Añadir cuenta</button></div>
      ${nota('Lo que tienes en cada cuenta se pone en Resumen → Deberías tener.')}`,
    categorias: `<div class="tarjeta"><div class="chips" id="jCats">${D.categorias.map(k => `<button class="chip" data-v="${esc(k)}">${emojiCat(k)} ${esc(k)}<span class="x">✕</span></button>`).join('')}</div>
        <div class="fila-anadir"><input id="jNuevaCat" class="texto campo" type="text" maxlength="20" placeholder="Nueva categoría" enterkeyhint="done"><button class="mini-b" id="jAddCat">Añadir</button></div></div>

      ${cuerpo}`,
    montar() {

        el.onblur = e => { if (!e.target.value.trim()) e.target.value = D.nombre; };

      si('jTema', () => segmento('jTema', v => { aplicarTema(v); pintarApp(); }));
      si('jDiaMes', el => el.onclick = hojaDiaMes);

        D.categorias = D.categorias.filter(k => k !== b.dataset.v); guardarDatos(); pintarApp();
      });
      const addCat = () => {
        const n = $('jNuevaCat').value.trim();
        if (!n) return aviso('Escribe el nombre');
        if (D.categorias.some(k => k.toLowerCase() === n.toLowerCase())) return aviso('Ya la tienes');
        D.categorias.splice(Math.max(0, D.categorias.indexOf('Otros') < 0 ? D.categorias.length : D.categorias.indexOf('Otros')), 0, n);
        guardarDatos(); aviso('Añadida ✓'); pintarApp();
      };
      si('jAddCat', el => el.onclick = addCat);
      si('jNuevaCat', el => el.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); addCat(); } });
      si('jApplePay', el => el.onclick = () => { D.applePay = !D.applePay; guardarDatos(); pintarApp(); if (D.applePay) hojaGuiaApplePay(); });
      si('jGuiaAP', el => el.onclick = hojaGuiaApplePay);
    }
  };
}

// Cambiar el día en que empieza «tu mes» (el día que cobras): se recalcula todo con el nuevo día
function hojaDiaMes() {
  let dia = DIA_MES;
  const cobro = D.ingresos.filter(x => x.frec === 'mes' && !x.hasta).sort((a, b) => b.importe - a.importe)[0];
  abrirHoja(() => ({
    html: `<h2>📅 ¿Qué día empieza tu mes?</h2>
      <p class="ayuda">Normalmente, el día que cobras. Lo mensual (ingresos y gastos fijos) se reparte desde ese día hasta el día antes del mes siguiente.</p>
      <div class="tarjeta"><div class="paso-dia"><span>Día</span><div class="ctrl"><button id="dMenos" aria-label="Un día menos">−</button><b id="dDia">${dia}</b><button id="dMas" aria-label="Un día más">+</button></div></div>
        ${cobro ? `<div class="nota" style="margin-top:10px">${esc(cobro.nombre)} te llega el día ${cobro.dia}.</div>` : ''}</div>
      <div class="botones-hoja"><button class="boton" id="hGuardar">Guardar</button><button class="boton sec" id="hCancelar">Cancelar</button></div>`,
    montar() {
      const ver = () => { $('dDia').textContent = dia; };
      $('dMenos').onclick = () => { dia = dia > 1 ? dia - 1 : 31; ver(); };
      $('dMas').onclick = () => { dia = dia < 31 ? dia + 1 : 1; ver(); };
      $('hGuardar').onclick = () => {
        if (dia === DIA_MES) return cerrarHoja();
        // Los ahorros para gastar por meses: se vuelve a repartir el total hasta la misma fecha
        if (D.periodo === 'mes' && D.ahorro && D.ahorro.modo === 'gastar') {
          const t = tramosAhorro(D); D.ahorro.importe = r2(t.reduce((s, x) => s + sumaTramo(x, 'mes'), 0)); delete D.repartoAhorro;
        }
        D.diaMes = dia; fijarDiaMes(D); movIni = null;
        guardarDatos(); cerrarHoja(); aviso('Tu mes empieza el día ' + dia); pintarApp();
      };
    }
  }));
}

// Pasar de semanas a meses (o al revés): se recalcula todo con el nuevo periodo
function cambiarPeriodo(v) {
  if (!confirm(v === 'mes' ? '¿Ver tu dinero por meses? Se recalcula todo por meses.' : '¿Ver tu dinero por semanas? Se recalcula todo por semanas (lo mensual se reparte entre las semanas).')) return pintarApp();
  // Los ahorros para gastar: se vuelve a repartir el total hasta la misma fecha
  if (D.ahorro && D.ahorro.modo === 'gastar') {
    const P = D.periodo, t = tramosAhorro(D);
    D.ahorro.importe = r2(t.reduce((s, x) => s + sumaTramo(x, P), 0));
    delete D.repartoAhorro;
  }
  D.periodo = v; movIni = null; guardarDatos();
  aviso(v === 'mes' ? 'Ahora lo ves por meses' : 'Ahora lo ves por semanas'); pintarApp();
}

// Guardar un ingreso o gasto fijo: si cambia algo que afecta a las cuentas, la versión vieja acaba ayer y la nueva empieza hoy
function guardarItem(lista, orig, nuevo) {
  const h = hoyIso();
  if (!orig) { lista.push(Object.assign({ id: nuevoId(), desde: h }, nuevo)); return; }
  const cambia = ['importe', 'frec', 'dia', 'cuenta'].some(k => orig[k] !== nuevo[k]);
  if (!cambia || orig.desde === h) { Object.assign(orig, nuevo); return; }
  const nueva = Object.assign({}, orig, nuevo, { id: nuevoId(), desde: h });
  delete nueva.hasta;
  orig.hasta = masDias(h, -1); orig.nombre = nuevo.nombre;
  // Lo ya contestado para hoy o más adelante pasa a la versión nueva
  Object.keys(D.cambios).forEach(k => { const [id, f] = k.split('|'); if (id === orig.id && f >= h) { D.cambios[nueva.id + '|' + f] = D.cambios[k]; delete D.cambios[k]; } });
  lista.splice(lista.indexOf(orig) + 1, 0, nueva);
}
function quitarItem(lista, orig) {
  const h = hoyIso();
  Object.keys(D.cambios).forEach(k => { const [id, f] = k.split('|'); if (id === orig.id && f >= h) delete D.cambios[k]; });
  if (orig.desde === h) lista.splice(lista.indexOf(orig), 1);   // creado hoy: se quita del todo
  else orig.hasta = masDias(h, -1);                              // lo de antes se queda como estaba
}

function hojaItem(tipo, orig) {
  const ing = tipo === 'ingreso', lista = ing ? D.ingresos : D.fijos;
  const E = orig ? { nombre: orig.nombre, importe: fmtImporte(orig.importe), frec: orig.frec, dia: orig.dia || 1, cuenta: cuentaApp(orig.cuenta) }
    : { nombre: '', importe: '', frec: 'mes', dia: 1, cuenta: cuentaApp(D.ultimaCuenta) };
  abrirHoja(() => ({
    html: `<h2>${orig ? orig.emoji + ' ' + esc(orig.nombre) : ing ? '✨ Nuevo ingreso' : '📌 Nuevo gasto fijo'}</h2>
      <p class="ayuda">${orig ? 'Si cambias la cantidad, el día o la cuenta, cuenta desde hoy. Lo de antes no cambia.' : 'Se ' + (ing ? 'sumará' : 'restará') + ' solo cada vez que toque, desde hoy.'}</p>
      <div class="tarjeta">
        <input id="iNom" class="texto campo" type="text" maxlength="30" placeholder="${ing ? 'Nombre (ej: beca)' : 'Nombre (ej: gimnasio)'}" value="${esc(E.nombre)}">
        <input id="iImp" class="importe" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0 €" value="${esc(E.importe)}" style="margin-top:8px">
        <div class="etq">¿Cada cuánto?</div>
        ${seg('iFrec', [['semana', 'Cada semana'], ['mes', 'Cada mes']], E.frec)}
        ${E.frec === 'semana'
          ? `<div class="etq">¿Qué día?</div><div class="dias" id="iDias">${DIAS_SEM.map((d, k) => `<button data-v="${k + 1}" class="${E.dia === k + 1 ? 'on' : ''}">${d}</button>`).join('')}</div>`
          : `<div class="etq">¿Qué día del mes?</div><div class="paso-dia"><span>Día</span><div class="ctrl"><button id="dMenos" aria-label="Un día menos">−</button><b id="dDia">${E.dia}</b><button id="dMas" aria-label="Un día más">+</button></div></div>
             <div class="nota">Si el mes es más corto, cuenta el último día.</div>`}
        ${D.cuentas.length > 1 ? `<div class="etq">${ing ? '¿Dónde te llega?' : '¿Desde qué cuenta lo pagas?'}</div><div class="chips" id="iCtas">${D.cuentas.map(k =>
          `<button class="chip ${E.cuenta === k.id ? 'on' : ''}" data-v="${k.id}">${k.emoji} ${esc(k.nombre)}</button>`).join('')}</div>` : ''}
      </div>
      <div class="botones-hoja">
        <button class="boton" id="hGuardar">${orig ? 'Guardar cambios' : 'Añadir'}</button>
        ${orig ? `<button class="boton rojo-txt" id="hQuitar">${ing ? 'Ya no lo recibo' : 'Ya no lo pago'}</button>` : ''}
        <button class="boton sec" id="hCancelar">Cancelar</button>
      </div>`,
    montar() {
      $('iNom').oninput = e => { E.nombre = e.target.value; };
      $('iImp').oninput = e => { E.importe = e.target.value; };
      segmento('iFrec', v => { if (v !== E.frec) { E.frec = v; E.dia = 1; pintarHoja(); } });
      document.querySelectorAll('#iDias button').forEach(b => b.onclick = () => { E.dia = +b.dataset.v; pintarHoja(); });
      if ($('dMas')) { const mover = n => { E.dia = ((E.dia - 1 + n + 31) % 31) + 1; $('dDia').textContent = E.dia; }; $('dMas').onclick = () => mover(1); $('dMenos').onclick = () => mover(-1); }
      document.querySelectorAll('#iCtas .chip').forEach(b => b.onclick = () => { E.cuenta = b.dataset.v; pintarHoja(); });
      if (!orig) setTimeout(() => $('iNom') && $('iNom').focus(), 300);
      $('hGuardar').onclick = () => {
        const n = num(E.importe);
        if (!E.nombre.trim()) return aviso('Ponle un nombre');
        if (!(n > 0)) return aviso('Escribe la cantidad');
        const nuevo = { nombre: E.nombre.trim(), importe: r2(n), frec: E.frec, dia: E.dia, cuenta: E.cuenta };
        if (!orig) Object.assign(nuevo, ing ? { tipo: 'otro', emoji: '✨' } : { emoji: '📌' });
        guardarItem(lista, orig, nuevo);
        guardarDatos(); cerrarHoja(); aviso(orig ? 'Guardado ✓' : 'Añadido ✓'); pintarApp();
      };
      if ($('hQuitar')) $('hQuitar').onclick = () => {
        if (!confirm('¿Quitar «' + orig.nombre + '»? Lo de antes se queda como estaba.')) return;
        quitarItem(lista, orig); guardarDatos(); cerrarHoja(); aviso('Quitado'); pintarApp();
      };
    }
  }));
}

function hojaAhorro() {
  const P = D.periodo, h = hoyIso(), act = inicioPeriodo(h, P), c = calcular(D), a = D.ahorro;
  const E = { modo: a ? a.modo : 'nada', cuenta: cuentaApp(a && a.cuenta),
    importe: !a ? '' : fmtImporte(a.modo === 'hucha' ? c.hucha : r2(c.deAhorros + c.gastarQueda)), hasta: a && a.hasta && a.hasta > h ? a.hasta : '' };
  // Varias cuentas: cuánto hay en cada una (si lo de antes ya no cuadra con lo que queda, se pone todo en la cuenta principal)
  const varias = D.cuentas.length > 1;
  E.porCuenta = a && a.porCuenta && sumaPorCuenta(a.porCuenta) === r2(num(E.importe) || 0) ? Object.assign({}, a.porCuenta)
    : (num(E.importe) > 0 ? { [E.cuenta]: r2(num(E.importe)) } : {});
  abrirHoja(() => ({
    html: `<h2>🐷 Ahorros</h2>
      <p class="ayuda">El dinero que tienes guardado. Lo que cambies cuenta desde ${P === 'mes' ? 'este mes' : 'esta semana'}.</p>
      ${seg('aModo', [['nada', 'No tengo'], ['gastar', '💸 Para gastar'], ['hucha', '🐷 Hucha']], E.modo)}
      ${E.modo === 'nada' ? '' : `<div class="tarjeta" style="margin-top:14px">
        <div class="etq" style="margin-top:0;text-align:center">${E.modo === 'hucha' ? '¿Cuánto hay en la hucha?' : '¿Cuánto te queda para repartir?'}</div>
        ${varias ? filasAhorroCuentas(D.cuentas, E.porCuenta)
          : `<input id="aImpA" class="importe" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0 €" value="${esc(E.importe)}">`}
        ${E.modo === 'gastar' ? `<div class="etq">¿Hasta cuándo quieres que te dure?</div>
          <input id="aHasta" class="texto campo" type="date" min="${masDias(h, 1)}" value="${E.hasta}">` : `<div class="nota" style="text-align:center">No cuenta para gastar. Si hay un imprevisto, al apuntar un gasto podrás pagar con la hucha.</div>`}
      </div>`}
      <div class="botones-hoja"><button class="boton" id="hGuardar">Guardar</button><button class="boton sec" id="hCancelar">Cancelar</button></div>`,
    montar() {
      segmento('aModo', v => { if (v !== E.modo) { E.modo = v; E.importe = ''; E.porCuenta = {}; pintarHoja(); } });
      if ($('aImpA')) $('aImpA').oninput = e => { E.importe = e.target.value; };
      if (varias) montarAhorroCuentas(E.porCuenta, () => { E.cuenta = cuentaMayor(E.porCuenta, E.cuenta); });
      if ($('aHasta')) $('aHasta').onchange = e => { E.hasta = e.target.value; };
      $('hGuardar').onclick = () => {
        const n = varias ? sumaPorCuenta(E.porCuenta) : num(E.importe);
        if (E.modo !== 'nada' && (varias ? !(n > 0) : !(n >= 0))) return aviso(varias ? 'Escribe cuánto tienes en cada cuenta' : 'Escribe la cantidad');
        if (E.modo === 'gastar' && !(E.hasta > h)) return aviso('Elige hasta cuándo (una fecha futura)');
        // Lo ya repartido en periodos anteriores se queda igual; lo nuevo empieza en este periodo
        const ant = periodoAnterior(act, P);
        const tramos = tramosAhorro(D).map(t => Object.assign({}, t, { ultimo: t.ultimo < act ? t.ultimo : ant })).filter(t => t.ultimo >= t.desde);
        if (E.modo === 'gastar') {
          const ultimo = inicioPeriodo(E.hasta, P);
          tramos.push({ desde: act, ultimo, n: Math.max(1, contarPeriodos(act, ultimo, P)), total: r2(n) });
        }
        D.repartoAhorro = tramos;
        if (E.modo === 'nada') D.ahorro = null;
        else if (E.modo === 'hucha') {
          const usado = D.movimientos.filter(m => m.hucha).reduce((s, m) => s + m.importe, 0);
          D.ahorro = { importe: r2(n + usado), modo: 'hucha', hasta: '', cuenta: E.cuenta };   // así te quedan justo los n €
        } else D.ahorro = { importe: r2(n), modo: 'gastar', hasta: E.hasta, cuenta: E.cuenta };
        if (D.ahorro && varias) D.ahorro.porCuenta = Object.assign({}, E.porCuenta);
        guardarDatos(); cerrarHoja(); aviso('Guardado ✓'); pintarApp();
      };
    }
  }));
}

function hojaCuenta(k) {
  let nombre = k ? k.nombre : '';
  abrirHoja(() => ({
    html: `<h2>${k ? k.emoji + ' ' + esc(k.nombre) : '🏦 Nueva cuenta'}</h2>
      <p class="ayuda">${k ? 'Cámbiale el nombre o quítala.' : 'Un banco, una tarjeta o efectivo.'}</p>
      <div class="tarjeta"><input id="cNom" class="texto campo" type="text" maxlength="24" placeholder="Nombre (ej: Revolut, Efectivo)" value="${esc(nombre)}" enterkeyhint="done">
        ${k ? '' : `<div class="chips" id="cRap" style="margin-top:12px">${['Revolut', 'BBVA', 'Santander', 'CaixaBank', 'ING', 'Efectivo'].filter(n => !D.cuentas.some(c => c.nombre.toLowerCase() === n.toLowerCase()))
          .map(n => `<button class="chip" data-v="${n}">${emojiCuenta(n)} ${n}</button>`).join('')}</div>`}</div>
      <div class="botones-hoja"><button class="boton" id="hGuardar">${k ? 'Guardar' : 'Añadir'}</button>
        ${k && D.cuentas.length > 1 ? '<button class="boton rojo-txt" id="hQuitar">Quitar cuenta</button>' : ''}
        <button class="boton sec" id="hCancelar">Cancelar</button></div>`,
    montar() {
      $('cNom').oninput = e => { nombre = e.target.value; };
      document.querySelectorAll('#cRap .chip').forEach(b => b.onclick = () => { nombre = b.dataset.v; $('cNom').value = nombre; });
      if (!k) setTimeout(() => $('cNom') && $('cNom').focus(), 300);
      $('hGuardar').onclick = () => {
        const n = nombre.trim();
        if (!n) return aviso('Ponle un nombre');
        if (D.cuentas.some(c => c !== k && c.nombre.toLowerCase() === n.toLowerCase())) return aviso('Ya tienes una cuenta con ese nombre');
        if (k) Object.assign(k, { nombre: n, emoji: emojiCuenta(n) });
        else D.cuentas.push({ id: nuevoId(), nombre: n, emoji: emojiCuenta(n) });
        guardarDatos(); cerrarHoja(); aviso(k ? 'Guardado ✓' : 'Cuenta añadida ✓'); pintarApp();
      };
      if ($('hQuitar')) $('hQuitar').onclick = () => {
        const otra = D.cuentas.find(c => c !== k);
        if (!confirm('¿Quitar «' + k.nombre + '»? Lo que estaba en ella pasará a «' + otra.nombre + '».')) return;
        [...D.ingresos, ...D.fijos, ...D.movimientos].forEach(x => { if (x.cuenta === k.id) x.cuenta = otra.id; });
        if (D.ahorro && D.ahorro.cuenta === k.id) D.ahorro.cuenta = otra.id;
        if (D.ahorro && D.ahorro.porCuenta && D.ahorro.porCuenta[k.id]) {
          D.ahorro.porCuenta[otra.id] = r2((D.ahorro.porCuenta[otra.id] || 0) + D.ahorro.porCuenta[k.id]); delete D.ahorro.porCuenta[k.id];
        }
        if (D.ultimaCuenta === k.id) D.ultimaCuenta = otra.id;
        D.cuentas = D.cuentas.filter(c => c !== k);
        guardarDatos(); cerrarHoja(); aviso('Cuenta quitada'); pintarApp();
      };
    }
  }));
}

pintar();

// Para que se pueda instalar y abra sin internet (solo funciona en un servidor, como GitHub Pages o el simulador)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
