    </div>` : '';
  const pregunta = p ? `<div class="tarjeta pregunta">
      <div class="preg-tit">${p.item.emoji} ¿Te ha llegado ${esc(fraseIngreso(p.item))}?</div>
      <div class="preg-sub">${p.fecha === h ? 'Toca hoy' : 'Tocaba el ' + fechaCorta(p.fecha)} · ${eur(p.item.importe)}${paraSiguiente(p.item) && p.fecha >= c.fin ? ' · para ' + (mes ? 'el mes que viene' : 'la semana que viene') : ''}</div>
      <div class="preg-bot"><button class="mini-b si" id="pSi">Sí</button><button class="mini-b" id="pOtra">Otra cantidad</button><button class="mini-b" id="pNo">No</button></div>
      ${otraCantidad ? `<div class="preg-otra"><input id="pImporte" class="texto" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="¿Cuánto te ha llegado?"><button class="mini-b si" id="pGuardar">Guardar</button></div>` : ''}
      ${c.pendientes.length > 1 ? `<div class="nota">Tienes ${c.pendientes.length - 1} más por confirmar.</div>` : ''}
    </div>` : '';

  // ⏳ Esperando un ingreso fijo que ya tocaba (27/10, Carmen y Mercedes veían −885 € el día de cobro): se enseña lo que te quedará
  let espera = null;
  if (c.pendientes.length) {
    const d2 = JSON.parse(JSON.stringify(D));
    c.pendientes.forEach(x => { d2.cambios[clave(x.item, x.fecha)] = { importe: x.item.importe }; });
    const q2 = calcular(d2).queda;
    if (Math.abs(q2 - c.queda) > 0.5) {
      const its = [...new Set(c.pendientes.map(x => x.item))];
      espera = { queda: q2, total: calcular(d2).total, txt: its.length === 1 ? fraseIngreso(its[0]) + ' (' + eur(its[0].importe) + ')' : 'lo que esperas' };
      filas.splice(0, 0, ['⏳ ' + (its.length === 1 ? mayus(fraseIngreso(its[0])) : 'Lo que esperas') + ' · por contestar', '+' + eur(r2(q2 - c.queda))]);
    }
  }
  // (q25) Mientras esperas un ingreso, la barra y la frase van con «Te quedará»
  const qH = espera ? espera.queda : c.queda, tH = espera ? espera.total : c.total;
  const pctH = qH < 0 ? 100 : tH > 0 ? Math.min(100, qH / tH * 100) : 0;
  // 💰 Vienes en negativo y tienes algo ahorrado: ¿lo cubrimos? (27/10, decidido por Carles: se propone, no se hace solo)
  const falta = r2(-(c.arrastre + (c.deAhorrado || 0)));   // lo que viene en negativo, menos lo que ya has cubierto este periodo
  const cubrir = falta >= 5 && c.ahorrado > 0.004 && D.cubrirNo !== c.ini ? r2(Math.min(c.ahorrado, falta)) : 0;   // (q27) por menos de 5 € no se pregunta
  // 🎉 Te ha sobrado mucho de antes (más del doble de lo normal): ¿qué hacemos? (27/10, decidido por Carles)
  const normalP = normalPeriodo(c), sv = D.sobraVisto || {};
  // (lo que ya apartaste este periodo no cuenta; y después de elegir, no vuelve a salir en 4 semanas salvo que crezca mucho)
  const disp = r2(c.arrastre - (c.aApartar || 0));
  const calma = sv.p && contarPeriodos(sv.p, c.ini, D.periodo) <= 4 && disp < (sv.cant || 0) + 2 * Math.max(normalP, 10);
  const sobra = disp > Math.max(2 * normalP, 30) && !calma ? disp : 0;
  const tarjetaCubrir = cubrir ? `<div class="tarjeta cuadra-aviso"><div class="ca-txt"><b>💰 ¿Lo cubrimos con lo ahorrado?</b>
      <span>Vienes de ${mes ? 'meses' : 'semanas'} en negativo (${eur(-falta)}) y tienes ${eur(c.ahorrado)} ahorrados. Si quieres, usamos ${eur(cubrir)} para ponerte a cero.</span></div>
      <div class="ca-bot"><button class="mini-b si" id="iCubrir">Cubrirlo</button><button class="mini-b" id="iCubrirNo">Ahora no</button></div></div>` : '';
  const tarjetaSobra = sobra ? `<div class="tarjeta cuadra-aviso"><div class="ca-txt"><b>🎉 Te han sobrado ${eur(sobra)}</b>
      <span>Es lo que no gastaste ${mes ? 'otros meses' : 'otras semanas'}. Si se queda aquí, es fácil gastarlo sin darte cuenta. ¿Lo apartamos?</span></div>
      <div class="ca-bot"><button class="mini-b si" id="iSobra">Elegir</button><button class="mini-b" id="iSobraNo">Dejarlo así</button></div></div>` : '';

  const justo = avisoJusto();
  // 📉 Varias semanas seguidas en negativo (28/10, q04, decidido por Carles: se propone repartirlo, tú eliges en cuántas)
  const neg = !cubrir ? rachaNegativa(c, falta) : null;
  const tarjetaNeg = neg ? `<div class="tarjeta cuadra-aviso"><div class="ca-txt"><b>📉 Llevas ${neg.n} ${mes ? 'meses' : 'semanas'} en negativo</b>
      <span>Arrastras ${eur(falta)} y así es difícil salir. ¿Lo repartimos? Empiezas ${mes ? 'este mes' : 'esta semana'} en positivo y durante unas ${mes ? 'meses' : 'semanas'} tendrás un poco menos.</span></div>
      <div class="ca-bot"><button class="mini-b si" id="iNeg">Repartirlo</button><button class="mini-b" id="iNegNo">Ahora no</button></div></div>` : '';
  // 💶 Efectivo en negativo: seguro que sacaste del cajero y no lo apuntaste (q08)
  const efNeg = D.cuentas.filter(k => esEfectivo(k) && !((D.efNegNo || {})[k.id] >= masDias(h, -6))).map(k => ({ k, s: saldoCuenta(k) })).find(x => x.s !== null && x.s < -0.5);
  const tarjetaEf = efNeg ? `<div class="tarjeta cuadra-aviso"><div class="ca-txt"><b>💶 Pre$u cree que tienes −${eur(-efNeg.s)} en ${esc(efNeg.k.nombre)}</b>
      <span>${D.cuentas.length > 1 ? 'No se puede tener menos de 0. Seguro que sacaste del cajero (o te pasaste dinero) y no lo apuntaste.' : 'No se puede tener menos de 0. Seguro que te dieron dinero y no lo apuntaste: cuenta lo que llevas y lo dejamos bien.'}</span></div>
      <div class="ca-bot"><button class="mini-b si" id="iEf">${D.cuentas.length > 1 ? '🏧 Apuntarlo' : 'Contarlo'}</button><button class="mini-b" id="iEfNo">Ahora no</button></div></div>` : '';
  // 🎉 Objetivo conseguido (q24): se avisa una vez
  const objHecho = objetivosVivos().find(o => o.meta > 0 && !(D.objAvisado || {})[o.id] && infoObjetivo(o, c).hecho);
  const tarjetaObj = objHecho ? `<div class="tarjeta cuadra-aviso"><div class="ca-txt"><b>🎉 ¡Ya tienes los ${eur(objHecho.meta)} de ${esc(objHecho.nombre)}!</b>
      <span>Lo has conseguido ${objHecho.emoji || '🎯'}. Cuando lo compres, pulsa «Usar el dinero» y se apunta solo.</span></div>
      <div class="ca-bot"><button class="mini-b si" id="iObj">Usar el dinero</button><button class="mini-b" id="iObjNo">Más tarde</button></div></div>` : '';
  // Tarjeta «Apuntar»
  if (F.tipo === 'traspaso' && D.cuentas.length < 2) F = formVacio('gasto');
  const gasto = F.tipo === 'gasto', trasp = F.tipo === 'traspaso';
  const chipsCta = (id, sel, quitar) => `<div class="chips" id="${id}">${D.cuentas.map(k =>
    `<button class="chip ${sel === k.id ? 'on' : ''} ${quitar === k.id ? 'apagado' : ''}" data-v="${k.id}">${k.emoji} ${esc(k.nombre)}</button>`).join('')}</div>`;
  const atajos = listaAtajos(F.tipo), ultimo = F.tipo === 'gasto' ? ultimoGasto() : null;
  const hucha = gasto && c.hucha !== null;
  const html = `
    <div class="cab"><div class="cab-izq">${LOGO}<div><div class="cab-hola">Hola, ${esc(D.nombre)}</div>
      <div class="cab-sub">${mayus(DIAS_NOMBRE[diaSemana(h)])}, ${+h.slice(8)} de ${MESES_L[+h.slice(5, 7) - 1]}</div></div></div>${botonAjustes}</div>
    ${D.applePay ? `<div class="tarjeta applepay"><div class="ico" style="font-size:24px">📲</div>
      <div class="txt"><b>Pagos de Apple Pay</b><span>Trae lo que has pagado con el iPhone</span></div>
      <button class="mini-b si" id="bApplePay">Traer</button></div>` : ''}
    ${tarjetaVuelta}${pregunta}
    <div class="tarjeta hero">
      ${espera ? `<div class="hero-etq">Te quedará ${mes ? 'este mes' : 'esta semana'}</div>
      <div class="grande espera">${eur(espera.queda)}</div>
      <div class="hero-espera">⏳ Cuando te llegue ${espera.txt} · contesta arriba</div>`
      : `<div class="hero-etq">Te queda ${mes ? 'este mes' : 'esta semana'}</div>
      <div class="grande ${c.queda < 0 ? 'neg' : 'pos'}">${eur(c.queda)}</div>`}
      <div class="hero-fechas">${rango}</div>
      <div class="barrita"><i class="${qH < 0 ? 'neg' : ''}" style="width:${pctH}%"></i></div>
      <div class="hero-sobra">${fraseSobra(qH, mes)}</div>
      <div class="desglose">${filas.map(([a, b]) => `<div class="linea"><span>${a}</span><b>${b}</b></div>`).join('')}
        ${(t => t ? `<div class="nota">${t}</div>` : '')(hayMensual && c.ciclo ? notaCiclo(c.ciclo) : '')}</div>
    </div>
    ${(tc => tc ? `<div class="tarjeta cuadra-aviso"><div class="ca-txt">${tc.tiempo ? `<b>⚖️ ${soloEfectivo() ? '¿Cuentas tu dinero?' : '¿Comprobamos con tu banco?'}</b>
      <span>Hace ${tc.dias >= 14 ? Math.floor(tc.dias / 7) + ' semanas' : tc.dias + ' días'} que no lo miras. Si se te olvidó apuntar algo, Pre$u cree que tienes más de lo que tienes. Es un momento.</span>
      ${D.cuadreMensual ? '' : '<button class="enlace ca-mes" id="iCuadrarMes">Pregúntame solo una vez al mes</button>'}`
      : `<b>⚖️ ¿Cuadramos ${mes ? 'el mes pasado' : 'la semana pasada'}?</b>
      <span>${tc.n ? 'Solo apuntaste ' + tc.n + (tc.n === 1 ? ' gasto' : ' gastos') : 'No apuntaste ningún gasto'} (${textoRango(tc.prev, tc.fin).replace(/^Del/, 'del')}). ${soloEfectivo() ? 'Cuenta lo que tienes' : 'Mira tu banco'} y lo dejamos bien.</span>
      <button class="enlace ca-mes" id="iCuadrarMes">Pregúntame solo una vez al mes</button>`}</div>
      <div class="ca-bot"><button class="mini-b si" id="iCuadrar">Cuadrar</button><button class="mini-b" id="iCuadrarNo">Ahora no</button></div></div>` : '')(vuelta ? null : tocaCuadrar())}
    ${(fg => fg ? `<div class="tarjeta cuadra-aviso"><div class="ca-txt"><b>💸 ${fg.queda > 0 ? 'Lo que repartías se acaba el ' + fechaLarga(fg.hasta) : 'Lo que repartías se acaba ' + (mes ? 'este mes' : 'esta semana')}</b>
      <span>Ahora son ${eur(fg.cuota)} ${mes ? 'al mes' : 'a la semana'} de ${fg.tipo === 'inicial' ? 'lo que tenías' : 'tus ahorros'}. Desde el ${fechaCorta(siguientePeriodo(fg.ult, D.periodo))} ya no se sumarán${fg.queda > 0 ? '. ¿Lo alargamos?' : '.'}</span></div>
      <div class="ca-bot">${fg.queda > 0 ? '<button class="mini-b si" id="iAlargar">Alargar</button><button class="mini-b" id="iAlargarNo">No hace falta</button>' : '<button class="mini-b" id="iAlargarNo">Entendido</button>'}</div></div>` : '')(vuelta ? null : tocaFinGastar())}
    ${vuelta ? '' : tarjetaObj + tarjetaCubrir + tarjetaNeg + tarjetaEf + tarjetaSobra}
    ${(j => j ? `<div class="tarjeta cuadra-aviso justo-aviso"><div class="ca-txt"><b>⚠️ ${mes ? 'El mes que viene' : 'La semana que viene'} irás justo</b>
      <span>${j.x < -0.004 ? 'Te faltarán unos ' + eur(-j.x) : 'Te quedarán unos ' + eur(j.x)} ${textoRango(j.sig, j.fin).replace(/^Del/, 'del')}, porque tienes ${j.progs.map(m => '📌 ' + esc(m.desc) + ' (' + eur(m.importe) + ')').join(', ')}.</span></div>
      <div class="ca-bot"><button class="mini-b si" id="iJustoVer">Ver</button><button class="mini-b" id="iJustoNo">Entendido</button></div></div>` : '')(vuelta ? null : justo)}
    ${!vuelta && tocaCopia() ? `<div class="tarjeta copia-aviso"><span class="deu-ico">💾</span><span class="txt">Haz una copia de seguridad<small>${textoUltimaCopia()}</small></span>
      <button class="mini-b si" id="iCopia">Hacer</button><button class="cerrar" id="iCopiaNo" aria-label="Ahora no">✕</button></div>` : ''}
    ${lineaDeudas()}
    <div class="tarjeta apuntar" id="fApuntar">
      <div class="tit-tarjeta">Apuntar</div>
      ${seg('aTipo', D.cuentas.length > 1 ? [['gasto', 'Gasto'], ['ingreso', 'Ingreso'], ['traspaso', 'Traspaso']] : [['gasto', 'Gasto'], ['ingreso', 'Ingreso extra']], F.tipo)}
      ${atajos.length || ultimo ? `<div class="atajos" id="aAtajos">${ultimo ? `<button class="chip repetir" id="aRepetir" aria-label="Repetir el último gasto">↻ Repetir ${emojiCat(ultimo.cat || 'Otros')} ${esc(ultimo.desc)} · ${eur(ultimo.importe)}</button>` : ''}${atajos.map((m, i) => `<button class="chip" data-i="${i}">${m.cat ? emojiCat(m.cat) : '💶'} ${esc(m.desc)}</button>`).join('')}</div>` : ''}
      <input id="aImp" class="importe" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0 €" value="${esc(F.importe)}">
      ${gasto ? `<div class="cats-desliza" id="aCats">${D.categorias.map(k =>
        `<button class="cat-t ${F.cat === k ? 'on' : ''} ${k.length > 10 ? 'largo' : ''}" data-v="${esc(k)}"><span class="cat-e">${emojiCat(k)}</span><span class="cat-n">${esc(k)}</span></button>`).join('')}<button class="cat-t cat-mas" id="aCatMas" aria-label="Nueva categoría"><span class="cat-e">＋</span></button></div>` : ''}
      ${trasp ? `<p class="nota" style="margin:2px 2px 0;text-align:center">Pasar dinero de una cuenta a otra (ej: sacar del cajero). No cambia lo que te queda.</p>
        <div class="etq">¿De dónde sale?</div>${chipsCta('aDe', F.cuenta)}
        <div class="etq">¿A dónde va?</div>${chipsCta('aA', F.a, F.cuenta)}`
      : `<input id="aDesc" class="texto campo" type="text" maxlength="40" enterkeyhint="done" autocomplete="off"
        placeholder="${gasto ? '¿En qué? (ej: café)' : '¿De qué? (ej: bizum de Pau)'}" value="${esc(F.desc)}">
      ${D.cuentas.length > 1 ? `<div class="etq">${gasto ? '¿Con qué has pagado?' : '¿Dónde te ha llegado?'}</div>${chipsCta('aCuentas', F.cuenta)}` : ''}`}
      <div class="fila"><span>📅 ${textoFecha(F.fecha)}</span><button class="enlace" id="aCambiarFecha">${F.verFecha ? 'Listo' : 'Cambiar'}</button></div>
      ${F.verFecha ? `<input id="aFecha" class="texto campo" type="date" min="${fechaMin()}" max="${fechaMax()}" value="${F.fecha || h}">${notaFecha()}` : ''}
      ${hucha ? `<div class="fila"><span>🐷 Pagar con la hucha<small>Te quedan ${eur(c.hucha)} · no cuenta ${mes ? 'este mes' : 'esta semana'}</small></span>
        <button class="interruptor ${F.hucha ? 'on' : ''}" id="aHucha" aria-label="Pagar con la hucha"></button></div>` : ''}
      <button class="boton" id="bGuardar">${trasp ? 'Guardar traspaso' : gasto ? (F.hucha ? 'Pagar con la hucha' : 'Guardar gasto') : 'Guardar ingreso'}</button>
      ${gasto && !F.hucha ? '<button class="boton contorno" id="bDividir">👥 Dividir o apuntar deuda</button>' : ''}
    </div>`;

  return {
    html,
    montar() {
      if ($('bApplePay')) $('bApplePay').onclick = traerApplePay;
      if (p) {
        const k = clave(p.item, p.fecha);
        const responder = (v, t) => { D.cambios[k] = v; guardarDatos(); otraCantidad = false; aviso(t); pintarApp(); };
        // (28/10, q01) se guarda que llegó HOY: si cuadraste antes de contestar, así entra en la cuenta
        $('pSi').onclick = () => siEraLoQueSobraba(p.item, p.fecha, p.item.importe, () => responder(llegada(p.item.importe), 'Sumado: +' + eur(p.item.importe)));
        $('pNo').onclick = () => hojaNoLlega(p.item, p.fecha, () => responder({ no: true }, 'Vale, no lo contamos'));
        $('pOtra').onclick = () => { otraCantidad = !otraCantidad; pintarApp(); if (otraCantidad) $('pImporte').focus(); };
        if ($('pGuardar')) $('pGuardar').onclick = () => {
          const n = num($('pImporte').value);
          if (!(n > 0)) { aviso('Escribe la cantidad (si no ha llegado, pulsa «No»)'); return; }
          siEraLoQueSobraba(p.item, p.fecha, r2(n), () => responder(llegada(r2(n)), 'Sumado: +' + eur(n)));
        };
      }
      segmento('aTipo', v => { if (v === F.tipo) return; F = formVacio(v); pintarApp(); });
      $('aImp').oninput = e => { F.importe = e.target.value; };
      if ($('aDesc')) $('aDesc').oninput = e => { F.desc = e.target.value; };
      // Traspaso: de dónde y a dónde (si eliges la misma, se cambia la otra)
      document.querySelectorAll('#aDe .chip').forEach(b => b.onclick = () => {
        F.cuenta = b.dataset.v;
        if (F.a === F.cuenta) F.a = (D.cuentas.find(k => k.id !== F.cuenta) || {}).id;
        pintarApp();
      });
      document.querySelectorAll('#aA .chip').forEach(b => b.onclick = () => {
        if (b.dataset.v === F.cuenta) return aviso('Elige otra cuenta: es la misma de la que sale');
        F.a = b.dataset.v; pintarApp();
      });
      // Categorías: se marcan sin volver a pintar (así la fila no salta al principio)
      document.querySelectorAll('#aCats .cat-t[data-v]').forEach(b => b.onclick = () => {
        F.cat = F.cat === b.dataset.v ? '' : b.dataset.v;
        document.querySelectorAll('#aCats .cat-t[data-v]').forEach(x => x.classList.toggle('on', x.dataset.v === F.cat));
      });
      // ＋ verde al final: crear una categoría sin salir de Apuntar (lo escrito se queda y la nueva sale marcada)
      if ($('aCatMas')) $('aCatMas').onclick = () => hojaCategoria(null, n => { F.cat = n; pintarApp(); });
      const catOn = document.querySelector('#aCats .cat-t.on');
      if (catOn) $('aCats').scrollLeft = Math.max(0, catOn.offsetLeft - $('aCats').clientWidth / 2 + catOn.offsetWidth / 2);
      document.querySelectorAll('#aCuentas .chip').forEach(b => b.onclick = () => { F.cuenta = b.dataset.v; pintarApp(); });
      // ↻ Repetir: vuelve a apuntar el último gasto igual (hoy), con «Deshacer» por si te equivocas
      if ($('aRepetir')) $('aRepetir').onclick = () => {
        const n = D.movimientos.length;
        F = Object.assign(formVacio('gasto'), { importe: fmtImporte(ultimo.importe), desc: ultimo.desc, cat: ultimo.cat || 'Otros', cuenta: cuentaApp(ultimo.cuenta) });
        guardarMovimiento();
        if (D.movimientos.length > n) { const m = D.movimientos[D.movimientos.length - 1];
          avisoDeshacer('Apuntado otra vez: ' + m.desc + ' · ' + eur(m.importe), () => { D.movimientos = D.movimientos.filter(x => x.id !== m.id); guardarDatos(); pintarApp(); aviso('Deshecho'); }); }
      };
      document.querySelectorAll('#aAtajos .chip[data-i]').forEach(b => b.onclick = () => {
        const m = atajos[+b.dataset.i]; F.desc = m.desc; F.cat = m.cat || ''; F.cuenta = cuentaApp(m.cuenta);
        pintarApp(); $('aImp').focus();
      });
      $('aCambiarFecha').onclick = () => {
        F.verFecha = !F.verFecha; pintarApp();
        if (F.verFecha) { const i = $('aFecha'); i.focus(); try { i.showPicker(); } catch (e) {} }
      };
      // Al elegir fecha no se cierra (en iPhone la rueda va cambiando); se cierra con «Listo»
      if ($('aFecha')) $('aFecha').onchange = $('aFecha').oninput = e => {
        const v = e.target.value;
        if (!v || v < fechaMin() || v > fechaMax()) return;
        F.fecha = v === h ? '' : v;
        document.querySelector('#fApuntar .fila span').textContent = '📅 ' + textoFecha(F.fecha);
      };
      if ($('aHucha')) $('aHucha').onclick = () => { F.hucha = !F.hucha; pintarApp(); };
      $('bGuardar').onclick = guardarMovimiento;
      if ($('iDeudas')) $('iDeudas').onclick = hojaDeudas;
      if ($('iCopia')) $('iCopia').onclick = hacerCopia;
      const fgA = tocaFinGastar();
      if ($('iAlargar')) $('iAlargar').onclick = () => hojaAlargar(fgA);
      if ($('iAlargarNo')) $('iAlargarNo').onclick = () => { D.finAvisado = Object.assign({}, D.finAvisado, { [fgA.tipo]: fgA.ult }); guardarDatos(); pintarApp(); };
      const tcA = tocaCuadrar();
      if ($('iCuadrar')) $('iCuadrar').onclick = () => hojaCuadrar({ desdeAviso: tcA && tcA.tiempo ? 'tiempo' : true, rapido: true });
      // «Ahora no»: las 2 primeras veces, hasta mañana; desde la 3.ª seguida, una vez por semana (para no agobiar)
      if ($('iCuadrarNo')) $('iCuadrarNo').onclick = () => {
        D.cuadreNoes = (D.cuadreNoes || 0) + 1;
        // (28/10, q10) desde el 3.º «Ahora no» seguido, cada 2 semanas; si elegiste «una vez al mes», en un mes
        const largo = D.cuadreMensual ? 27 : D.cuadreNoes >= 3 ? 13 : 0;
        D.cuadreAplazado = largo ? masDias(hoyIso(), largo) : hoyIso();
        guardarDatos(); aviso(D.cuadreMensual ? 'Vale, te lo recordaremos dentro de un mes' : largo ? 'Vale, te lo recordaremos en 2 semanas' : 'Te lo recordaremos mañana'); pintarApp();
      };
      if ($('iCubrir')) $('iCubrir').onclick = () => {
        D.movimientos.push({ id: nuevoId(), tipo: 'ingreso', importe: cubrir, desc: '💰 De lo ahorrado (para cubrir lo de antes)', cuenta: cuentaApp(D.ultimaCuenta), fecha: h, ts: Date.now(), sinCuenta: true, origen: 'ahorrado' });

// Debajo de «Te queda»: qué pasa con lo que no gastes (recordarlo ayuda a no gastar hasta el último euro; idea del 24/10)
function fraseSobra(queda, mes) {
  const sig = mes ? 'al mes que viene' : 'a la semana que viene';
  if (queda < -0.004) return 'Te has pasado: se restará ' + (mes ? 'del mes que viene' : 'de la semana que viene');
  const objs = objetivosVivos().filter(o => !(o.meta > 0) || !infoObjetivo(o).hecho);   // (q24) los ya conseguidos no
  if (D.sobrante === 'objetivos' && objs.length) return 'Lo que no gastes va a ' + (objs.length === 1 ? (objs[0].emoji || '🎯') + ' ' + esc(objs[0].nombre) : 'tus objetivos 🎯');
  if (D.sobrante === 'ahorro' || D.sobrante === 'objetivos') return 'Lo que no gastes va a tu ahorro 💰';
  return 'Lo que no gastes pasa ' + sig;
}

// 📉 ¿Llevas varias semanas (o meses) seguidas en negativo? (28/10, q04: Marc 46 de 53 semanas en rojo y no salía nunca)
function rachaNegativa(c, falta) {
  const P = D.periodo, minN = P === 'mes' ? 2 : 3, normal = normalPeriodo(c);
  if (!(falta >= Math.max(5, normal * 0.1))) return null;
  if (D.negNo && contarPeriodos(D.negNo, c.ini, P) <= 4) return null;   // dijo «Ahora no»: no se vuelve a proponer en 4 semanas
  if (D.movimientos.some(m => m.origen === 'repartoNeg' && m.tipo === 'gasto' && m.repartirHasta >= c.ini)) return null;   // ya lo está repartiendo
  const hist = []; calcular(D, hoyIso(), undefined, hist);
  let n = 0;
  for (let i = hist.length - 1; i >= 0; i--) { const r = hist[i]; if (r.ini >= c.ini) continue; if (r.queda < -0.004) n++; else break; }
  return n >= minN ? { n } : null;
}
// Repartir lo que arrastras en negativo: este periodo empiezas desde cero y lo que debías se resta poco a poco (como un gasto repartido)
function hojaRepartirNegativo(falta) {
  const P = D.periodo, mes = P === 'mes', h = hoyIso(), normal = normalPeriodo(), esteP = mes ? 'este mes' : 'esta semana', uds = mes ? 'meses' : 'semanas';

      { id: nuevoId(), tipo: 'gasto', importe: r2(falta), desc: '📉 Lo que arrastrabas, repartido', cat: 'Otros', cuenta: cta, fecha: h, ts: ts + 1, sinCuenta: true, origen: 'repartoNeg', grupoNeg: g, repartirHasta: hastaDeN(h, n, P) }]; };
  abrirHoja(() => {
    const d2 = JSON.parse(JSON.stringify(D)); movs(E.n).forEach(m => d2.movimientos.push(m));

        <div class="tarjeta"><div class="etq" style="margin-top:0;text-align:center">¿En cuánt${mes ? 'os' : 'as'} ${uds}?</div>
          <div class="paso-n" id="rnPaso"><button data-d="-1" aria-label="Menos">−</button><b>${E.n} ${uds}</b><button data-d="1" aria-label="Más">+</button></div>
          <div class="nota" style="text-align:center">Unos ${eur(r2(falta / E.n))} menos ${mes ? 'cada mes' : 'cada semana'}</div></div>
        <div class="tarjeta cuadre-efecto"><span>Te queda ${esteP}</span><div><s>${eur(q0)}</s> → <b class="${q1 < 0 ? 'neg' : ''}">${eur(q1)}</b></div></div>
        <div class="botones-hoja"><button class="boton" id="hGuardar">Repartirlo</button><button class="boton sec" id="hCancelar">Cancelar</button></div>`,

        $('hGuardar').onclick = () => { movs(E.n).forEach(m => D.movimientos.push(m)); guardarDatos(); cerrarHoja(); aviso('Repartido en ' + E.n + ' ' + uds + ' ✓'); pintarApp(); };

    };
  });
}

const primerEmoji = t => {
  t = String(t || '').trim(); if (!t) return '';
  try { if (window.Intl && Intl.Segmenter) { const g = [...new Intl.Segmenter('es', { granularity: 'grapheme' }).segment(t)][0]; t = g ? g.segment : ''; } else t = Array.from(t).slice(0, 2).join(''); } catch (e) { t = Array.from(t)[0] || ''; }
  return /\p{Extended_Pictographic}|\p{Regional_Indicator}/u.test(t) ? t : '';
};

// El último gasto normal que apuntaste (para «↻ Repetir»): no cuenta la hucha, objetivos, deudas, repartos ni descuadres
function ultimoGasto() {
  let u = null;
  D.movimientos.forEach(x => {
    if (x.tipo !== 'gasto' || x.hucha || x.objetivo || x.deuda || x.reparto || x.destino || x.repartirHasta || (x.origen && x.origen !== 'applepay') || x.cat === 'Descuadre' || !(x.importe > 0)) return;
    if (!u || (x.ts || 0) >= (u.ts || 0)) u = x;
  });
  return u;
}

// Atajos: lo que más se repite (misma descripción y categoría). Si lo pagas con varias cuentas sale UNA vez, con la última que usaste.
function listaAtajos(tipo) {
  if (tipo === 'traspaso') return [];
  const g = new Map();
  D.movimientos.forEach((x, i) => {
    if (x.tipo !== tipo || x.hucha || x.objetivo || x.deuda || x.reparto || x.destino || x.repartirHasta || (x.origen && x.origen !== 'applepay') || !(x.desc || '').trim()) return;
    const k = x.desc.trim().toLowerCase() + '|' + (x.cat || '');
    const v = g.get(k) || { n: 0 };
    g.set(k, { n: v.n + 1, ult: i, m: x });
  });
  return [...g.values()].sort((a, b) => b.n - a.n || b.ult - a.ult).slice(0, 6).map(v => v.m);
}

function guardarMovimiento() {
  const imp = num(F.importe), gasto = F.tipo === 'gasto';
  if (!(imp > 0)) { aviso('Escribe la cantidad'); $('aImp').focus(); return; }
  if (F.tipo === 'traspaso') {
    const de = cuentaApp(F.cuenta), a = F.a;
    if (!a || a === de || !D.cuentas.some(k => k.id === a)) return aviso('Elige a qué cuenta va');
    D.movimientos.push({ id: nuevoId(), tipo: 'traspaso', importe: r2(imp), desc: 'Traspaso', cuenta: de, a, fecha: F.fecha || hoyIso(), ts: Date.now() });
    D.ultimaCuenta = de; guardarDatos();
    if (document.activeElement) document.activeElement.blur();
    aviso('Traspaso apuntado: ' + nombreCta(de) + ' → ' + nombreCta(a) + ' ✓');
    F = formVacio('traspaso'); pintarApp(); return;
  }
  // Ingreso extra grande (más del doble de tu semana): se pregunta qué hacer con él antes de guardarlo
  if (!gasto && !F.destinoListo && imp > umbralIngresoGrande()) return hojaIngresoGrande(r2(imp));
  if (gasto && F.hucha) {
    const queda = calcular(D).hucha;
    if (imp > queda + 1e-9) { aviso('En la hucha solo te quedan ' + eur(queda)); return; }
  }
  // ¿Hay dinero para gastar en esa cuenta? Si lo que hay es de la hucha (o no llega), se frena y se pregunta (decidido por Carles el 24/10)
  if (gasto && !F.hucha && !F.fondosVisto) {
    const f = fondosCuenta(cuentaApp(F.cuenta));
    // Si Pre$u ya cree que esa cuenta está en negativo, seguro que falta apuntar algo: se avisa una vez y no en cada gasto (14 días)
    const visto = (D.sinFondosVisto || {})[f && f.id];
    // (28/10, q05) Si en esa cuenta ya dijiste «Apuntarlo igual», 7 días sin volver a preguntar (salvo un gasto grande)
    const igual = (D.fondosIgual || {})[f && f.id], calla = igual && igual >= masDias(hoyIso(), -6) && imp <= umbralGastoGrande();
    if (f && imp > f.libre + 0.004 && !calla && !(f.hay < 0 && visto && visto >= masDias(hoyIso(), -14))) return hojaSinFondos(r2(imp), f);
  }
  // ¿Es parte de lo que faltaba al cuadrar? (27/10, prueba de personajes: Laura cuadró antes de apuntar la tasa del examen y contaba dos veces)
  if (gasto && !F.hucha && !F.descuadreVisto) {
    const dq = D.movimientos.find(m => m.origen === 'cuadre' && m.tipo === 'gasto' && m.cat === 'Descuadre' && m.cuenta === cuentaApp(F.cuenta)
      && (m.ts || 0) >= Date.now() - 3 * 864e5 && !m.yaPreguntado && (F.fecha || hoyIso()) <= deUTC(m.ts + 36e5) && m.importe >= imp - 0.004 && (imp >= 5 || (F.fecha && F.fecha < m.fecha)));   // (q27) por un café no se pregunta
    if (dq) return hojaEraDescuadre(r2(imp), dq);
  }
  // Gasto grande (más del doble de tu semana): ¿lo repartimos en varias semanas? (decidido por Carles el 27/10)
  if (gasto && !F.hucha && !F.repartirVisto && imp > umbralGastoGrande()) return hojaRepartirGasto(r2(imp));
  const cat = gasto ? (F.cat || 'Otros') : '';
  const m = { id: nuevoId(), tipo: F.tipo, importe: r2(imp), desc: F.desc.trim() || (gasto ? cat : 'Ingreso extra'),
    cuenta: cuentaApp(F.cuenta), fecha: F.fecha || hoyIso(), ts: Date.now() };
  if (gasto) m.cat = cat;
  if (gasto && F.hucha) m.hucha = true;
  if (gasto && !F.hucha && F.repartirN > 1) m.repartirHasta = hastaDeN(m.fecha, F.repartirN, D.periodo);
  if (!gasto && F.destino) {
    m.destino = F.destino;
    if (F.destino === 'repartir') m.hasta = F.hasta;
    if (F.destino === 'objetivo') m.obj = F.obj;
  }
  D.movimientos.push(m);
  D.ultimaCuenta = m.cuenta;
  guardarDatos();
  if (document.activeElement) document.activeElement.blur();
  const o = m.obj && (D.objetivos || []).find(x => x.id === m.obj);
  aviso(m.hucha ? 'Pagado con la hucha 🐷' : m.repartirHasta ? 'Repartido en ' + F.repartirN + (D.periodo === 'mes' ? ' meses' : ' semanas') + ' ✓' : gasto ? 'Gasto apuntado ✓' : m.destino === 'hucha' ? 'Guardado en la hucha 🐷'
    : m.destino === 'objetivo' ? 'Sumado a «' + (o ? o.nombre : 'tu objetivo') + '» 🎯' : m.destino === 'repartir' ? 'Repartido hasta el ' + fechaLarga(m.hasta) + ' ✓' : 'Ingreso apuntado ✓');
  F = formVacio(F.tipo);
  pintarApp();
}

// Dinero para gastar en una cuenta = lo que hay (Deberías tener) − la parte de la hucha que está ahí.
// Si la cuenta no tiene saldo puesto, no se sabe: no se comprueba (null).
function fondosCuenta(id) {
  const k = D.cuentas.find(x => x.id === id), hay = k ? saldoCuenta(k) : null;
  if (hay === null) return null;
  const c = calcular(D), enHucha = Math.max(0, Math.min(huchaEnCuenta(id, c), Math.max(hay, 0)));
  return { id, nombre: nombreCta(id), hay, enHucha, libre: r2(Math.max(0, hay - enHucha)), huchaTotal: Math.max(0, r2(c.hucha || 0)) };
}
function hojaSinFondos(imp, f) {

// ---------- Un ingreso fijo que se para unas semanas (idea de la prueba de 5 meses: Laura en verano) ----------
// Al decir «No»: ¿solo esta vez, o no te llegará hasta una fecha? Si eliges fecha, todas las veces de en medio cuentan 0 sin preguntar.
function hojaNoLlega(it, fecha, soloEsta) {
  // Si ya hace más de 10 días que lo esperas, lo normal es que esta vez no llegue: viene marcado «Esta vez no me llega»
  const h = hoyIso(), dias = diasEntre(fecha, h), E = { modo: dias > 10 ? 'esta' : 'tarde', hasta: '', otra: false };
  const rapidas = [...(it.frec === 'semana' ? [['En 2 semanas', masDias(fecha, 14)]] : []), ['En 1 mes', fechaEnMeses(1)], ['En 3 meses', fechaEnMeses(3)]]
    .filter(([, f]) => f > fecha);
  const veces = () => E.hasta > fecha ? fechasDe(it, fecha, masDias(E.hasta, -1)).length : 0;
  const nota = () => !(E.hasta > fecha) ? 'Elige desde cuándo te vuelve a llegar.'
    : `Hasta el ${fechaLarga(E.hasta)} no te preguntaremos: ${veces() === 1 ? 'esa vez cuenta' : 'esas ' + veces() + ' veces cuentan'} 0 €. Si al final te llega, cámbialo en Movimientos.`;
  const op = (v, t, sub) => `<button class="${E.modo === v ? 'on' : ''}" data-v="${v}"><i></i><span><b>${t}</b><small>${sub}</small></span></button>`;
  abrirHoja(() => ({
    html: `<h2>${it.emoji} No te ha llegado</h2>
      <p class="ayuda">${esc(it.nombre)} · ${eur(it.importe)}${dias > 10 ? ` · lo esperas desde hace ${dias} días` : ''}. ¿Cuándo te volverá a llegar?</p>
      <div class="sobra-op" id="nlOp">
        ${op('tarde', '⏳ Aún no, me llegará más tarde', 'Te lo volvemos a preguntar mañana. Mientras, no cuenta')}
        ${op('esta', '🔁 Esta vez no me llega', 'Solo esta vez no cuenta. La próxima, como siempre')}
        ${op('hasta', '📅 No me llegará hasta…', 'Por ejemplo, en verano. No te preguntaremos hasta esa fecha')}
        ${E.modo === 'hasta' ? `<div class="tarjeta" style="margin:0 0 4px"><div class="chips" id="nlFechas">${rapidas.map(([t, f]) => `<button class="chip ${!E.otra && E.hasta === f ? 'on' : ''}" data-f="${f}">${t}</button>`).join('')}
            <button class="chip ${E.otra ? 'on' : ''}" data-f="otra">Otra fecha</button></div>
          ${E.otra ? `<input id="nlHasta" class="texto campo" type="date" min="${masDias(fecha, 1)}" value="${E.hasta}" style="margin-top:10px">` : ''}
          <p class="nota" id="nlNota" style="margin:10px 2px 0">${nota()}</p></div>` : ''}
      </div>
      <div class="botones-hoja"><button class="boton" id="nlGuardar">Guardar</button><button class="boton sec" id="hCancelar">Cancelar</button></div>`,
    montar() {
      document.querySelectorAll('#nlOp > button').forEach(b => b.onclick = () => { E.modo = b.dataset.v; pintarHoja(); });
      if ($('nlFechas')) $('nlFechas').querySelectorAll('.chip').forEach(b => b.onclick = () => {
        if (b.dataset.f === 'otra') { E.otra = true; E.hasta = ''; pintarHoja(); if ($('nlHasta')) $('nlHasta').focus(); return; }
        E.otra = false; E.hasta = b.dataset.f; pintarHoja();
      });
      if ($('nlHasta')) $('nlHasta').onchange = e => { E.hasta = e.target.value; $('nlNota').innerHTML = nota(); };
      $('hCancelar').onclick = cerrarHoja;
      $('nlGuardar').onclick = () => {
        if (E.modo === 'tarde') {
          D.preguntaLuego = Object.assign(D.preguntaLuego || {}, { [clave(it, fecha)]: hoyIso() });
          guardarDatos(); cerrarHoja(); otraCantidad = false; aviso('Vale: te lo preguntamos mañana'); return pintarApp();
        }
        if (E.modo === 'esta') { cerrarHoja(); return soloEsta(); }
        if (!(E.hasta > fecha)) return aviso('Elige desde cuándo te vuelve a llegar');
        fechasDe(it, fecha, masDias(E.hasta, -1)).forEach(f => { D.cambios[clave(it, f)] = { no: true }; });
        guardarDatos(); cerrarHoja(); otraCantidad = false;

}

// ---------- Ingreso extra grande (ej: una beca de 1.200 €) ----------
// Si es más del doble de lo que tienes normalmente para tu semana (o mes), se pregunta qué hacer con él (decidido por Carles el 23/10).
// Lo normal de tu semana = lo que te entra + para gastar − gastos fijos − objetivos (sin lo que viene de la semana pasada ni otros extras).
function umbralIngresoGrande() {
  return Math.max(2 * normalTipico(), 50);
}
// Lo normal de tu semana (o mes) para gastar: lo que te entra + para gastar − fijos − objetivos − lo de cada año
function normalPeriodo(c) { c = c || calcular(D); return Math.max(0, r2(c.entra + c.deInicio + c.deAhorros + (c.deRepartos || 0) - c.fijos - (c.aObjetivos || 0) - (c.aAnual || 0))); }
// Gasto grande (¿lo repartimos?): por semanas, más del doble de tu semana; por meses, más de la mitad de tu mes (27/10: la matrícula de 900 € de Mercedes no preguntaba)
// (28/10, q14) Se mira lo normal de ahora y el del periodo siguiente: el primer mes de Nico tenía 23 € (cobraba a final de mes) y un súper de 50 € «era mucho»
const normalTipico = () => { const h = hoyIso(); return Math.max(normalPeriodo(), normalPeriodo(calcular(D, h, siguientePeriodo(inicioPeriodo(h, D.periodo), D.periodo)))); };
function umbralGastoGrande() { const b = normalTipico(); return Math.max(D.periodo === 'mes' ? b / 2 : 2 * b, 50); }
const fechaEnMeses = n => { const d = new Date(); d.setMonth(d.getMonth() + n); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
function hojaIngresoGrande(imp) {
  const P = D.periodo, mes = P === 'mes', h = hoyIso(), fecha = F.fecha || h, esteP = mes ? 'este mes' : 'esta semana';
  const rapidas = [...(mes ? [] : [['En 1 mes', fechaEnMeses(1)]]), ['En 3 meses', fechaEnMeses(3)], ...fechasRapidas().filter(([t]) => t === 'Fin de curso' || t === 'Fin de año')]
    .filter(([, f], i, l) => f > h && l.findIndex(x => x[1] === f) === i).sort((a, b) => a[1] < b[1] ? -1 : 1);
  const objs = objetivosVivos().filter(o => !(o.meta > 0) || infoObjetivo(o).lleva < o.meta - 0.004);
  const E = { destino: '', hasta: '', otra: false, obj: objs.length === 1 ? objs[0].id : '' };
  const op = (v, t, s) => `<button class="${E.destino === v ? 'on' : ''}" data-v="${v}"><i></i><span><b>${t}</b><small>${s}</small></span></button>`;
  function notaRepartir() {
    if (!(E.hasta > fecha)) return 'Elige hasta cuándo.';
    const t = tramoDeMov({ fecha, hasta: E.hasta, importe: imp }, P);
    return `Unos <b>${eur(parteDe(imp, t.n, 0))}</b> ${mes ? 'al mes' : 'a la semana'} durante ${t.n} ${mes ? (t.n === 1 ? 'mes' : 'meses') : (t.n === 1 ? 'semana' : 'semanas')}, hasta el ${fechaLarga(E.hasta)}.`;
  }
  abrirHoja(() => ({
    html: `<h2>💶 ¿Qué hacemos con ${eur(imp)}?</h2>
      <p class="ayuda">Es mucho más de lo que tienes normalmente ${mes ? 'para un mes' : 'para una semana'}. Si lo sumas todo a ${esteP}, es fácil gastarlo sin darte cuenta.</p>
      <div class="sobra-op" id="gDest">
        ${op('repartir', '📅 Repartirlo hasta…', 'Un poco ' + (mes ? 'cada mes' : 'cada semana'))}
        ${E.destino === 'repartir' ? `<div class="tarjeta" style="margin:0 0 4px"><div class="chips" id="gFechas">${rapidas.map(([t, f]) => `<button class="chip ${!E.otra && E.hasta === f ? 'on' : ''}" data-f="${f}">${t}</button>`).join('')}
            <button class="chip ${E.otra ? 'on' : ''}" data-f="otra">Otra fecha</button></div>
          ${E.otra ? `<input id="gHasta" class="texto campo" type="date" min="${masDias(fecha, 1)}" value="${E.hasta}" style="margin-top:10px">` : ''}
          <p class="nota" id="gNota" style="margin:10px 2px 0">${notaRepartir()}</p></div>` : ''}
        ${op('hucha', '🐷 A la hucha', 'Lo guardas y no cuenta para gastar')}
        ${objs.length ? op('objetivo', objs.length === 1 ? '🎯 A «' + esc(objs[0].nombre) + '»' : '🎯 A un objetivo', 'Lo tendrás antes') : ''}
        ${E.destino === 'objetivo' && objs.length > 1 ? `<div class="chips" id="gObjs" style="margin:0 0 4px">${objs.map(o => `<button class="chip ${E.obj === o.id ? 'on' : ''}" data-o="${o.id}">${o.emoji || '🎯'} ${esc(o.nombre)}</button>`).join('')}</div>` : ''}
        ${op('gastar', '💸 Para gastar ' + esteP, 'Se suma entero a lo que te queda')}

      <div class="botones-hoja"><button class="boton" id="gGuardar">Guardar ingreso</button><button class="boton sec" id="hCancelar">Cancelar</button></div>`,

      if ($('gFechas')) $('gFechas').querySelectorAll('.chip').forEach(b => b.onclick = () => {
        if (b.dataset.f === 'otra') { E.otra = true; E.hasta = ''; pintarHoja(); if ($('gHasta')) $('gHasta').focus(); return; }
        E.otra = false; E.hasta = b.dataset.f; pintarHoja();
      });
      if ($('gHasta')) $('gHasta').onchange = e => { E.hasta = e.target.value; $('gNota').innerHTML = notaRepartir(); };
      document.querySelectorAll('#gObjs .chip').forEach(b => b.onclick = () => { E.obj = b.dataset.o; pintarHoja(); });
      $('gGuardar').onclick = () => {

        if (E.destino === 'objetivo' && !E.obj) return aviso('Elige el objetivo');
        Object.assign(F, { destinoListo: true, destino: E.destino === 'gastar' ? '' : E.destino, hasta: E.hasta, obj: E.obj });
        cerrarHoja(); guardarMovimiento();
      };
    }
  }));
}

// ---------- 🧾 Gasto grande repartido en varias semanas (27/10, decidido por Carles) ----------
// Al apuntar un gasto grande (más del doble de tu semana, mínimo 50 €) o desde Movimientos («📅 Repartir»): cuántas semanas (o meses), con − / +.
// El dinero sale de la cuenta el día del gasto; de lo que te queda se resta un poco cada vez, empezando en la semana del gasto.
const MAX_REPARTO = { semana: 52, mes: 12 };
function hojaRepartirGasto(imp, m) {
  const P = D.periodo, mes = P === 'mes', fecha = m ? m.fecha : (F.fecha || hoyIso());
  const nAct = m && esRepartido(m) ? tramoGasto(m, P).n : 0;
  const E = { modo: m ? (nAct > 1 ? 'repartir' : 'todo') : '', n: nAct > 1 ? nAct : mes ? 2 : 4 };
  const uni = n => mes ? (n === 1 ? 'mes' : 'meses') : (n === 1 ? 'semana' : 'semanas');
  const varias = mes ? 'varios meses' : 'varias semanas';
  const suP = inicioPeriodo(fecha, P) === inicioPeriodo(hoyIso(), P) ? (mes ? 'este mes' : 'esta semana') : (mes ? 'ese mes' : 'esa semana');
  const nota = () => `Unos <b>${eur(parteDe(imp, E.n, 0))}</b> ${mes ? 'al mes' : 'a la semana'} durante ${E.n} ${uni(E.n)}, `
    + `desde ${suP} hasta el ${fechaLarga(finPeriodo(hastaDeN(fecha, E.n, P), P))}.`;
  const op = (v, t, sub) => `<button class="${E.modo === v ? 'on' : ''}" data-v="${v}"><i></i><span><b>${t}</b><small>${sub}</small></span></button>`;
  abrirHoja(() => ({
    html: `<h2>📅 ${m ? 'Repartir «' + esc(m.desc) + '»' : '¿Lo repartimos?'}</h2>
      <p class="ayuda">${m ? 'Son ' + eur(imp) + '.' : 'Son ' + eur(imp) + ': es mucho para ' + (mes ? 'un mes' : 'una semana') + '.'} Puedes restarlo poco a poco en ${varias}.
        El dinero sale ${m ? 'de tu cuenta el día que pagaste' : 'hoy de tu cuenta'}; lo que se reparte es lo que se resta de lo que te queda.</p>
      <div class="sobra-op" id="rgOp">
        ${op('repartir', '📅 Repartirlo en ' + varias, 'Un poco cada ' + (mes ? 'mes' : 'semana'))}
        ${E.modo === 'repartir' ? `<div class="tarjeta" style="margin:0 0 4px">
            <div class="paso-dia"><span>${mes ? 'Meses' : 'Semanas'}</span><div class="ctrl"><button id="rgMenos" aria-label="Uno menos">−</button><b id="rgN">${E.n}</b><button id="rgMas" aria-label="Uno más">+</button></div></div>
            <p class="nota" id="rgNota" style="margin:10px 2px 0">${nota()}</p></div>` : ''}
        ${op('todo', '💸 Todo ' + suP, 'Se resta entero de lo que te queda')}
      </div>
      <div class="botones-hoja"><button class="boton" id="rgGuardar">${m ? 'Guardar' : 'Guardar gasto'}</button><button class="boton sec" id="hCancelar">Cancelar</button></div>`,
    montar() {
      document.querySelectorAll('#rgOp > button').forEach(b => b.onclick = () => { E.modo = b.dataset.v; pintarHoja(); });
      const mover = d => { E.n = Math.min(MAX_REPARTO[P], Math.max(2, E.n + d)); $('rgN').textContent = E.n; $('rgNota').innerHTML = nota(); };
      if ($('rgMas')) { $('rgMas').onclick = () => mover(1); $('rgMenos').onclick = () => mover(-1); }
      $('rgGuardar').onclick = () => {
        if (!E.modo) return aviso('Elige una opción');
        const n = E.modo === 'repartir' ? E.n : 0;
        if (!m) { Object.assign(F, { repartirVisto: true, repartirN: n }); cerrarHoja(); return guardarMovimiento(); }
        if (n > 1) m.repartirHasta = hastaDeN(m.fecha, n, P); else delete m.repartirHasta;
        guardarDatos(); cerrarHoja(); aviso(n > 1 ? 'Repartido en ' + n + ' ' + uni(n) + ' ✓' : 'Se resta entero ' + suP); pintarApp();
      };
    }
  }));
}

// ---------- 💰 Usar lo ahorrado (27/10, decidido por Carles) ----------
// Lo que te ha sobrado otras semanas (💰 Ahorrado) se puede usar: sumarlo a esta semana o repartirlo hasta la fecha de tu «Para gastar»
// (si no tienes «Para gastar» con fecha, solo sumarlo). Se guarda como un ingreso «De lo ahorrado» (origen 'ahorrado', sin tocar

    return `Unos <b>${eur(parteDe(cant(), t.n, 0))}</b> ${mes ? 'al mes' : 'a la semana'} durante ${t.n} ${mes ? (t.n === 1 ? 'mes' : 'meses') : (t.n === 1 ? 'semana' : 'semanas')}, desde ${esteP}.`; };
  const op = (v, t, sub) => `<button class="${E.modo === v ? 'on' : ''}" data-v="${v}"><i></i><span><b>${t}</b><small>${sub}</small></span></button>`;
  abrirHoja(() => ({

      ${alCambiar ? '' : `<div class="tarjeta">

        <input id="uImp" class="importe" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0 €" value="${esc(E.importe)}">
        <div class="chips centrados"><button class="chip" id="uTodo">Todo · ${eur(total)}</button></div></div>`}
      <div class="sobra-op" id="uOp">

// ---------- 📲 Pagos de Apple Pay ----------
// La automatización de Atajos guarda cada pago como una línea:  PRESU|fecha|importe|comercio|tarjeta
// y copia la lista entera al portapapeles. Aquí se lee, se quitan los ya añadidos y se revisan antes de añadir.
const MESES_TXT = { ene: 1, feb: 2, mar: 3, abr: 4, may: 5, jun: 6, jul: 7, ago: 8, sep: 9, set: 9, oct: 10, nov: 11, dic: 12,
  jan: 1, apr: 4, aug: 8, dec: 12 };
function fechaDeTexto(t) {
  t = String(t || '').trim().toLowerCase();
  let m = t.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + '-' + m[2] + '-' + m[3];
  m = t.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if (m) return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  m = t.match(/(\d{1,2})\s+(?:de\s+)?([a-zé]{3})[a-zé]*\.?\s+(?:de\s+)?(\d{4})/);
  if (m && MESES_TXT[m[2]]) return m[3] + '-' + String(MESES_TXT[m[2]]).padStart(2, '0') + '-' + m[1].padStart(2, '0');
  return hoyIso();
}
const importeDeTexto = t => { const m = String(t || '').replace(/\s/g, '').match(/-?[\d.,]+/); return m ? Math.abs(num(m[0])) : NaN; };
// Categoría que se propone según el nombre del comercio
const PISTAS = [
  ['Súper', /mercadona|lidl|carrefour|\bdia\b|aldi|eroski|consum|alcampo|hipercor|caprabo|bonpreu|condis|ahorramas|super|supermerc|bon area|bonarea/],
  ['Comida', /bar\b|rest|burger|mcdonald|kfc|telepizza|domino|pizza|glovo|just ?eat|uber ?eats|caf[eé]|starbucks|montaditos|kebab|sushi|taco|vips|foster|goiko|tgb|granier|panader/],
  ['Transporte', /renfe|metro|\bbus\b|uber|cabify|bolt|repsol|cepsa|bp\b|galp|shell|gasolin|tmb|emt|alsa|fgc|parking|taxi|bicing/],
  ['Ropa', /zara|bershka|pull|primark|h&m|h & m|mango|stradivarius|shein|lefties|decathlon|nike|adidas|jd sports|springfield|massimo/],
  ['Fiesta', /discoteca|disco|\bpub\b|club|cocktail|copas|razzmatazz|apolo|opium/],
  ['Ocio', /cine|yelmo|cinesa|kinépolis|steam|playstation|xbox|nintendo|ticketmaster|entradas|fnac|bowling|museo|teatro/],
  ['Viajes', /ryanair|vueling|iberia|easyjet|booking|airbnb|hotel|hostel|aeropuerto|aena/]
];
function categoriaPara(comercio) {
  const k = comercio.trim().toLowerCase(), rec = (D.comercios || {})[k];
  if (rec && D.categorias.includes(rec.cat)) return rec.cat;
  const p = PISTAS.find(([c, re]) => D.categorias.includes(c) && re.test(k));
  return p ? p[0] : D.categorias.includes('Otros') ? 'Otros' : D.categorias[D.categorias.length - 1];
}
function cuentaPara(comercio, tarjeta) {
  // 1) la tarjeta con la que se pagó, si se llama como una cuenta; 2) la de la última vez en ese comercio; 3) la última usada
  const t = String(tarjeta || '').toLowerCase();
  const porNombre = t && D.cuentas.find(c => t.includes(c.nombre.toLowerCase()) || c.nombre.toLowerCase().includes(t));
  if (porNombre) return porNombre.id;
  const rec = (D.comercios || {})[comercio.trim().toLowerCase()];
  if (rec && D.cuentas.some(c => c.id === rec.cuenta)) return rec.cuenta;
  return cuentaApp(D.ultimaCuenta);
}
const horaDeTexto = t => { const m = String(t || '').match(/(\d{1,2}):(\d{2})/); return m ? m[1].padStart(2, '0') + ':' + m[2] : '00:00'; };
// ¿Qué es cada trozo de una línea? Se mira el contenido, no la posición, así da igual el orden en que lleguen.
const pareceFecha = t => /\d{4}-\d{2}-\d{2}/.test(t) || /\b\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}\b/.test(t) || /\b\d{1,2}\s+(de\s+)?[a-zé]{3,}\.?\s+(de\s+)?\d{4}\b/i.test(t);
const conMoneda = t => /€|\beur\b|\beuros?\b/i.test(t) && /\d/.test(t);
const soloNumero = t => /^[-+]?\d{1,3}([.\s]\d{3})*([.,]\d{1,2})?$/.test(t.trim()) || /^[-+]?\d+([.,]\d{1,2})?$/.test(t.trim());
const pareceTarjeta = t => D.cuentas.some(c => t.toLowerCase().includes(c.nombre.toLowerCase()))
  || /tarjeta|card|visa|mastercard|maestro|amex|d[eé]bito|cr[eé]dito|••|\*{2,}|apple cash/i.test(t);
// Separa una línea en { fecha, momento, importe, comercio, tarjeta }. Separador «;» o «|».
function partesLinea(l) {
  const sep = l.match(/^PRESU\s*([|;])/i)[1];
  const trozos = l.split(sep).slice(1).map(x => x.trim()).filter(Boolean);
  const iF = trozos.findIndex(pareceFecha);
  const f = iF >= 0 ? trozos[iF] : '';
  let resto = trozos.filter((_, k) => k !== iF);
  // Importe: primero un trozo con «€»; si no, un trozo que sea solo un número
  let iI = resto.findIndex(conMoneda);
  if (iI < 0) iI = resto.findIndex(soloNumero);
  let importe = NaN, comercio = '', tarjeta = '';
  if (iI >= 0) {
    const t = resto[iI];
    const m = t.match(/[-+]?\d{1,3}(?:[.\s]\d{3})*(?:[.,]\d{1,2})?|[-+]?\d+(?:[.,]\d{1,2})?/);
    importe = m ? Math.abs(num(m[0])) : NaN;
    // si en el mismo trozo hay palabras (ej. «Estanco Pepe 1,50 €»), son el comercio
    const palabras = t.replace(m ? m[0] : '', '').replace(/€|\beur(os?)?\b/ig, '').replace(/[·,:\-]+/g, ' ').replace(/\s+/g, ' ').trim();
    resto = resto.filter((_, k) => k !== iI);
    if (palabras && /[a-záéíóúñ]/i.test(palabras)) resto.unshift(palabras);
  }
  let iT = -1;   // la tarjeta suele ir al final: se busca desde atrás, y nunca se usa el primer trozo (es el comercio)
  for (let k = resto.length - 1; k >= 1; k--) if (pareceTarjeta(resto[k])) { iT = k; break; }
  if (iT >= 0) { tarjeta = resto[iT]; resto = resto.filter((_, k) => k !== iT); }
  comercio = resto[0] || '';
  const fecha = f ? fechaDeTexto(f) : hoyIso();
  return { fecha, momento: fecha + 'T' + horaDeTexto(f), importe, comercio, tarjeta };
}
// Junta cada línea que empieza por PRESU con las siguientes que no empiezan por PRESU
// (por si el iPhone escribe el pago en varias líneas)
function lineasPresu(texto) {
  const r = [];
  String(texto || '').split(/\r?\n/).forEach(l => {
    l = l.trim(); if (!l) return;
    if (/^PRESU\s*[|;]/i.test(l)) r.push(l);
    else if (r.length) { const sep = r[r.length - 1].match(/^PRESU\s*([|;])/i)[1]; r[r.length - 1] += sep + l; }
  });
  return r;
}
// Lee el archivo de pagos y devuelve SOLO los nuevos.
// - «Marca» (D.applePayHasta): fecha y hora del pago más reciente ya traído. Todo lo anterior se ignora siempre,
//   aunque el archivo tenga miles de líneas.
// - Del mismo minuto que la marca se recuerda cuáles ya se trajeron (D.importados), por si hubo varios pagos ese minuto.
// - Dos líneas idénticas cuentan como dos pagos (por eso cada una lleva su número: #1, #2…).
// - Además devuelve r.info = { lineas, sinImporte } para explicar qué pasa si no sale nada.
// El botón «Recuperar mis pagos» ejecuta el atajo sin pago, y eso deja una línea vacía: se recuerda a qué hora fue
const momentoAhora = () => { const d = new Date(); return hoyIso() + 'T' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function deRescate(m) {
  const min = x => Date.UTC(+x.slice(0, 4), +x.slice(5, 7) - 1, +x.slice(8, 10), +x.slice(11, 13), +x.slice(14, 16)) / 6e4;
  return (D.rescates || []).some(r => { const d = min(m) - min(r); return d >= 0 && d <= 3; });
}
function leerPagos(texto) {
  if (!D.applePayHasta && (D.importados || []).length && !String(D.importados[0]).includes('#')) {
    // datos de la versión anterior: se calcula la marca con lo que ya se había traído
    D.applePayHasta = D.importados.reduce((m, l) => { const x = /^PRESU\s*[|;]/i.test(l) ? partesLinea(l).momento : ''; return x > m ? x : m; }, '');
    D.importados = [];
  }
  const marca = D.applePayHasta || '', vistos = new Set(D.importados || []), r = [], min = fechaMin(), h = hoyIso(), repes = {}, todos = [];
  const lineas = lineasPresu(texto);
  let sinImporte = 0, recientesSinImporte = 0;
  lineas.forEach(l => {
    const base = l.replace(/\s+/g, ' ');
    repes[base] = (repes[base] || 0) + 1;
    const id = base + '#' + repes[base];
    const { importe, comercio: com, tarjeta, fecha, momento } = partesLinea(l);
    if (!(importe > 0)) {   // líneas sin datos: las del rescate (se ignoran) o pagos que llegaron sin datos (aviso)
      sinImporte++;
      if (momento >= marca && fecha >= min && !deRescate(momento)) recientesSinImporte++;
      return;
    }
    if (fecha < min || fecha > h) return;                      // de antes de empezar o con fecha rara
    const comercio = com || 'Apple Pay';
    const pago = { id, momento, fecha, importe: r2(importe), comercio };
    todos.push(pago);                                          // todos los pagos del archivo (para buscar repetidos)
    if (momento < marca || vistos.has(id)) return;              // ya traído
    r.push(Object.assign(pago, { cat: categoriaPara(comercio), cuenta: cuentaPara(comercio, tarjeta), si: true }));
  });
  // Al acercar el móvil al datáfono se guarda un pago aunque dé error. Si hay otro igual (mismo comercio e importe)
  // pocos minutos antes, seguramente fue un intento fallido: se marca y se deja SIN añadir (se puede activar a mano).
  const minutos = m => Date.UTC(+m.slice(0, 4), +m.slice(5, 7) - 1, +m.slice(8, 10), +m.slice(11, 13), +m.slice(14, 16)) / 6e4;
  r.forEach(x => {
    const igual = todos.find(y => y !== x && todos.indexOf(y) < todos.indexOf(x) && y.importe === x.importe
      && y.comercio.toLowerCase() === x.comercio.toLowerCase() && minutos(x.momento) - minutos(y.momento) <= 10);
    if (igual) { x.repetido = igual.momento.slice(11); x.si = false; }
  });
  r.sort((a, b) => a.momento < b.momento ? -1 : 1);
  r.info = { lineas: lineas.length, sinImporte, recientesSinImporte };
  return r;
}

// Al pulsar «Traer»: mira el portapapeles. Si no hay pagos nuevos, ofrece el rescate.
async function traerApplePay() {
  try { localStorage.removeItem('presu_rescate'); } catch (e) {}
  let texto = null;
  try { texto = await navigator.clipboard.readText(); } catch (e) { texto = null; }
  if (texto === null) return hojaRescate('sinPermiso');       // el iPhone no dejó leer (o se pulsó fuera de «Pegar»)
  usarTextoPagos(texto, true);
}
// Mira un texto (del portapapeles o del archivo) y abre la revisión, o explica por qué no hay nada
function usarTextoPagos(texto, desdePortapapeles) {
  const pagos = leerPagos(texto);
  if (pagos.length) return hojaPagos(pagos);
  const info = pagos.info;
  if (!info.lineas) return desdePortapapeles ? hojaRescate('sinPresu') : aviso('Ese archivo no tiene pagos de Pre$u');
  if (info.recientesSinImporte) return hojaRescate('sinImporte');
  return desdePortapapeles ? hojaRescate('sinNuevos') : aviso('No hay pagos nuevos ✓');
}

// Abre un enlace del iPhone (ej. el de Atajos). Aparte para poder probarlo en el ordenador.

    sinPermiso: ['¿No aparecen tus pagos?', 'No se ha podido leer el portapapeles. Recupera tus pagos de otra forma:'],
    sinImporte: ['⚠️ Los pagos llegan sin importe', 'La automatización se ejecuta, pero no le pasa los datos del pago al atajo. En Atajos → Automatización, revisa que haya una acción Texto con Importe ; Comercio ; Tarjeta o pase, y que «Ejecutar Pre$u» tenga Entrada = Texto.']
  }[motivo];
  abrirHoja(() => ({
    html: `<h2>${T[0]}</h2>
      <p class="ayuda">${T[1]}</p>
      <div class="botones-hoja">
        <button class="boton" id="rRecuperar">🔄 Recuperar mis pagos</button>

        <button class="boton suave" id="rArchivo">📄 Elegir el archivo Presu.txt</button>
        <p class="nota" style="margin:-2px 4px 6px;text-align:center">Está en <b>iCloud Drive → Shortcuts</b>.</p>
        <input type="file" id="rFile" accept=".txt,text/plain" class="oculto">
        <button class="boton sec" id="rPegar">Pegar a mano</button>

      </div>`,
    montar() {
      $('rRecuperar').onclick = () => {
        try { localStorage.setItem('presu_rescate', String(Date.now())); } catch (e) {}

        cerrarHoja();

// Al volver de Atajos (con «◀ Pre$u»): botón grande para traer. El iPhone exige un toque para leer el portapapeles.
function vueltaDeRescate() {
  if (!D || !D.applePay || document.visibilityState === 'hidden') return;
  let t = 0; try { t = +localStorage.getItem('presu_rescate') || 0; } catch (e) {}
  if (!t) return;
  if (Date.now() - t > 10 * 60 * 1000) { try { localStorage.removeItem('presu_rescate'); } catch (e) {} return; }
  if ($('hoja') && $('rTraerAhora')) return;
  abrirHoja(() => ({
    html: `<h2>📲 ¡Ya estás de vuelta!</h2>
      <p class="ayuda">Tus pagos están copiados otra vez. Pulsa el botón y después <b>Pegar</b>.</p>
      <div class="botones-hoja"><button class="boton" id="rTraerAhora">📲 Traer ahora</button><button class="boton sec" id="hCancelar">Ahora no</button></div>`,
    montar() {
      $('rTraerAhora').onclick = () => { cerrarHoja(); traerApplePay(); };
      $('hCancelar').onclick = () => { try { localStorage.removeItem('presu_rescate'); } catch (e) {} cerrarHoja(); };
    }
  }));
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(vueltaDeRescate, 250); });
window.addEventListener('pageshow', () => setTimeout(vueltaDeRescate, 250));

          const marca = pagos.reduce((m, x) => x.momento > m ? x.momento : m, D.applePayHasta || '');

let movIni = null;   // periodo que se está viendo en Movimientos (null = el actual)
const FLECHA_DER = '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
function textoRangoD(d, ini, fin) {
  if (d.periodo === 'mes' && DIA_MES === 1) return mayus(MESES_L[+ini.slice(5, 7) - 1]) + ' ' + ini.slice(0, 4);
  return 'Del ' + (ini.slice(5, 7) === fin.slice(5, 7) ? +ini.slice(8) : fechaCorta(ini)) + ' al ' + fechaCorta(fin);
}
function textoRango(ini, fin) {
  if (D.periodo === 'mes' && DIA_MES === 1) return mayus(MESES_L[+ini.slice(5, 7) - 1]) + ' ' + ini.slice(0, 4);
  return 'Del ' + (ini.slice(5, 7) === fin.slice(5, 7) ? +ini.slice(8) : fechaCorta(ini)) + ' al ' + fechaCorta(fin);
}
const fechaMin = () => inicioPeriodo(D.creado, D.periodo);
const fechaMax = () => masDias(hoyIso(), 365);
const notaFecha = () => `<div class="nota">Puedes elegir desde el ${fechaCorta(fechaMin())}, cuando empezaste con Pre$u.</div>`;
const nombreCta = id => ((D.cuentas.find(c => c.id === id) || {}).nombre || '');
// Qué se hizo con un ingreso extra grande
function textoDestino(m) {
  if (esRepartido(m)) { const t = tramoGasto(m, D.periodo), mes = D.periodo === 'mes';
    return '📅 Repartido en ' + t.n + (mes ? (t.n === 1 ? ' mes' : ' meses') : (t.n === 1 ? ' semana' : ' semanas')) + ' · unos ' + eur(parteDe(m.importe, t.n, 0)) + (mes ? ' al mes' : ' a la semana'); }
  if (m.destino === 'hucha') return '🐷 A la hucha';
  if (m.destino === 'repartir') { const t = tramoDeMov(m, D.periodo); return '📅 Repartido hasta el ' + fechaLarga(m.hasta) + ' · unos ' + eur(parteDe(m.importe, t.n, 0)) + (D.periodo === 'mes' ? ' al mes' : ' a la semana'); }
  if (m.destino === 'objetivo') { const o = (D.objetivos || []).find(x => x.id === m.obj); return '🎯 A «' + (o ? o.nombre : 'tu objetivo') + '»'; }
  return '';
}

// Lo fijo que cuenta en un periodo (por semanas, lo mensual es lo del mes de esa semana, que se reparte)
// Un ingreso fijo que te ha llegado: se guarda cuándo lo contestaste (28/10, q01: Álex cuadró el día 30 y el sueldo llegó el 31;
// sin esto, Pre$u creía que ya estaba dentro de lo que cuadró y nunca entraba en la cuenta)
const llegada = importe => ({ importe: r2(importe), llego: hoyIso(), llegoEn: Date.now() });
function fijosDelPeriodo(ini, fin) {
  const h = hoyIso(), r = [], semanas = D.periodo === 'semana';
  const meter = (it, tipo, f, reparte) => {
    const c = D.cambios[clave(it, f)];
    let estado, valor = it.importe, espera = false;
    if (tipo === 'ingreso') {
      if (c) { valor = c.no ? 0 : c.importe; estado = c.no ? 'No llegó' : c.importe === it.importe ? 'Llegó' : 'Llegó otra cantidad'; }
      else if (f < D.creado) estado = 'Contado';
      else if (f > h) estado = 'Previsto';
      else { estado = 'Esperando respuesta'; espera = true; }
    } else {
      if (c) { valor = c.no ? 0 : c.importe; estado = c.no ? 'Esta vez no se paga' : c.llego && c.importe === it.importe ? (c.llego > hoyIso() ? 'Aún no te lo han cobrado' : 'Ya te lo cobraron el ' + fechaCorta(c.llego)) : 'Cambiado esta vez'; }
      else estado = esAnual(it) ? 'Sale de lo que has apartado' : 'Se resta solo';
    }
    r.push({ it, tipo, f, valor, estado, espera, no: !!(c && c.no), reparte });
  };
  // Lo de antes de empezar (y del mismo día) ya estaba en lo que tenías: no sale
  const ciclo = semanas ? cicloDeSemana(D, ini) : null, nSem = semanas ? Math.max(1, semanasDelCiclo(D, ciclo).length) : 0;
  const desdeCiclo = semanas && ciclo === primerCicloSem(D) ? inicioCiclo(D.creado) : ciclo;
  [['ingreso', D.ingresos], ['fijo', D.fijos]].forEach(([tipo, lista]) => lista.forEach(it => {
    if (semanas && it.frec === 'mes') fechasDe(it, desdeCiclo, finCiclo(ciclo)).filter(f => !yaEnSaldo(D, f, it)).forEach(f => meter(it, tipo, f, nSem));
    else (tipo === 'ingreso' ? fechasIngreso(it, ini, fin) : fechasDe(it, ini, fin)).filter(f => !yaEnSaldo(D, f, it)).forEach(f => meter(it, tipo, f, 0));
  }));
  return r.sort((a, b) => a.f < b.f ? -1 : a.f > b.f ? 1 : a.tipo === 'ingreso' ? -1 : 1);
}

function vistaMovimientos() {
  const P = D.periodo, h = hoyIso(), mes = P === 'mes';
  const primero = inicioPeriodo(D.creado, P), actual = inicioPeriodo(h, P) < primero ? primero : inicioPeriodo(h, P);
  const ultimo = inicioPeriodo(masDias(h, mes ? 365 : 364), P);   // se puede mirar hasta un año adelante
  if (!movIni || movIni > ultimo || movIni < primero) movIni = actual;
  const ini = movIni, fin = finPeriodo(ini, P), esActual = ini === actual;
  const anterior = periodoAnterior(ini, P);
  const futuro = ini > actual;
  const c = calcular(D, h, ini);
  const titulo = esActual ? (mes ? 'Este mes' : 'Esta semana')
    : siguientePeriodo(ini, P) === actual ? (mes ? 'El mes pasado' : 'La semana pasada')
    : siguientePeriodo(actual, P) === ini ? (mes ? 'El mes que viene' : 'La semana que viene') : textoRango(ini, fin);
  // Semana o mes futuro: «Tendrás 200 €» (lo de ese periodo)
  // - El que viene: + lo que te queda DE VERDAD ahora, si lo que sobra pasa al siguiente (o − lo que te has pasado, que siempre se resta)
  // - Los demás: solo lo suyo (+ lo que te sobre antes, si lo que sobra pasa al siguiente)
  const propio = r2(c.queda - c.arrastre), deAntes = mes ? 'del mes anterior' : 'de la semana anterior';
  const cifra = n => `<span class="${n < 0 ? 'neg' : 'pos'}">${eur(n)}</span>`;
  const queda = futuro ? (siguientePeriodo(actual, P) === ini
      ? `Tendrás ${cifra(propio)}${c.arrastre > 0 ? ` + ${cifra(c.arrastre)} ${deAntes}` : c.arrastre < 0 ? ` − <span class="neg">${eur(-c.arrastre)}</span> ${deAntes}` : ''}`
      : `Tendrás ${cifra(propio)}${sobranteEn(D, periodoAnterior(ini, P)) === 'siguiente' ? '<div class="queda-sub">+ lo que te sobre antes</div>' : ''}`)
    : esActual ? `Te queda <span class="${c.queda < 0 ? 'neg' : 'pos'}">${eur(c.queda)}</span>`
    : c.queda >= 0 ? `Te sobraron <span class="pos">${eur(c.queda)}</span>` : `Te faltaron <span class="neg">${eur(-c.queda)}</span>`;

  const fijos = fijosDelPeriodo(ini, fin);
  const movs = D.movimientos.map((m, i) => ({ m, i })).filter(x => x.m.fecha >= ini && x.m.fecha <= fin)
    .sort((a, b) => a.m.fecha < b.m.fecha ? 1 : a.m.fecha > b.m.fecha ? -1 : b.i - a.i).map(x => x.m);
  const variasCtas = D.cuentas.length > 1;
  // Lo apuntado con fecha de antes de empezar con Pre$u no cuenta; sale en el primer periodo para poder borrarlo o cambiarle la fecha
  const antes = ini === primero ? D.movimientos.filter(m => m.fecha < primero).sort((a, b) => a.fecha < b.fecha ? 1 : -1) : [];

  const filaFijo = (x, k) => `<div class="mov" data-k="${k}">
      <div class="ico">${x.it.emoji}</div>
      <div class="txt"><b>${esc(x.it.nombre)}</b><span>${fechaCorta(x.f)}${variasCtas ? ' · ' + esc(nombreCta(x.it.cuenta)) : ''}</span>
        <div class="estado ${x.espera ? 'espera' : ''}">${x.estado}</div></div>
      <div class="cant ${x.no ? 'tachado' : x.tipo === 'ingreso' ? 'mas' : ''}">${x.tipo === 'ingreso' ? '+' : '−'}${eur(x.no ? x.it.importe : x.valor)}${x.reparte && !x.no ? `<small>${eur(x.valor / x.reparte)} esta sem.</small>` : ''}</div>
    </div>`;

function borrarMovimiento(id, despues) {
  const m = D.movimientos.find(x => x.id === id);
  const x = m && m.deuda ? D.deudas.find(d => d.id === m.deuda) : null;   // pago de una deuda: al borrarlo, la deuda vuelve a estar pendiente
  const ob = m && m.objetivo ? (D.objetivos || []).find(o => o.id === m.objetivo && o.cerradoEn) : null;   // gasto de «Usar el dinero»
  if (!m || !confirm('¿Borrar «' + m.desc + '» (' + eur(m.importe) + ')?' + (x ? '\nLa deuda con ' + x.persona + ' volverá a estar pendiente.' : '')
    + (ob ? '\n«' + ob.nombre + '» volverá a estar como antes de usar el dinero.' : ''))) return;
  if (x) x.pagos = x.pagos.filter(p => p.mov !== m.id);
  if (ob) reabrirObjetivo(ob);
  D.movimientos = D.movimientos.filter(x => x !== m && !(m.grupoNeg && x.grupoNeg === m.grupoNeg));   // lo que arrastrabas: se borran las dos partes
  guardarDatos(); if (despues) despues();
  aviso('Borrado'); pintarApp();
}

// ---------- Hoja que sube desde abajo ----------
let hojaActual = null;
function abrirHoja(construir) {
  document.querySelectorAll('.velo, .hoja').forEach(e => e.remove());
  const velo = document.createElement('div'), hoja = document.createElement('div');
  velo.className = 'velo'; hoja.className = 'hoja'; hoja.id = 'hoja';
  document.body.append(velo, hoja);
  hojaActual = construir; pintarHoja();
  void hoja.offsetHeight;   // para que se vea la animación
  velo.classList.add('ver'); hoja.classList.add('ver');
  velo.onclick = cerrarHoja;
  arrastrarHoja(hoja, velo);
}
// Arrastrar la hoja hacia abajo para cerrarla (como en iOS). Solo si está arriba del todo (si no, hace scroll).
function arrastrarHoja(hoja, velo) {
  let x0 = 0, y0 = 0, t0 = 0, dy = 0, estado = 'no';   // estado: '' (aún no se sabe) · 'arrastra' · 'no'
  const empezar = (x, y) => { x0 = x; y0 = y; t0 = Date.now(); dy = 0; estado = hoja.scrollTop <= 0 ? '' : 'no'; };
  const mover = (x, y, e) => {
    if (estado === 'no') return;
    const d = y - y0;
    if (estado === '') {
      if (Math.abs(d) < 6 && Math.abs(x - x0) < 6) return;
      if (d <= 0 || Math.abs(x - x0) > Math.abs(d)) { estado = 'no'; return; }   // hacia arriba o de lado: normal
      estado = 'arrastra'; hoja.style.transition = 'none'; velo.style.transition = 'none';
      if (document.activeElement && hoja.contains(document.activeElement)) document.activeElement.blur();
    }
    if (e.cancelable) e.preventDefault();
    dy = Math.max(0, d);
    hoja.style.transform = 'translate(-50%,' + dy + 'px)';
    velo.style.opacity = String(Math.max(0, 1 - dy / Math.max(hoja.offsetHeight, 1)));
  };
  const soltar = () => {
    if (estado !== 'arrastra') { estado = 'no'; return; }
    estado = 'no';
    const rapido = dy / Math.max(Date.now() - t0, 1) > 0.5;
    hoja.style.transition = ''; velo.style.transition = ''; hoja.style.transform = ''; velo.style.opacity = '';
    if (dy > Math.min(140, hoja.offsetHeight * 0.3) || (dy > 40 && rapido)) cerrarHoja();   // si no, vuelve a su sitio
  };
  hoja.addEventListener('touchstart', e => empezar(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
  hoja.addEventListener('touchmove', e => mover(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
  hoja.addEventListener('touchend', soltar);
  hoja.addEventListener('touchcancel', soltar);
  // Con ratón (para probar en el ordenador): arrastrando desde una zona sin botones
  hoja.addEventListener('mousedown', e => {
    if (e.button || e.target.closest('button, input, textarea, select, a, label')) return;
    empezar(e.clientX, e.clientY);
    const mm = ev => mover(ev.clientX, ev.clientY, ev);
    const mu = () => { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); soltar(); };
    document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
  });
}
function pintarHoja() {
  const h = hojaActual(), el = $('hoja');
  el.innerHTML = '<div class="asa"></div>' + h.html;
  if ($('hCancelar')) $('hCancelar').onclick = cerrarHoja;
  if (h.montar) h.montar();
}
function cerrarHoja() {
  const v = document.querySelector('.velo'), h = $('hoja');
  if (!h) return;
  if (document.activeElement) document.activeElement.blur();
  h.id = ''; v.classList.remove('ver'); h.classList.remove('ver');
  setTimeout(() => { v.remove(); h.remove(); }, 300);
}

// ---------- 📅 Calendario: «Lo que viene» (27/10, decidido por Carles; sustituye a la cuadrícula del mes) ----------
// Una tarjeta por semana (o mes) que viene: cuánto tendrás, si irás justo y lo que toca (cobros, gastos fijos, programados,
// objetivos que completas y cuándo se acaba tu «para gastar»). En cada una, «＋ Programar un gasto».
// Arriba, una línea pequeña con la racha de días sin pasarte de tu € al día.
// Gasto programado = un gasto con fecha futura (origen 'programado'). Cuenta en su semana como un gasto fijo y no se repite.
let calMes = null, calDia = null, calVer = 0;   // calVer: cuántas semanas (o meses) se ven; 0 = las de siempre
const diasEntre = (a, b) => Math.round((aUTC(b) - aUTC(a)) / 864e5);
const esProgramado = m => m.tipo === 'gasto' && m.origen === 'programado';
// Lo que cuenta para la racha: tus gastos normales (no la hucha, ni objetivos, ni lo programado, ni los descuadres)
const cuentaParaDia = m => m.tipo === 'gasto' && !m.hucha && !m.objetivo && !m.repartirHasta && m.origen !== 'programado' && m.origen !== 'cuadre';
function datosCalendario() {
