<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pre$u</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pre$u">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<link rel="icon" type="image/png" href="iconos/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>/* Tema elegido en Ajustes (antes de pintar, para que no parpadee) */
try { var t = localStorage.getItem('presu_tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.setAttribute('data-tema', t); } catch (e) {}</script>
<style>
:root{
  --bg:#f2f2f7;--card:#ffffff;--campo:#f2f2f7;--txt:#111114;--sub:#8a8a8e;--sep:rgba(60,60,67,.12);
  --acento:#0e9f6e;--acento-txt:#ffffff;--acento-suave:rgba(14,159,110,.12);--rojo:#ff3b30;--verde:#0e9f6e;
  --sombra:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);
}
/* Modo oscuro: automático (según el móvil) o elegido en Ajustes */
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){--bg:#0b0b0e;--card:#1c1c1f;--campo:#2a2a2e;--txt:#f5f5f7;--sub:#8e8e93;--sep:rgba(255,255,255,.07);
    --acento:#34d399;--acento-txt:#06281c;--acento-suave:rgba(52,211,153,.15);--rojo:#ff6961;--verde:#4cd97b;--sombra:none}
}
:root[data-tema="oscuro"]{--bg:#0b0b0e;--card:#1c1c1f;--campo:#2a2a2e;--txt:#f5f5f7;--sub:#8e8e93;--sep:rgba(255,255,255,.07);
    --acento:#34d399;--acento-txt:#06281c;--acento-suave:rgba(52,211,153,.15);--rojo:#ff6961;--verde:#4cd97b;--sombra:none}
:root[data-tema="claro"]{color-scheme:light}
:root[data-tema="oscuro"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0 auto;max-width:460px;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,system-ui,sans-serif;
  -webkit-text-size-adjust:100%;line-height:1.35}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;user-select:none;-webkit-user-select:none}
.oculto{display:none!important}

/* ===== Cuestionario ===== */
.paso{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top)) 22px calc(18px + env(safe-area-inset-bottom))}
.arriba{display:flex;align-items:center;gap:14px;height:40px;flex:none}
.atras{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sombra);
  display:flex;align-items:center;justify-content:center;flex:none}
.atras svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.progreso{flex:1;height:5px;border-radius:3px;background:var(--sep);overflow:hidden}
.progreso i{display:block;height:100%;background:var(--acento);border-radius:3px;transition:width .35s ease}
.cuerpo{flex:1;padding-top:30px;animation:entra .28s ease}
@keyframes entra{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.cuerpo.vuelve{animation-name:vuelve}
@keyframes vuelve{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.emoji{font-size:40px;line-height:1;margin-bottom:14px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px;line-height:1.15}
.ayuda{color:var(--sub);font-size:15.5px;margin:0 0 26px}
.abajo{flex:none;padding-top:16px}
.boton{width:100%;padding:16px;font-size:17px;font-weight:650;border:0;border-radius:15px;background:var(--acento);color:var(--acento-txt)}
.boton:disabled{opacity:.35}
.boton.sec{background:none;color:var(--sub);font-weight:600;padding:12px;margin-top:4px}

input.texto{display:block;width:100%;font-size:18px;padding:15px 16px;border:0;border-radius:14px;background:var(--card);
  box-shadow:var(--sombra);outline:none;-webkit-appearance:none}
input.texto:focus{box-shadow:0 0 0 2px var(--acento)}
input.importe{display:block;width:100%;font-size:52px;font-weight:800;letter-spacing:-.03em;border:0;background:none;
  text-align:center;outline:none;padding:6px 0 4px;margin:0}
input.importe::placeholder,input.texto::placeholder{color:var(--sub);opacity:.55}
input[type=date].texto{min-height:52px}

/* Tarjetas para elegir */
.opciones{display:flex;flex-direction:column;gap:11px}
.opcion{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:18px;padding:16px;
  background:var(--card);box-shadow:var(--sombra);transition:box-shadow .15s, background .15s}
.opcion .ico{width:44px;height:44px;border-radius:13px;background:var(--campo);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.opcion b{display:block;font-size:16.5px;font-weight:650}
.opcion span.sub{display:block;color:var(--sub);font-size:13.5px;margin-top:2px}
.opcion .marca{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--sep);flex:none;display:flex;align-items:center;justify-content:center}
.opcion.on{box-shadow:0 0 0 2px var(--acento)}
.opcion.on .ico{background:var(--acento-suave)}
.opcion.on .marca{background:var(--acento);border-color:var(--acento)}
.opcion.on .marca::after{content:"";width:10px;height:6px;border:2.5px solid var(--acento-txt);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}

/* Segmentos y chips */
.etq{font-size:13.5px;color:var(--sub);margin:24px 2px 9px;font-weight:500}
.seg{display:flex;background:var(--campo);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:10px 4px;border-radius:10px;font-size:15px;color:var(--sub);font-weight:500}
.seg button.on{background:var(--card);color:var(--txt);font-weight:650;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.dias{display:flex;gap:6px}
.dias button{flex:1;border:0;background:var(--campo);border-radius:11px;padding:11px 0;font-size:15px;font-weight:600;color:var(--sub)}
.dias button.on{background:var(--acento);color:var(--acento-txt)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--card);box-shadow:var(--sombra);border-radius:20px;padding:10px 14px;font-size:15px}
.chip.on{background:var(--acento);color:var(--acento-txt);font-weight:600}
.paso-dia{display:flex;align-items:center;justify-content:space-between;background:var(--campo);border-radius:12px;padding:6px 6px 6px 16px;font-size:16px}
.paso-dia .ctrl{display:flex;align-items:center;gap:6px}
.paso-dia button{width:40px;height:40px;border:0;border-radius:10px;background:var(--card);font-size:20px;font-weight:600}
.paso-dia b{min-width:34px;text-align:center;font-size:18px}
.nota{color:var(--sub);font-size:13px;margin:10px 2px 0;line-height:1.4}
.tarjeta{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--sombra)}

/* Lista de gastos fijos */
.fijo{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--sep)}
.fijo:first-child{border-top:0;padding-top:2px}
.fijo:last-child{padding-bottom:2px}
.fijo .ico{font-size:20px;width:30px;text-align:center;flex:none}
.fijo input.nom{flex:1;min-width:0;border:0;background:none;font-size:16px;outline:none;padding:6px 0}
.fijo input.cant{width:84px;border:0;border-radius:10px;background:var(--campo);font-size:16px;font-weight:650;text-align:right;padding:9px 10px;outline:none}
.fijo .frec{border:0;border-radius:10px;background:var(--campo);font-size:13px;color:var(--sub);padding:10px 8px;min-width:58px}
.fijo{flex-wrap:wrap}
.fijo .extra{flex-basis:100%;display:flex;gap:6px;padding-left:40px;margin-top:-2px}
.fijo .frec{padding:7px 10px}
.fijo .frec.cta{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
.fijo .quitar{border:0;background:none;color:var(--sub);font-size:16px;padding:6px 2px;opacity:.7}

/* Bienvenida y plan */
.logo{width:76px;height:76px;filter:drop-shadow(0 6px 16px rgba(14,159,110,.35));margin-bottom:26px}
.bienvenida .cuerpo{display:flex;flex-direction:column;justify-content:center;padding-top:0}
.bienvenida h1{font-size:34px}
.plan-luego{margin-top:14px;display:flex;flex-direction:column;gap:3px}
.plan-luego span{color:var(--sub);font-size:14.5px}
.plan-luego b{font-size:18px;font-weight:700}
.bienvenida .privado{margin:22px auto 0;max-width:300px;font-size:13px;line-height:1.45;color:var(--sub);text-align:center}
.grande{font-size:56px;font-weight:800;letter-spacing:-.03em;margin:2px 0 4px;line-height:1.05}
.pos{color:var(--verde)}.neg{color:var(--rojo)}
.linea{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--sep);font-size:15.5px}
.linea:first-child{border-top:0;padding-top:0}
.linea:last-child{padding-bottom:0}
.linea span{color:var(--sub)}
.linea.total{font-weight:700}
.linea.total span{color:var(--txt)}

#aviso{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:30;transform:translateX(-50%) translateY(10px);
  background:rgba(28,28,30,.95);color:#fff;padding:12px 20px;border-radius:24px;font-size:15px;opacity:0;transition:all .25s;pointer-events:none;
  white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#aviso.ver{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== App (parte 3) ===== */
:root{--barra:rgba(255,255,255,.82);--apagado:rgba(120,120,128,.2)}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){--barra:rgba(38,38,42,.82);--apagado:rgba(120,120,128,.36)}}
:root[data-tema="oscuro"]{--barra:rgba(38,38,42,.82);--apagado:rgba(120,120,128,.36)}
.app{padding:calc(12px + env(safe-area-inset-top)) 16px calc(116px + env(safe-area-inset-bottom));animation:entra .25s ease}
.app.quieta{animation:none}
.cab{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 2px 18px;min-height:44px}
.cab-izq{display:flex;align-items:center;gap:12px;min-width:0}
.cab .logo{width:42px;height:42px;margin:0;filter:none;flex:none}
.cab-hola{font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cab-sub{font-size:13.5px;color:var(--sub);margin-top:1px}
.cab h1{margin:0;font-size:30px}
.cab .atras svg.rueda{width:21px;height:21px;stroke-width:1.9}
.app .tarjeta{margin-bottom:14px}
.tit-tarjeta{font-size:17px;font-weight:700;margin:0 0 12px}

.hero{text-align:center;padding:22px 18px 14px}
.hero-etq{color:var(--sub);font-size:15px}
.hero .grande{font-size:52px;margin:4px 0 2px}
.hero-fechas{color:var(--sub);font-size:13.5px}
.barrita{height:6px;border-radius:3px;background:var(--campo);overflow:hidden;margin:16px 0 0}
.barrita i{display:block;height:100%;border-radius:3px;background:var(--acento);transition:width .35s ease}
.barrita i.neg{background:var(--rojo)}
.desglose{margin-top:12px;text-align:left}
.desglose .linea{font-size:14.5px;padding:9px 0}
.desglose .linea:first-child{padding-top:4px}
.desglose .nota{text-align:left;margin-top:8px}

.pregunta{background:var(--acento-suave);box-shadow:none}
.preg-tit{font-size:16.5px;font-weight:650}
.preg-sub{color:var(--sub);font-size:14px;margin:3px 0 12px}
.preg-bot{display:flex;gap:8px}
.mini-b{flex:1;border:0;border-radius:12px;padding:11px 4px;font-size:14.5px;white-space:nowrap;font-weight:600;background:var(--card);color:var(--txt)}
.preg-bot .mini-b:nth-child(2){flex:1.5}
.mini-b.si{background:var(--acento);color:var(--acento-txt)}
.preg-otra{display:flex;gap:8px;margin-top:10px}
.preg-otra input.texto{flex:1;min-width:0;font-size:16px;padding:11px 14px;box-shadow:none}
.preg-otra input.texto:focus{box-shadow:0 0 0 2px var(--acento)}
.preg-otra .mini-b{flex:none;padding:11px 16px}
.pregunta .nota{margin-top:10px}

.app .tarjeta .chip{background:var(--campo);box-shadow:none}
.app .tarjeta .chip.on{background:var(--acento);color:var(--acento-txt)}
.app .etq{margin:16px 2px 8px}
.app input.texto.campo{background:var(--campo);box-shadow:none;font-size:16px;padding:13px 14px}
.app input.texto.campo:focus{box-shadow:0 0 0 2px var(--acento)}
.atajos{display:flex;gap:8px;overflow-x:auto;margin:12px -18px 0;padding:2px 18px;scrollbar-width:none}
.atajos::-webkit-scrollbar{display:none}
/* Categorías que se deslizan (Apuntar) */
.cats-desliza{display:flex;gap:4px;overflow-x:auto;margin:4px -18px 10px;padding:2px 14px 2px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats-desliza::-webkit-scrollbar{display:none}
.cat-t{flex:none;width:68px;border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:6px;scroll-snap-align:start;color:var(--sub)}
.cat-e{width:50px;height:50px;border-radius:16px;background:var(--campo);display:flex;align-items:center;justify-content:center;font-size:24px;transition:background .15s,box-shadow .15s}
.cat-n{font-size:12.5px;font-weight:500;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-t.on .cat-e{background:var(--acento-suave);box-shadow:inset 0 0 0 2px var(--acento)}
.cat-t.on .cat-n{color:var(--txt);font-weight:650}
.atajos .chip{flex:none;font-size:14px;padding:8px 12px;white-space:nowrap}
.apuntar input.importe{font-size:46px;margin:10px 0 8px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--campo);border-radius:12px;
  padding:6px 6px 6px 14px;margin-top:14px;font-size:15.5px;min-height:48px}
.fila small{display:block;color:var(--sub);font-size:12.5px;margin-top:1px}
.fila .enlace{border:0;background:none;color:var(--acento);font-weight:600;padding:8px 10px;font-size:15px}
.app input[type=date].texto.campo{margin-top:8px}
.interruptor{width:51px;height:31px;border-radius:16px;background:var(--apagado);position:relative;border:0;flex:none;transition:background .2s;margin-right:2px}
.interruptor::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.interruptor.on{background:var(--acento)}
.interruptor.on::after{transform:translateX(20px)}
.apuntar .boton{margin-top:16px}

.pronto{text-align:center;padding:34px 20px;color:var(--sub);font-size:15px}
.pronto .emoji{margin-bottom:10px}
.boton.peligro{background:var(--card);color:var(--rojo);box-shadow:var(--sombra)}

.barra{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;
  width:calc(100% - 32px);max-width:428px;display:flex;padding:6px;border-radius:24px;background:var(--barra);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 6px 24px rgba(0,0,0,.12),0 0 0 .5px var(--sep)}
.barra button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 6px;
  border-radius:18px;color:var(--sub);font-size:11.5px;font-weight:600}
.barra svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.barra button.on{color:var(--acento);background:var(--acento-suave)}

/* ===== Movimientos ===== */
.nav-per{display:flex;align-items:center;gap:10px;padding:12px}
.nav-per>button{width:40px;height:40px;border-radius:50%;border:0;background:var(--campo);display:flex;align-items:center;justify-content:center;flex:none;color:var(--txt)}
.nav-per>button.apagado{opacity:.25}
.nav-per svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.nav-per .centro{flex:1;text-align:center;min-width:0}
.nav-per .centro b{display:block;font-size:17px;font-weight:700}
.nav-per .centro span{display:block;color:var(--sub);font-size:13.5px;margin-top:1px}
.nav-per .centro .queda{margin-top:4px;font-size:14.5px;font-weight:600;color:var(--txt)}
.nav-per .centro .queda span{display:inline;font-size:inherit;margin:0;font-weight:750}
.nav-per .queda span.pos{color:var(--verde)}.nav-per .queda span.neg{color:var(--rojo)}
.sec-tit{font-size:13px;color:var(--sub);font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin:22px 6px 8px}
.lista{padding:4px 16px}
.mov{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--sep);cursor:pointer}
.mov:first-child{border-top:0}
.mov .ico{width:40px;height:40px;border-radius:12px;background:var(--campo);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.mov .txt{flex:1;min-width:0}
.mov .txt b{display:block;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .txt span{display:block;color:var(--sub);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .cant{font-weight:650;font-size:15.5px;white-space:nowrap;text-align:right}
.mov .cant.mas{color:var(--verde)}
.mov .cant small{display:block;color:var(--sub);font-size:12px;font-weight:500;margin-top:2px}
.mov .cant.tachado{text-decoration:line-through;color:var(--sub);font-weight:500}
.mov .borrar{border:0;background:none;color:var(--sub);font-size:15px;padding:10px 0 10px 4px;opacity:.7;flex:none}
.estado{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 7px;border-radius:7px;background:var(--campo);color:var(--sub);margin-top:3px}
.estado.espera{background:var(--acento-suave);color:var(--acento)}
.vacio{text-align:center;color:var(--sub);padding:22px 10px;font-size:15px}

/* Hoja que sube desde abajo (para cambiar algo) */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40;opacity:0;transition:opacity .22s}
.velo.ver{opacity:1}
.hoja{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:460px;z-index:41;background:var(--bg);
  border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;max-height:92dvh;overflow-y:auto;
  transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -6px 30px rgba(0,0,0,.15)}
.hoja.ver{transform:translate(-50%,0)}
.hoja .asa{width:38px;height:5px;border-radius:3px;background:var(--apagado);margin:0 auto 16px;cursor:grab}
.hoja h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px}
.hoja .ayuda{margin:0 0 16px;font-size:14.5px}
.hoja .tarjeta .chip{background:var(--campo);box-shadow:none}
.hoja .tarjeta .chip.on{background:var(--acento);color:var(--acento-txt)}
.hoja .etq{margin:16px 2px 8px}
.hoja input.texto.campo{background:var(--campo);box-shadow:none;font-size:16px;padding:13px 14px}
.hoja input.texto.campo:focus{box-shadow:0 0 0 2px var(--acento)}
.hoja input.importe{font-size:46px}
.chips.centrados{justify-content:center;margin-top:6px}
.botones-hoja{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.boton.suave{background:var(--card);color:var(--txt);box-shadow:var(--sombra)}
.boton.rojo-txt{background:none;color:var(--rojo);padding:12px}

/* ===== Resumen ===== */
.res-fila{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--sep)}

.res-fila .txt b{display:block;font-size:15.5px;font-weight:600}
.res-fila .txt span{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.res-fila .cant{font-weight:700;font-size:16px;white-space:nowrap}
.res-total{display:flex;justify-content:space-between;font-weight:700;padding-top:12px;margin-top:2px;border-top:1px solid var(--sep);font-size:15.5px}
.cat-fila{padding:9px 0}
.cat-fila .arriba-cat{display:flex;align-items:center;gap:10px;font-size:15.5px}

.cat-fila .arriba-cat small{color:var(--sub);font-size:13px;font-weight:500;margin-right:4px}
.cat-fila .barrita{margin:7px 0 0 32px;height:7px}
.cab-tarjeta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cab-tarjeta .tit-tarjeta{margin:0}
.cab-tarjeta .enlace{border:0;background:none;color:var(--acento);font-weight:600;font-size:15px;padding:4px 0}
.periodo-res .grande{font-size:40px;margin:2px 0 0}
.periodo-res .sub-res{color:var(--sub);font-size:14px;margin-top:2px}
.periodo-res .barrita{margin-top:14px}
.periodo-res .pie{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-top:8px}
.boton.contorno{background:var(--acento-suave);color:var(--acento);margin-top:4px}
.saldo-fila{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--sep)}
.saldo-fila:first-child{border-top:0;padding-top:2px}
.saldo-fila span{flex:1;font-size:16px}
.saldo-fila input{width:120px;border:0;border-radius:10px;background:var(--campo);font-size:16px;font-weight:650;text-align:right;padding:10px 12px;outline:none}
.saldo-fila input:focus{box-shadow:0 0 0 2px var(--acento)}
.saldo-fila span small{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.saldo-fila span small b{font-weight:600}
.saldo-fila > b{font-size:17px;font-weight:700;white-space:nowrap}
/* ¿Te cuadra con tu banco? */
.cuadre{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--sep);font-size:14.5px;color:var(--sub)}
.cuadre-b{display:flex;gap:8px}
.cuadre-b .mini-b{flex:none;padding:8px 16px;background:var(--campo)}
.cuadre-b .mini-b.si{background:var(--acento)}

.cuadre .enlace{border:0;background:none;color:var(--sub);font-size:14px;padding:4px 0}
.cuadre-efecto{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:15px}
.cuadre-efecto s{color:var(--sub)}
.cuadre-efecto b{font-size:17px}
.ah-cuentas{margin-top:10px}
.ah-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--sep);margin-top:4px;padding-top:12px;font-size:15px;color:var(--sub)}
.ah-total b{font-size:20px;color:var(--txt);font-weight:750}

/* ===== Ajustes ===== */
.ajuste-fila{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px}
.ajuste-fila input{flex:1;min-width:0;border:0;background:none;text-align:right;font-size:16px;outline:none;color:var(--sub);padding:6px 0}
.ajuste-fila input:focus{color:var(--txt)}
.app .tarjeta .etq:first-child{margin-top:0}
.mov .ir{color:var(--sub);font-size:22px;line-height:1;opacity:.6;flex:none}
.anadir{display:block;width:100%;border:0;background:none;color:var(--acento);font-weight:600;font-size:15.5px;padding:13px 0 11px;text-align:left;border-top:1px solid var(--sep)}
.lista .anadir:first-child{border-top:0}
.chip .x{margin-left:6px;color:var(--sub);font-size:13px}
.fila-anadir{display:flex;gap:8px;margin-top:12px}
.fila-anadir input.texto.campo{flex:1;min-width:0;padding:11px 14px}
.fila-anadir .mini-b{flex:none;padding:11px 16px;background:var(--acento-suave);color:var(--acento)}
.hoja .dias button{background:var(--campo)}
.hoja .dias button.on{background:var(--acento);color:var(--acento-txt)}
.hoja .paso-dia button{background:var(--card)}

/* ===== Apple Pay ===== */
.guia-foto{margin-top:14px;padding-top:12px;border-top:1px solid var(--sep)}
.guia-foto span{display:block;font-size:13.5px;color:var(--sub);margin-bottom:8px}
.guia-foto img{display:block;width:100%;height:auto;border-radius:14px}
.applepay{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px}
.applepay .txt{flex:1;min-width:0}
.applepay .txt b{display:block;font-size:15.5px;font-weight:650}
.applepay .txt span{display:block;color:var(--sub);font-size:13px;margin-top:1px}
.applepay .mini-b{flex:none;padding:10px 16px}
.pago{background:var(--card);border-radius:18px;padding:14px 14px 12px;margin-bottom:10px;box-shadow:var(--sombra);transition:opacity .2s}
.pago.fuera{opacity:.45}
.pago .aviso-repe{margin-top:8px;font-size:13px;line-height:1.35;color:var(--txt);background:rgba(255,159,10,.16);border-radius:10px;padding:7px 10px}
.pago.fuera .aviso-repe{opacity:1}
.pago .arriba-pago{display:flex;align-items:center;gap:10px}
.pago .arriba-pago .txt{flex:1;min-width:0}
.pago .arriba-pago b{display:block;font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pago .arriba-pago span{display:block;color:var(--sub);font-size:13px;margin-top:1px}
.pago .arriba-pago .cant{font-weight:750;font-size:17px;white-space:nowrap}
.pago .quitar-pago{border:0;background:var(--campo);color:var(--sub);width:30px;height:30px;border-radius:50%;font-size:13px;flex:none}
.pago .fila-chips{display:flex;gap:6px;overflow-x:auto;margin:10px -14px 0;padding:2px 14px;scrollbar-width:none}
.pago .fila-chips::-webkit-scrollbar{display:none}
.pago .fila-chips .chip{flex:none;font-size:13.5px;padding:7px 11px;white-space:nowrap;background:var(--campo);box-shadow:none}
.pago .fila-chips .chip.on{background:var(--acento);color:var(--acento-txt)}
.hoja textarea{display:block;width:100%;min-height:110px;border:0;border-radius:14px;background:var(--card);box-shadow:var(--sombra);padding:12px 14px;font:inherit;font-size:15px;color:inherit;outline:none;resize:vertical}
.guia ol{margin:0;padding-left:22px;font-size:15px;line-height:1.5}
.guia li{margin-bottom:9px}
.guia code{background:var(--campo);border-radius:6px;padding:1px 6px;font-size:13.5px;word-break:break-all}
</style>
</head>
<body>

<div id="raiz"></div>
<div id="aviso"></div>

<script>
// =====================================================================
//  Pre$u · Parte 2: cuestionario de inicio
//  Todo se guarda solo en este móvil (localStorage). No hay servidor.
// =====================================================================

const $ = id => document.getElementById(id);
const leer = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const num = s => { s = String(s ?? '').trim().replace(/[€\s]/g, ''); if (!s) return NaN; return parseFloat(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s); };
const eur = (n, dec) => Number(n || 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR',
  minimumFractionDigits: dec === 0 ? 0 : 2, maximumFractionDigits: dec === 0 ? 0 : 2 });
const r2 = n => Math.round(n * 100) / 100;
const nuevoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function hoyIso() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
const fmtImporte = n => (n || n === 0) && !isNaN(n) && n > 0 ? String(r2(n)).replace('.', ',') : '';

let tAviso;
function aviso(t) {
  const a = $('aviso'); a.textContent = t; a.classList.add('ver');
  clearTimeout(tAviso); tAviso = setTimeout(() => a.classList.remove('ver'), 2200);
}

const LOGO = `<svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#3EE0A5"/><stop offset="1" stop-color="#0E9F6E"/></linearGradient></defs>
  <rect width="64" height="64" rx="15" fill="url(#lg)"/><circle cx="32" cy="32" r="19" fill="#fff" opacity=".18"/>
  <path d="M38.5 24.2c-1.5-1.9-3.9-3-6.6-3-4 0-6.9 2.1-6.9 5.3 0 7.4 14.2 3.6 14.2 10.9 0 3.3-3.1 5.5-7.3 5.5-3 0-5.6-1.2-7.2-3.3M32 16.5v4.7M32 42.9v4.6"
  fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const FLECHA = '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';

// ---------- Tipos de dinero que entra ----------
const FUENTES = {
  paga:   { emoji: '👨‍👩‍👧', titulo: 'Paga de mis padres',        sub: 'Lo que te dan para ti',                   frec: 'semana', dia: 1, oculta: true },   // ya no sale en el cuestionario (20/10)
  semana: { emoji: '🛒',     titulo: 'Dinero para pasar la semana', sub: 'Para comida, transporte, piso…',        frec: 'semana', dia: 1 },
  sueldo: { emoji: '💼',     titulo: 'Sueldo',                      sub: 'Trabajas y cobras',                     frec: 'mes',    dia: 1 },
  otro:   { emoji: '✨',     titulo: 'Otro ingreso',                sub: 'Beca, clases particulares, ventas…',    frec: 'mes',    dia: 1 }
};
const FIJOS_RAPIDOS = [
  ['🏠', 'Piso'], ['📱', 'Móvil'], ['🏋️', 'Gimnasio'], ['🎵', 'Spotify'], ['🚌', 'Transporte'], ['📺', 'Netflix'], ['➕', 'Otro']
];
const BANCOS_RAPIDOS = ['Revolut', 'BBVA', 'Santander', 'CaixaBank', 'ING', 'Bankinter', 'Sabadell', 'Openbank', 'N26', 'Unicaja', 'Kutxabank', 'Abanca'];
const emojiCuenta = n => /efectivo|cash|met[aá]l/i.test(n) ? '💶' : '🏦';
// Devuelve una cuenta que exista (por si se borró la que estaba elegida)
const cuentaValida = id => (B.cuentas.some(c => c.id === id) ? id : (B.cuentas[0] || {}).id);
const nombreCuenta = id => ((B.cuentas.find(c => c.id === id) || {}).nombre || '').trim();
// Botones para elegir cuenta (solo salen si tiene más de una)
function selectorCuenta(idHtml, actual, titulo) {
  if (B.cuentas.length < 2) return '';
  return `<div class="etq">${titulo}</div><div class="chips" id="${idHtml}">${B.cuentas.map(c =>
    `<button class="chip ${c.id === actual ? 'on' : ''}" data-v="${c.id}">${emojiCuenta(c.nombre)} ${esc(c.nombre.trim() || 'Sin nombre')}</button>`).join('')}</div>`;
}
function montarSelectorCuenta(idHtml, cb) {
  if (!$(idHtml)) return;
  $(idHtml).querySelectorAll('.chip').forEach(b => b.onclick = () => { cb(b.dataset.v); guardarBorrador(); pintar(true); });
}
// Ahorros repartidos en varias cuentas (ej.: 100 € en Revolut y 40 € en Bankinter): una fila por cuenta
const sumaPorCuenta = v => r2(Object.values(v || {}).reduce((s, x) => s + (x > 0 ? x : 0), 0));
const cuentaMayor = (v, porDefecto) => Object.entries(v || {}).reduce((m, [id, x]) => (!m || x > v[m] ? id : m), '') || porDefecto;
function filasAhorroCuentas(cuentas, valores) {
  return `<div class="ah-cuentas">${cuentas.map(c => `<div class="saldo-fila"><span>${emojiCuenta(c.nombre)} ${esc(c.nombre.trim() || 'Sin nombre')}</span>
      <input class="ah-imp" data-id="${c.id}" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0 €" value="${fmtImporte(valores[c.id])}"></div>`).join('')}</div>
    <div class="ah-total"><span>Total</span><b id="ahTotal">${eur(sumaPorCuenta(valores))}</b></div>`;
}
function montarAhorroCuentas(valores, alCambiar) {
  document.querySelectorAll('.ah-imp').forEach(i => i.oninput = () => {
    const n = num(i.value);
    if (n > 0) valores[i.dataset.id] = r2(n); else delete valores[i.dataset.id];
    $('ahTotal').textContent = eur(sumaPorCuenta(valores));
    alCambiar();
  });
}
const DIAS_SEM = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];   // 1 = lunes … 7 = domingo
const DIAS_NOMBRE = ['', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];

// ---------- Borrador del cuestionario (se guarda en cada paso por si se cierra la app) ----------
const VACIO = () => ({
  paso: 0, nombre: '', periodo: '', cuentas: [], fuentes: [], sinIngresos: false, ingresos: {},
  fijos: [], tieneAhorro: null, ahorro: { importe: null, modo: '', hasta: '' }, saldos: {}, sobrante: ''
});
let B = Object.assign(VACIO(), leer('presu_borrador') || {});
let direccion = 1;
const guardarBorrador = () => guardar('presu_borrador', B);

// Lista de pasos (cambia según lo que elijas: un paso por cada tipo de ingreso)
function pasos() {
  return ['bienvenida', 'nombre', 'periodo', 'cuentas', 'fuentes', ...B.fuentes.map(f => 'ingreso:' + f), 'fijos', 'ahorro', 'saldos', 'sobrante', 'plan'];
}
const palabraPeriodo = () => B.periodo === 'mes' ? 'mes' : 'semana';

function ir(delta) {
  const lista = pasos();
  B.paso = Math.max(0, Math.min(lista.length - 1, B.paso + delta));
  direccion = delta;
  guardarBorrador();
  pintar();
  window.scrollTo(0, 0);
}

// ---------- Validación de cada paso ----------
function puedeSeguir(id) {
  if (id === 'nombre') return B.nombre.trim().length > 0;
  if (id === 'periodo') return !!B.periodo;
  if (id === 'cuentas') {
    const n = B.cuentas.map(c => c.nombre.trim().toLowerCase());
    return n.length > 0 && n.every(Boolean) && new Set(n).size === n.length;
  }
  if (id === 'fuentes') return B.fuentes.length > 0 || B.sinIngresos;
  if (id.startsWith('ingreso:')) { const i = B.ingresos[id.slice(8)]; return i && i.importe > 0 && (id.slice(8) !== 'otro' || (i.nombre || '').trim()); }
  if (id === 'fijos') return B.fijos.every(x => x.importe > 0 && x.nombre.trim());
  if (id === 'ahorro') {
    if (B.tieneAhorro === false) return true;
    if (B.tieneAhorro !== true || !(B.ahorro.importe > 0) || !B.ahorro.modo) return false;
    return B.ahorro.modo === 'hucha' || (B.ahorro.hasta && B.ahorro.hasta > hoyIso());
  }
  if (id === 'saldos') return B.cuentas.every(c => isFinite((B.saldos || {})[c.id]));
  if (id === 'sobrante') return !!B.sobrante;
  return true;
}
function porQueNo(id) {
  if (id === 'nombre') return 'Escribe tu nombre';
  if (id === 'periodo' || id === 'sobrante') return 'Elige una opción';
  if (id === 'fuentes') return 'Elige al menos una opción';
  if (id === 'cuentas') {
    if (!B.cuentas.length) return 'Añade al menos una cuenta';
    if (B.cuentas.some(c => !c.nombre.trim())) return 'Ponle nombre a cada cuenta (o quítala con ✕)';
    return 'Hay dos cuentas con el mismo nombre';
  }
  if (id.startsWith('ingreso:')) return id === 'ingreso:otro' && !(B.ingresos.otro.nombre || '').trim() ? 'Ponle un nombre' : 'Escribe la cantidad';
  if (id === 'fijos') return 'Pon nombre y cantidad a cada gasto (o quítalo con ✕)';
  if (id === 'saldos') return B.cuentas.length > 1 ? 'Pon cuánto tienes en cada cuenta (aunque sea 0)' : 'Pon cuánto tienes (aunque sea 0)';
  if (id === 'ahorro') {
    if (B.tieneAhorro !== true) return 'Elige una opción';
    if (!B.ahorro.modo) return 'Dinos si te lo puedes gastar';
    if (!(B.ahorro.importe > 0)) return B.cuentas.length > 1 ? 'Escribe cuánto tienes en cada cuenta' : 'Escribe cuánto tienes ahorrado';
    return 'Elige hasta cuándo (una fecha futura)';
  }
  return '';
}

// ---------- Pantallas ----------
function opcion(o) {
  return `<button class="opcion ${o.on ? 'on' : ''}" data-v="${esc(o.v)}">
    <div class="ico">${o.emoji}</div><div><b>${esc(o.titulo)}</b>${o.sub ? `<span class="sub">${esc(o.sub)}</span>` : ''}</div>
    <div class="marca"></div></button>`;
}
function seg(id, valores, actual) {
  return `<div class="seg" id="${id}">${valores.map(([v, t]) => `<button data-v="${v}" class="${v === actual ? 'on' : ''}">${t}</button>`).join('')}</div>`;
}

const PANTALLAS = {
  bienvenida: () => ({
    clase: 'bienvenida', sinArriba: true,
    html: `${LOGO}<h1>Hola 👋<br>Esto es Pre$u</h1>
      <p class="ayuda">Vamos a montar tu presupuesto en un minuto. Todo se queda en tu móvil y podrás cambiarlo cuando quieras.</p>
      <p class="privado">🔒 Sin registro ni cuentas. Lo que pongas no sale de tu móvil: nadie lo ve, ni siquiera nosotros.</p>`,
    boton: 'Empezar'
  }),

  nombre: () => ({
    html: `<div class="emoji">🙂</div><h1>¿Cómo te llamas?</h1><p class="ayuda">Para saludarte al abrir la app.</p>
      <input id="iNombre" class="texto" type="text" maxlength="30" autocomplete="given-name" enterkeyhint="next" placeholder="Tu nombre" value="${esc(B.nombre)}">`,
    alMontar() { const i = $('iNombre'); i.oninput = () => { B.nombre = i.value; guardarBorrador(); actualizarBoton(); }; setTimeout(() => i.focus(), 250); }
  }),

  periodo: () => ({
    html: `<div class="emoji">🗓️</div><h1>¿Cómo quieres ver tu dinero?</h1>
      <p class="ayuda">Te diremos cuánto puedes gastar en cada periodo. Lo puedes cambiar luego en Ajustes.</p>
      <div class="opciones" id="oPeriodo">
        ${opcion({ v: 'semana', emoji: '📅', titulo: 'Por semanas', sub: '«Te quedan 40 € esta semana»', on: B.periodo === 'semana' })}
        ${opcion({ v: 'mes', emoji: '🗓️', titulo: 'Por meses', sub: '«Te quedan 300 € este mes»', on: B.periodo === 'mes' })}
      </div>`,
    alMontar() { elegirUna('oPeriodo', v => { B.periodo = v; }); }
  }),

  cuentas: () => {
    const tiene = n => B.cuentas.some(c => c.nombre.trim().toLowerCase() === n.toLowerCase());
    return {
      html: `<div class="emoji">🏦</div><h1>¿Dónde tienes tu dinero?</h1>
        <p class="ayuda">Tus bancos, tarjetas o efectivo. Añade todas las que uses.</p>
        <div class="chips" id="cRapidas">
          ${BANCOS_RAPIDOS.map(n => `<button class="chip ${tiene(n) ? 'on' : ''}" data-n="${n}">${n}</button>`).join('')}
          <button class="chip ${tiene('Efectivo') ? 'on' : ''}" data-n="Efectivo">💶 Efectivo</button>
          <button class="chip" data-n="">➕ Otra</button>
        </div>
        <div class="tarjeta ${B.cuentas.length ? '' : 'oculto'}" style="margin-top:18px">
          ${B.cuentas.map(c => `<div class="fijo" data-id="${c.id}">
            <span class="ico">${emojiCuenta(c.nombre)}</span>
            <input class="nom" type="text" maxlength="24" value="${esc(c.nombre)}" placeholder="Nombre (ej: Tarjeta del Santander)">
            <button class="quitar" aria-label="Quitar">✕</button></div>`).join('')}
        </div>
        <div class="nota">Podrás añadir, quitar o cambiar el nombre en Ajustes.</div>`,
      alMontar() {
        $('cRapidas').querySelectorAll('.chip').forEach(b => b.onclick = () => {
          const n = b.dataset.n;
          if (n && tiene(n)) B.cuentas = B.cuentas.filter(c => c.nombre.trim().toLowerCase() !== n.toLowerCase());
          else B.cuentas.push({ id: nuevoId(), nombre: n });
          guardarBorrador(); pintar(true);
          if (!n) { const filas = document.querySelectorAll('.fijo .nom'); filas[filas.length - 1].focus(); }
        });
        document.querySelectorAll('.fijo').forEach(fila => {
          const c = B.cuentas.find(x => x.id === fila.dataset.id);
          fila.querySelector('.nom').oninput = e => { c.nombre = e.target.value; fila.querySelector('.ico').textContent = emojiCuenta(c.nombre); guardarBorrador(); actualizarBoton(); };
          fila.querySelector('.quitar').onclick = () => { B.cuentas = B.cuentas.filter(x => x !== c); guardarBorrador(); pintar(true); };
        });
      }
    };
  },

            ${opcion({ v: 'hucha', emoji: '🐷', titulo: 'No, lo quiero guardar', sub: 'Va a tu hucha: no cuenta para gastar, pero podrás usarlo si hay un imprevisto', on: a.modo === 'hucha' })}

        </div>

      alMontar() {
        const poner = (id, v) => { const n = num(v); if (isFinite(n)) B.saldos[id] = r2(n); else delete B.saldos[id]; };
        const cambio = () => { guardarBorrador(); actualizarBoton(); if ($('sTotal')) $('sTotal').textContent = eur(totalSaldos()); $('sNota').innerHTML = notaSaldos(); };
        if (varias) document.querySelectorAll('.s-imp').forEach(i => i.oninput = () => { poner(i.dataset.id, i.value); cambio(); });

  // El plan: se calcula con las mismas cuentas que usará la app
  plan: () => {
    const d = datosDelBorrador(), h = hoyIso(), mes = d.periodo === 'mes', esteP = mes ? 'al mes' : 'a la semana';
    const c = calcular(d, h), conCobro = hayIngresoMensual(d), c0 = inicioCiclo(d.creado);
    // Un periodo «normal»: el primero después de lo que tenías al empezar
    let p1 = siguientePeriodo(c.ini, d.periodo);
    if (!mes && conCobro) while (cicloDeSemana(d, p1) === c0) p1 = masDias(p1, 7);
    const r1 = calcular(d, h, p1), normal = r2(r1.entra + r1.deInicio + r1.deAhorros - r1.fijos);
    const cobro = conCobro && d.ingresos.some(x => x.frec === 'mes' && x.dia === d.diaMes);
    const filas = [];
    if (c.deInicio) filas.push([c.ciclo && c.ciclo.arranque && c.ciclo.n > 1 ? `Lo que tienes ahora (${eur(d.inicial)} entre ${c.ciclo.n} semanas)` : 'Lo que tienes ahora', '+' + eur(c.deInicio)]);
    if (c.entra) filas.push(['Te entra', '+' + eur(c.entra)]);
    if (c.deAhorros) filas.push(['De tus ahorros', '+' + eur(c.deAhorros)]);
    if (c.fijos) filas.push(['Gastos fijos', '−' + eur(c.fijos)]);
    const hucha = B.tieneAhorro && B.ahorro.modo === 'hucha' ? B.ahorro.importe : 0;
    const despues = cobro ? 'Cuando cobres (' + fechaCorta(cicloSiguiente(c0)) + ')'
      : !mes && conCobro ? 'Desde el ' + fechaCorta(p1) : mes ? 'Los demás meses' : 'Las demás semanas';
    return {
      html: `<div class="emoji">🎉</div><h1>Listo, ${esc(B.nombre.trim())}</h1>

          <div class="grande ${c.total < 0 ? 'neg' : 'pos'}">${eur(c.total)}</div>
          <div style="color:var(--sub);font-size:15px">${textoRangoD(d, c.ini, c.fin)}</div>
        </div>
        ${filas.length ? `<div class="tarjeta" style="margin-top:14px">
          ${filas.map(([a, b]) => `<div class="linea"><span>${a}</span><b>${b}</b></div>`).join('')}
          <div class="linea total"><span>Para gastar</span><b>${eur(c.total)}</b></div></div>` : ''}
        <div class="tarjeta plan-luego"><span>${despues}</span><b>unos ${eur(normal)} ${esteP}</b></div>
        ${hucha ? `<div class="tarjeta" style="margin-top:14px"><div class="linea" style="border-top:0"><span>🐷 En la hucha (no se toca)</span><b>${eur(hucha)}</b></div></div>` : ''}
        <p class="nota" style="margin-top:14px">${normal < 0
          ? 'Ahora mismo pagas más de lo que te entra. Puedes revisar las cantidades volviendo atrás.'
          : (!mes && conCobro ? 'Lo de cada mes se reparte entre sus semanas, así que cambia un poco según el mes. ' : '')
            + (mes ? 'Si un mes' : 'Si una semana') + ' gastas menos, lo que sobre ' + (B.sobrante === 'ahorro' ? 'irá a tus ahorros.' : mes ? 'se sumará al mes siguiente.' : 'se sumará a la semana siguiente.')}
          Todo se puede cambiar en Ajustes.</p>`,
      boton: 'Empezar a usar Pre$u'
    };
  }
};
const totalSaldos = () => r2(B.cuentas.reduce((t, c) => t + (isFinite((B.saldos || {})[c.id]) ? B.saldos[c.id] : 0), 0));
// Debajo de «¿Cuánto tienes ahora?»: cuánto es para gastar y qué pasa con lo que toca hoy
function notaSaldos() {
  const d = datosDelBorrador(), h = hoyIso(), total = totalSaldos(), aho = B.tieneAhorro ? (B.ahorro.importe || 0) : 0;
  fijarDiaMes(d);
  const hasta = hayIngresoMensual(d) ? 'hasta que cobres (' + fechaCorta(cicloSiguiente(inicioCiclo(h))) + ')' : B.periodo === 'mes' ? 'este mes' : 'esta semana';
  const hoyToca = [...d.ingresos.map(x => [x, '+']), ...d.fijos.map(x => [x, '−'])].filter(([x]) => fechasDe(x, h, h).length)
    .map(([x, sg]) => esc(x.nombre) + ' ' + sg + eur(x.importe));
  const partes = [];
  if (Object.keys(B.saldos || {}).length) partes.push((aho ? 'De esto, ' + eur(aho) + ' son tus ahorros. ' : '') + 'Para gastar ' + hasta + ': <b>' + eur(Math.max(0, r2(total - aho))) + '</b>');
  // ¿Mucho dinero? Puede que parte sean ahorros y no lo haya dicho
  const alMes = d.ingresos.reduce((t, x) => t + (x.frec === 'mes' ? x.importe : x.importe * 52 / 12), 0);
  if (total - aho > Math.max(300, alMes * 1.5)) partes.push('¿Parte de esto son ahorros? Vuelve atrás y ponlo en «¿Tienes dinero ahorrado?», o te lo contaremos todo para gastar.');
  if (hoyToca.length) partes.push('Lo que te toca hoy (' + hoyToca.join(', ') + ') cuenta como si ya hubiera pasado.');
  return partes.join('<br>');
}

// ---------- Ayudas para los botones ----------
function elegirUna(id, cb, repintar) {
  $(id).querySelectorAll('.opcion').forEach(b => b.onclick = () => {
    cb(b.dataset.v); guardarBorrador();
    if (repintar) return pintar(true);
    $(id).querySelectorAll('.opcion').forEach(x => x.classList.toggle('on', x === b));
    actualizarBoton();
  });
}
function segmento(id, cb) {
  $(id).querySelectorAll('button').forEach(b => b.onclick = () => cb(b.dataset.v));
}
function actualizarBoton() {
  const id = pasos()[B.paso], b = $('bSeguir');
  if (b) b.style.opacity = puedeSeguir(id) ? '' : '.4';
}

// ---------- Dibujar el paso actual ----------
function pintar(mismoPaso) {
  if (leer('presu')) return pintarInicio();
  const lista = pasos();
  if (B.paso >= lista.length) B.paso = lista.length - 1;
  const id = lista[B.paso];
  const p = id.startsWith('ingreso:') ? PANTALLAS.ingreso(id.slice(8)) : PANTALLAS[id]();
  const progreso = Math.round(B.paso / (lista.length - 1) * 100);
  // Si solo cambia algo dentro del mismo paso, se conserva el scroll y no se repite la animación
  const y = window.scrollY;
  $('raiz').innerHTML = `<section class="paso ${p.clase || ''}">
    ${p.sinArriba ? '' : `<div class="arriba"><button class="atras" id="bAtras" aria-label="Atrás">${FLECHA}</button>
      <div class="progreso"><i style="width:${progreso}%"></i></div></div>`}

// ---------- Fechas (siempre texto 'yyyy-MM-dd', hora local) ----------
const aUTC = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const deUTC = t => new Date(t).toISOString().slice(0, 10);
const masDias = (s, n) => deUTC(aUTC(s) + n * 864e5);
const diaSemana = s => ((new Date(aUTC(s)).getUTCDay() + 6) % 7) + 1;      // 1 = lunes … 7 = domingo
const lunesDe = s => masDias(s, 1 - diaSemana(s));
const diasDelMes = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();     // m: 1–12
const primeroDe = s => s.slice(0, 7) + '-01';
const finDeMes = s => { const [y, m] = s.split('-').map(Number); return s.slice(0, 8) + String(diasDelMes(y, m)).padStart(2, '0'); };
const mesSiguiente = s => { let [y, m] = s.split('-').map(Number); if (++m > 12) { m = 1; y++; } return y + '-' + String(m).padStart(2, '0') + '-01'; };
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fechaCorta = s => +s.slice(8) + ' ' + MESES[+s.slice(5, 7) - 1];
const mayus = s => s.charAt(0).toUpperCase() + s.slice(1);

// Periodos: una semana empieza en lunes; un mes, el día que cobras (DIA_MES; 1 = mes normal).
// Ej.: si cobras el 27, «tu mes» va del 27 al 26 del mes siguiente. Si el mes es más corto, el último día.
let DIA_MES = 1;
const fijarDiaMes = d => { DIA_MES = (d && d.diaMes) || 1; };
const diaEnMes = (s, dia) => { const [y, m] = s.split('-').map(Number); return s.slice(0, 8) + String(Math.min(dia, diasDelMes(y, m))).padStart(2, '0'); };
const inicioCiclo = s => { const c = diaEnMes(s, DIA_MES); return s >= c ? c : diaEnMes(masDias(primeroDe(s), -1), DIA_MES); };
const cicloSiguiente = c => diaEnMes(mesSiguiente(c), DIA_MES);
const finCiclo = c => masDias(cicloSiguiente(c), -1);
const inicioPeriodo = (s, P) => P === 'mes' ? inicioCiclo(s) : lunesDe(s);
const finPeriodo = (ini, P) => P === 'mes' ? finCiclo(ini) : masDias(ini, 6);
const siguientePeriodo = (ini, P) => P === 'mes' ? cicloSiguiente(ini) : masDias(ini, 7);
// Por semanas, cada semana va con el mes de cobro en el que cae su jueves (la semana en que cobras ya cuenta con lo nuevo).
// Las semanas de antes del primer mes completo van con el primero (el de cuando empezaste).
function cicloDeSemana(d, w) { const c = inicioCiclo(masDias(w, 3)), c0 = inicioCiclo(d.creado); return c < c0 ? c0 : c; }
function semanasDelCiclo(d, c) {
  const primera = lunesDe(d.creado), r = [];
  for (let w = lunesDe(masDias(c, -7)); w <= finCiclo(c); w = masDias(w, 7)) if (w >= primera && cicloDeSemana(d, w) === c) r.push(w);
  return r;
}
// Repartir una cantidad en n partes iguales, en céntimos exactos (los céntimos que sobran, a las últimas)
const parteDe = (total, n, i) => { const cent = Math.round(total * 100), base = Math.floor(cent / n), resto = cent - base * n; return (base + (i >= n - resto ? 1 : 0)) / 100; };
// Lo que tenías al empezar: lo de antes (y lo del mismo día) ya está en tu saldo, no se vuelve a contar
const yaEnSaldo = (d, f) => d.inicial != null && f <= d.creado;
const hayIngresoMensual = d => d.ingresos.some(x => x.frec === 'mes');
// El día que cobras: el del ingreso mensual más grande (si no hay, el 1)
const diaDeCobro = ingresos => { const m = ingresos.filter(x => x.frec === 'mes' && x.importe > 0).sort((a, b) => b.importe - a.importe || a.dia - b.dia)[0]; return m ? m.dia : 1; };
// Días en los que toca algo fijo entre dos fechas (si el mes es más corto, el último día)
function fechasDe(item, desde, hasta) {
  // Si se cambió en Ajustes, cada versión vale desde/hasta una fecha (lo de antes no se toca)
  if (item.desde && item.desde > desde) desde = item.desde;
  if (item.hasta && item.hasta < hasta) hasta = item.hasta;
  const r = [];
  if (desde > hasta) return r;
  if (item.frec === 'semana') {
    for (let f = masDias(lunesDe(desde), (item.dia || 1) - 1); f <= hasta; f = masDias(f, 7)) if (f >= desde) r.push(f);
  } else {
    for (let m = primeroDe(desde); m <= hasta; m = mesSiguiente(m)) {
      const [y, mm] = m.split('-').map(Number);
      const f = m.slice(0, 8) + String(Math.min(item.dia || 1, diasDelMes(y, mm))).padStart(2, '0');
      if (f >= desde && f <= hasta) r.push(f);

}
// Cada vez que toca un fijo tiene su clave (ej.: 'abc123|2026-11-01'). En D.cambios se guarda lo que pasó esa vez:
//   { importe: 800 }  → esa vez fue otra cantidad (o «sí, me ha llegado»)
//   { no: true }      → esa vez no llegó / no se pagó
const clave = (item, f) => item.id + '|' + f;

// ---------- Ahorros para gastar: cuánto toca en cada periodo ----------
const contarPeriodos = (a, b, P) => { let n = 0; for (let p = a; p <= b; p = siguientePeriodo(p, P)) n++; return n; };
const periodoAnterior = (p, P) => P === 'mes' ? inicioCiclo(masDias(p, -1)) : masDias(p, -7);
// Tramos [{ desde, ultimo, n, total }]: «total» € repartidos a partes iguales entre «n» periodos empezando en «desde».
// Si no se ha cambiado nunca, un solo tramo desde el principio hasta la fecha elegida.
// («ultimo» puede ser antes del final del reparto si luego se cambió: lo de antes se queda igual.)
function tramosAhorro(d) {
  const P = d.periodo;
  if (d.repartoAhorro) return d.repartoAhorro.map(t => t.total != null ? t   // los tramos antiguos guardaban «cuota» (con decimales de más)

// Lo que toca en el periodo p, en céntimos exactos: 140 € en 11 semanas = 12,72 € × 8 + 12,73 € × 3 = 140,00 €
// (los céntimos que sobran van a los últimos periodos)
function cuotaTramo(t, p, P) {

const sobranteEn = (d, p) => { let v = d.sobrante; (d.sobranteHist || []).forEach(x => { if (x.desde <= p) v = x.valor; }); return v; };

// ---------- El cálculo de cada semana o mes ----------
// Va periodo a periodo desde que empezó a usar Pre$u hasta hoy, pasando lo que sobra (o falta) de uno al siguiente.
// «hasta» (opcional): calcular hasta otro periodo, por ejemplo uno futuro para ver lo previsto
function calcular(d, hoy = hoyIso(), hasta) {

  // Lo de antes de empezar: si puso lo que tenía (d.inicial), ya está ahí y no cuenta; si no, se cuenta como llegado.
  const ing = (it, f) => { const c = d.cambios[clave(it, f)]; if (c) return c.no ? 0 : c.importe; if (yaEnSaldo(d, f)) return 0; return f < d.creado || f > hoy ? it.importe : 0; };

  const semFij = d.fijos.filter(x => x.frec === 'semana'), mesFij = d.fijos.filter(x => x.frec === 'mes');

  const primero = inicioPeriodo(d.creado, P);
  let actual = hasta || inicioPeriodo(hoy, P);

  // Ahorros «para gastar»: a partes iguales entre los periodos hasta la fecha elegida (por tramos si se cambió en Ajustes)
  const a = d.ahorro;
  const tramos = tramosAhorro(d);

  // Por semanas: lo mensual de cada mes de cobro se reparte entre sus semanas (en céntimos exactos)
  const bolsas = {};

    const extras = movs.filter(x => x.tipo === 'ingreso').reduce((s, x) => s + x.importe, 0);
    const gastado = movs.filter(x => x.tipo === 'gasto' && !x.hucha).reduce((s, x) => s + x.importe, 0);

    if (p < actual) {

    for (let p = siguientePeriodo(actual, P); p <= fin; p = siguientePeriodo(p, P)) gastarQueda += r2(cuotaEn(tramos, p, P));
    gastarQueda = r2(gastarQueda);

}

  // Si aún tiene la lista de categorías antigua (sin tocar), se cambia por la nueva
  // Lista de categorías nueva (una sola vez). Lo ya apuntado en «Comer fuera» pasa a «Comida»; lo demás se queda igual.
  // Datos de antes del «mes desde el día que cobras» (20/10): siguen igual que estaban (mes del día 1, sin «lo que tenías al empezar»).
  // Para usar lo nuevo: borrar los datos y volver a hacer el cuestionario (o cambiar el día en Ajustes → Perfil).
  if (D.diaMes == null) { D.diaMes = 1; if (D.inicial === undefined) D.inicial = null; guardarDatos(); }
  fijarDiaMes(D);
  if (!D.categorias || (D.catVersion || 1) < CAT_VERSION) {
    D.categorias = CATEGORIAS.slice(); D.catVersion = CAT_VERSION;
    D.movimientos.forEach(m => { if (m.cat === 'Comer fuera') m.cat = 'Comida'; });
    Object.values(D.comercios || {}).forEach(r => { if (r && r.cat === 'Comer fuera') r.cat = 'Comida'; });
    guardarDatos();
  }
  F = formVacio();
  movIni = null;
  pintarApp(true);
  setTimeout(vueltaDeRescate, 400);
}

function pintarApp(conAnimacion) {
  const y = window.scrollY;
  const v = vista === 'inicio' ? vistaInicio() : vista === 'movimientos' ? vistaMovimientos() : vista === 'ajustes' ? vistaAjustes() : vistaResumen();
  $('raiz').innerHTML = `<section class="app ${conAnimacion ? '' : 'quieta'}">${v.html}</section>${vista === 'ajustes' ? '' : barra()}`;
  if (!conAnimacion) window.scrollTo(0, y);
  if ($('bAjustes')) $('bAjustes').onclick = () => irA('ajustes');
  document.querySelectorAll('.barra button').forEach(b => b.onclick = () => irA(b.dataset.v));
  if (v.montar) v.montar();
}
function irA(v) {
  if (v === vista) return window.scrollTo({ top: 0, behavior: 'smooth' });
  vista = v; otraCantidad = false; subAj = '';
  pintarApp(true); window.scrollTo(0, 0);
}
function barra() {
  return `<nav class="barra">${[['inicio', 'Inicio'], ['movimientos', 'Movimientos'], ['resumen', 'Resumen']].map(([v, t]) =>
    `<button data-v="${v}" class="${vista === v ? 'on' : ''}">${ICONOS[v]}<span>${t}</span></button>`).join('')}</nav>`;
}
const botonAjustes = `<button class="atras" id="bAjustes" aria-label="Ajustes">${ICONOS.ajustes}</button>`;

// ---------- 🏠 Inicio ----------
// Explica de dónde sale lo mensual de esta semana
function notaCiclo(k) {
  const cobro = D.ingresos.some(x => x.frec === 'mes' && x.dia === DIA_MES), sig = cicloSiguiente(k.ini);
  if (k.arranque) return `Hasta el ${fechaCorta(sig)}${cobro ? ', cuando cobras,' : ''} cuentas con lo que tenías al empezar${k.n > 1 ? ' (repartido entre ' + k.n + ' semanas)' : ''}.`;
  if (DIA_MES === 1) return `Lo mensual se reparte entre las ${k.n} semanas de ${MESES_L[+k.ini.slice(5, 7) - 1]}.`;
  return `Lo mensual se reparte entre las ${k.n} semanas de tu mes (del ${fechaCorta(k.ini)} al ${fechaCorta(k.fin)}).`;
}
function vistaInicio() {
  const c = calcular(D), mes = D.periodo === 'mes', h = hoyIso();
  const rango = textoRango(c.ini, c.fin);
  const pct = c.queda < 0 ? 100 : c.total > 0 ? Math.min(100, c.queda / c.total * 100) : 0;

  const filas = [];
  if (c.deInicio) filas.push(['Lo que tenías al empezar', '+' + eur(c.deInicio)]);
  if (c.entra) filas.push(['Te entra', '+' + eur(c.entra)]);
  if (c.deAhorros) filas.push(['De tus ahorros', '+' + eur(c.deAhorros)]);
  if (c.fijos) filas.push(['Gastos fijos', '−' + eur(c.fijos)]);
  if (Math.abs(c.arrastre) >= .005) filas.push([mes ? 'Del mes pasado' : 'De la semana pasada', (c.arrastre > 0 ? '+' : '−') + eur(Math.abs(c.arrastre))]);
  if (c.extras) filas.push(['Ingresos extra', '+' + eur(c.extras)]);
  filas.push(['Gastado', (c.gastado ? '−' : '') + eur(c.gastado)]);
  const hayMensual = !mes && [...D.ingresos, ...D.fijos].some(x => x.frec === 'mes');

  // Aviso de ingreso fijo que espera respuesta
  const p = c.pendientes[0];
  const pregunta = p ? `<div class="tarjeta pregunta">
      <div class="preg-tit">${p.item.emoji} ¿Te ha llegado ${esc(fraseIngreso(p.item))}?</div>
      <div class="preg-sub">${p.fecha === h ? 'Toca hoy' : 'Tocaba el ' + fechaCorta(p.fecha)} · ${eur(p.item.importe)}</div>
      <div class="preg-bot"><button class="mini-b si" id="pSi">Sí</button><button class="mini-b" id="pOtra">Otra cantidad</button><button class="mini-b" id="pNo">No</button></div>
      ${otraCantidad ? `<div class="preg-otra"><input id="pImporte" class="texto" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="¿Cuánto te ha llegado?"><button class="mini-b si" id="pGuardar">Guardar</button></div>` : ''}
      ${c.pendientes.length > 1 ? `<div class="nota">Tienes ${c.pendientes.length - 1} más por confirmar.</div>` : ''}
    </div>` : '';

  // Tarjeta «Apuntar»
  const gasto = F.tipo === 'gasto';
  const atajos = listaAtajos(F.tipo);
  const hucha = gasto && c.hucha !== null;
  const html = `
    <div class="cab"><div class="cab-izq">${LOGO}<div><div class="cab-hola">Hola, ${esc(D.nombre)}</div>
      <div class="cab-sub">${mayus(DIAS_NOMBRE[diaSemana(h)])}, ${+h.slice(8)} de ${MESES_L[+h.slice(5, 7) - 1]}</div></div></div>${botonAjustes}</div>
    ${D.applePay ? `<div class="tarjeta applepay"><div class="ico" style="font-size:24px">📲</div>
      <div class="txt"><b>Pagos de Apple Pay</b><span>Trae lo que has pagado con el iPhone</span></div>
      <button class="mini-b si" id="bApplePay">Traer</button></div>` : ''}
    ${pregunta}
    <div class="tarjeta hero">
      <div class="hero-etq">Te queda ${mes ? 'este mes' : 'esta semana'}</div>
      <div class="grande ${c.queda < 0 ? 'neg' : 'pos'}">${eur(c.queda)}</div>
      <div class="hero-fechas">${rango}</div>
      <div class="barrita"><i class="${c.queda < 0 ? 'neg' : ''}" style="width:${pct}%"></i></div>
      <div class="desglose">${filas.map(([a, b]) => `<div class="linea"><span>${a}</span><b>${b}</b></div>`).join('')}
        ${hayMensual && c.ciclo ? `<div class="nota">${notaCiclo(c.ciclo)}</div>` : ''}</div>
    </div>

      <input id="aImp" class="importe" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0 €" value="${esc(F.importe)}">
      ${gasto ? `<div class="cats-desliza" id="aCats">${D.categorias.map(k =>
        `<button class="cat-t ${F.cat === k ? 'on' : ''}" data-v="${esc(k)}"><span class="cat-e">${emojiCat(k)}</span><span class="cat-n">${esc(k)}</span></button>`).join('')}</div>` : ''}
      <input id="aDesc" class="texto campo" type="text" maxlength="40" enterkeyhint="done" autocomplete="off"
        placeholder="${gasto ? '¿En qué? (ej: café)' : '¿De qué? (ej: bizum de Pau)'}" value="${esc(F.desc)}">
      ${D.cuentas.length > 1 ? `<div class="etq">${gasto ? '¿Con qué has pagado?' : '¿Dónde te ha llegado?'}</div><div class="chips" id="aCuentas">${D.cuentas.map(k =>
        `<button class="chip ${F.cuenta === k.id ? 'on' : ''}" data-v="${k.id}">${k.emoji} ${esc(k.nombre)}</button>`).join('')}</div>` : ''}

      ${F.verFecha ? `<input id="aFecha" class="texto campo" type="date" min="${fechaMin()}" max="${fechaMax()}" value="${F.fecha || h}">${notaFecha()}` : ''}
      ${hucha ? `<div class="fila"><span>🐷 Pagar con la hucha<small>Te quedan ${eur(c.hucha)} · no cuenta ${mes ? 'este mes' : 'esta semana'}</small></span>

      <button class="boton" id="bGuardar">${gasto ? (F.hucha ? 'Pagar con la hucha' : 'Guardar gasto') : 'Guardar ingreso'}</button>

  return {
    html,
    montar() {
      if ($('bApplePay')) $('bApplePay').onclick = traerApplePay;
      if (p) {
        const k = clave(p.item, p.fecha);
        const responder = (v, t) => { D.cambios[k] = v; guardarDatos(); otraCantidad = false; aviso(t); pintarApp(); };
        $('pSi').onclick = () => responder({ importe: p.item.importe }, 'Sumado: +' + eur(p.item.importe));
        $('pNo').onclick = () => responder({ no: true }, 'Vale, no lo contamos');
        $('pOtra').onclick = () => { otraCantidad = !otraCantidad; pintarApp(); if (otraCantidad) $('pImporte').focus(); };
        if ($('pGuardar')) $('pGuardar').onclick = () => {
          const n = num($('pImporte').value);
          if (!(n > 0)) { aviso('Escribe la cantidad (si no ha llegado, pulsa «No»)'); return; }
          responder({ importe: r2(n) }, 'Sumado: +' + eur(n));
        };
      }
      segmento('aTipo', v => { if (v === F.tipo) return; F = formVacio(v); pintarApp(); });
      $('aImp').oninput = e => { F.importe = e.target.value; };
      $('aDesc').oninput = e => { F.desc = e.target.value; };
      // Categorías: se marcan sin volver a pintar (así la fila no salta al principio)
      document.querySelectorAll('#aCats .cat-t').forEach(b => b.onclick = () => {
        F.cat = F.cat === b.dataset.v ? '' : b.dataset.v;
        document.querySelectorAll('#aCats .cat-t').forEach(x => x.classList.toggle('on', x.dataset.v === F.cat));
      });
      const catOn = document.querySelector('#aCats .cat-t.on');
      if (catOn) $('aCats').scrollLeft = Math.max(0, catOn.offsetLeft - $('aCats').clientWidth / 2 + catOn.offsetWidth / 2);
      document.querySelectorAll('#aCuentas .chip').forEach(b => b.onclick = () => { F.cuenta = b.dataset.v; pintarApp(); });
      document.querySelectorAll('#aAtajos .chip').forEach((b, i) => b.onclick = () => {

      if ($('aFecha')) $('aFecha').onchange = $('aFecha').oninput = e => {
        const v = e.target.value;
        if (!v || v < fechaMin() || v > fechaMax()) return;

        document.querySelector('#fApuntar .fila span').textContent = '📅 ' + textoFecha(F.fecha);
      };
      if ($('aHucha')) $('aHucha').onclick = () => { F.hucha = !F.hucha; pintarApp(); };
      $('bGuardar').onclick = guardarMovimiento;
    }
  };
}

// Atajos: lo que más se repite (misma descripción, categoría y cuenta)
function listaAtajos(tipo) {
  const g = new Map();
  D.movimientos.forEach((x, i) => {
    if (x.tipo !== tipo || x.hucha || !(x.desc || '').trim()) return;
    const k = x.desc.trim().toLowerCase() + '|' + (x.cat || '') + '|' + x.cuenta;
    const v = g.get(k) || { n: 0 };
    g.set(k, { n: v.n + 1, ult: i, m: x });
  });
  return [...g.values()].sort((a, b) => b.n - a.n || b.ult - a.ult).slice(0, 6).map(v => v.m);
}

function guardarMovimiento() {
  const imp = num(F.importe), gasto = F.tipo === 'gasto';
  if (!(imp > 0)) { aviso('Escribe la cantidad'); $('aImp').focus(); return; }
  if (gasto && F.hucha) {
    const queda = calcular(D).hucha;
    if (imp > queda + 1e-9) { aviso('En la hucha solo te quedan ' + eur(queda)); return; }
  }
  const cat = gasto ? (F.cat || 'Otros') : '';
  const m = { id: nuevoId(), tipo: F.tipo, importe: r2(imp), desc: F.desc.trim() || (gasto ? cat : 'Ingreso extra'),
    cuenta: cuentaApp(F.cuenta), fecha: F.fecha || hoyIso(), ts: Date.now() };
  if (gasto) m.cat = cat;
  if (gasto && F.hucha) m.hucha = true;
  D.movimientos.push(m);
  D.ultimaCuenta = m.cuenta;
  guardarDatos();
  if (document.activeElement) document.activeElement.blur();
  aviso(m.hucha ? 'Pagado con la hucha 🐷' : gasto ? 'Gasto apuntado ✓' : 'Ingreso apuntado ✓');
  F = formVacio(F.tipo);
  pintarApp();
}

// Intro en el teclado = Guardar (en Apuntar) / Guardar (en «Otra cantidad»)
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT' || !D) return;
  if (e.target.id === 'pImporte') { e.preventDefault(); $('pGuardar').click(); }
  else if (e.target.closest('.hoja')) { e.preventDefault(); if ($('hGuardar')) $('hGuardar').click(); }
  else if (e.target.closest('#fApuntar')) { e.preventDefault(); guardarMovimiento(); }
});

// ---------- 📲 Pagos de Apple Pay ----------
// La automatización de Atajos guarda cada pago como una línea:  PRESU|fecha|importe|comercio|tarjeta
// y copia la lista entera al portapapeles. Aquí se lee, se quitan los ya añadidos y se revisan antes de añadir.
const MESES_TXT = { ene: 1, feb: 2, mar: 3, abr: 4, may: 5, jun: 6, jul: 7, ago: 8, sep: 9, set: 9, oct: 10, nov: 11, dic: 12,
  jan: 1, apr: 4, aug: 8, dec: 12 };
function fechaDeTexto(t) {
  t = String(t || '').trim().toLowerCase();
  let m = t.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + '-' + m[2] + '-' + m[3];
  m = t.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if (m) return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  m = t.match(/(\d{1,2})\s+(?:de\s+)?([a-zé]{3})[a-zé]*\.?\s+(?:de\s+)?(\d{4})/);
  if (m && MESES_TXT[m[2]]) return m[3] + '-' + String(MESES_TXT[m[2]]).padStart(2, '0') + '-' + m[1].padStart(2, '0');
  return hoyIso();
}
const importeDeTexto = t => { const m = String(t || '').replace(/\s/g, '').match(/-?[\d.,]+/); return m ? Math.abs(num(m[0])) : NaN; };
// Categoría que se propone según el nombre del comercio
const PISTAS = [
  ['Súper', /mercadona|lidl|carrefour|\bdia\b|aldi|eroski|consum|alcampo|hipercor|caprabo|bonpreu|condis|ahorramas|super|supermerc|bon area|bonarea/],
  ['Comida', /bar\b|rest|burger|mcdonald|kfc|telepizza|domino|pizza|glovo|just ?eat|uber ?eats|caf[eé]|starbucks|montaditos|kebab|sushi|taco|vips|foster|goiko|tgb|granier|panader/],
  ['Transporte', /renfe|metro|\bbus\b|uber|cabify|bolt|repsol|cepsa|bp\b|galp|shell|gasolin|tmb|emt|alsa|fgc|parking|taxi|bicing/],
  ['Ropa', /zara|bershka|pull|primark|h&m|h & m|mango|stradivarius|shein|lefties|decathlon|nike|adidas|jd sports|springfield|massimo/],
  ['Fiesta', /discoteca|disco|\bpub\b|club|cocktail|copas|razzmatazz|apolo|opium/],
  ['Ocio', /cine|yelmo|cinesa|kinépolis|steam|playstation|xbox|nintendo|ticketmaster|entradas|fnac|bowling|museo|teatro/],
  ['Viajes', /ryanair|vueling|iberia|easyjet|booking|airbnb|hotel|hostel|aeropuerto|aena/]
];
function categoriaPara(comercio) {
  const k = comercio.trim().toLowerCase(), rec = (D.comercios || {})[k];
  if (rec && D.categorias.includes(rec.cat)) return rec.cat;
  const p = PISTAS.find(([c, re]) => D.categorias.includes(c) && re.test(k));
  return p ? p[0] : D.categorias.includes('Otros') ? 'Otros' : D.categorias[D.categorias.length - 1];
}
function cuentaPara(comercio, tarjeta) {
  // 1) la tarjeta con la que se pagó, si se llama como una cuenta; 2) la de la última vez en ese comercio; 3) la última usada
  const t = String(tarjeta || '').toLowerCase();
  const porNombre = t && D.cuentas.find(c => t.includes(c.nombre.toLowerCase()) || c.nombre.toLowerCase().includes(t));
  if (porNombre) return porNombre.id;
  const rec = (D.comercios || {})[comercio.trim().toLowerCase()];
  if (rec && D.cuentas.some(c => c.id === rec.cuenta)) return rec.cuenta;
  return cuentaApp(D.ultimaCuenta);
}
const horaDeTexto = t => { const m = String(t || '').match(/(\d{1,2}):(\d{2})/); return m ? m[1].padStart(2, '0') + ':' + m[2] : '00:00'; };
// ¿Qué es cada trozo de una línea? Se mira el contenido, no la posición, así da igual el orden en que lleguen.
const pareceFecha = t => /\d{4}-\d{2}-\d{2}/.test(t) || /\b\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}\b/.test(t) || /\b\d{1,2}\s+(de\s+)?[a-zé]{3,}\.?\s+(de\s+)?\d{4}\b/i.test(t);
const conMoneda = t => /€|\beur\b|\beuros?\b/i.test(t) && /\d/.test(t);
const soloNumero = t => /^[-+]?\d{1,3}([.\s]\d{3})*([.,]\d{1,2})?$/.test(t.trim()) || /^[-+]?\d+([.,]\d{1,2})?$/.test(t.trim());
const pareceTarjeta = t => D.cuentas.some(c => t.toLowerCase().includes(c.nombre.toLowerCase()))
  || /tarjeta|card|visa|mastercard|maestro|amex|d[eé]bito|cr[eé]dito|••|\*{2,}|apple cash/i.test(t);
// Separa una línea en { fecha, momento, importe, comercio, tarjeta }. Separador «;» o «|».
function partesLinea(l) {
  const sep = l.match(/^PRESU\s*([|;])/i)[1];
  const trozos = l.split(sep).slice(1).map(x => x.trim()).filter(Boolean);
  const iF = trozos.findIndex(pareceFecha);
  const f = iF >= 0 ? trozos[iF] : '';
  let resto = trozos.filter((_, k) => k !== iF);
  // Importe: primero un trozo con «€»; si no, un trozo que sea solo un número
  let iI = resto.findIndex(conMoneda);
  if (iI < 0) iI = resto.findIndex(soloNumero);
  let importe = NaN, comercio = '', tarjeta = '';
  if (iI >= 0) {
    const t = resto[iI];
    const m = t.match(/[-+]?\d{1,3}(?:[.\s]\d{3})*(?:[.,]\d{1,2})?|[-+]?\d+(?:[.,]\d{1,2})?/);
    importe = m ? Math.abs(num(m[0])) : NaN;
    // si en el mismo trozo hay palabras (ej. «Estanco Pepe 1,50 €»), son el comercio
    const palabras = t.replace(m ? m[0] : '', '').replace(/€|\beur(os?)?\b/ig, '').replace(/[·,:\-]+/g, ' ').replace(/\s+/g, ' ').trim();
    resto = resto.filter((_, k) => k !== iI);
    if (palabras && /[a-záéíóúñ]/i.test(palabras)) resto.unshift(palabras);
  }
  let iT = -1;   // la tarjeta suele ir al final: se busca desde atrás, y nunca se usa el primer trozo (es el comercio)
  for (let k = resto.length - 1; k >= 1; k--) if (pareceTarjeta(resto[k])) { iT = k; break; }
  if (iT >= 0) { tarjeta = resto[iT]; resto = resto.filter((_, k) => k !== iT); }
  comercio = resto[0] || '';
  const fecha = f ? fechaDeTexto(f) : hoyIso();
  return { fecha, momento: fecha + 'T' + horaDeTexto(f), importe, comercio, tarjeta };
}
// Junta cada línea que empieza por PRESU con las siguientes que no empiezan por PRESU
// (por si el iPhone escribe el pago en varias líneas)
function lineasPresu(texto) {
  const r = [];
  String(texto || '').split(/\r?\n/).forEach(l => {
    l = l.trim(); if (!l) return;
    if (/^PRESU\s*[|;]/i.test(l)) r.push(l);
    else if (r.length) { const sep = r[r.length - 1].match(/^PRESU\s*([|;])/i)[1]; r[r.length - 1] += sep + l; }
  });
  return r;
}
// Lee el archivo de pagos y devuelve SOLO los nuevos.
// - «Marca» (D.applePayHasta): fecha y hora del pago más reciente ya traído. Todo lo anterior se ignora siempre,
//   aunque el archivo tenga miles de líneas.
// - Del mismo minuto que la marca se recuerda cuáles ya se trajeron (D.importados), por si hubo varios pagos ese minuto.
// - Dos líneas idénticas cuentan como dos pagos (por eso cada una lleva su número: #1, #2…).
// - Además devuelve r.info = { lineas, sinImporte } para explicar qué pasa si no sale nada.
// El botón «Recuperar mis pagos» ejecuta el atajo sin pago, y eso deja una línea vacía: se recuerda a qué hora fue
const momentoAhora = () => { const d = new Date(); return hoyIso() + 'T' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function deRescate(m) {
  const min = x => Date.UTC(+x.slice(0, 4), +x.slice(5, 7) - 1, +x.slice(8, 10), +x.slice(11, 13), +x.slice(14, 16)) / 6e4;
  return (D.rescates || []).some(r => { const d = min(m) - min(r); return d >= 0 && d <= 3; });
}
function leerPagos(texto) {
  if (!D.applePayHasta && (D.importados || []).length && !String(D.importados[0]).includes('#')) {
    // datos de la versión anterior: se calcula la marca con lo que ya se había traído
    D.applePayHasta = D.importados.reduce((m, l) => { const x = /^PRESU\s*[|;]/i.test(l) ? partesLinea(l).momento : ''; return x > m ? x : m; }, '');
    D.importados = [];
  }
  const marca = D.applePayHasta || '', vistos = new Set(D.importados || []), r = [], min = fechaMin(), h = hoyIso(), repes = {}, todos = [];
  const lineas = lineasPresu(texto);
  let sinImporte = 0, recientesSinImporte = 0;
  lineas.forEach(l => {
    const base = l.replace(/\s+/g, ' ');
    repes[base] = (repes[base] || 0) + 1;
    const id = base + '#' + repes[base];
    const { importe, comercio: com, tarjeta, fecha, momento } = partesLinea(l);
    if (!(importe > 0)) {   // líneas sin datos: las del rescate (se ignoran) o pagos que llegaron sin datos (aviso)
      sinImporte++;
      if (momento >= marca && fecha >= min && !deRescate(momento)) recientesSinImporte++;
      return;
    }
    if (fecha < min || fecha > h) return;                      // de antes de empezar o con fecha rara
    const comercio = com || 'Apple Pay';
    const pago = { id, momento, fecha, importe: r2(importe), comercio };
    todos.push(pago);                                          // todos los pagos del archivo (para buscar repetidos)
    if (momento < marca || vistos.has(id)) return;              // ya traído
    r.push(Object.assign(pago, { cat: categoriaPara(comercio), cuenta: cuentaPara(comercio, tarjeta), si: true }));
  });
  // Al acercar el móvil al datáfono se guarda un pago aunque dé error. Si hay otro igual (mismo comercio e importe)
  // pocos minutos antes, seguramente fue un intento fallido: se marca y se deja SIN añadir (se puede activar a mano).
  const minutos = m => Date.UTC(+m.slice(0, 4), +m.slice(5, 7) - 1, +m.slice(8, 10), +m.slice(11, 13), +m.slice(14, 16)) / 6e4;
  r.forEach(x => {
    const igual = todos.find(y => y !== x && todos.indexOf(y) < todos.indexOf(x) && y.importe === x.importe
      && y.comercio.toLowerCase() === x.comercio.toLowerCase() && minutos(x.momento) - minutos(y.momento) <= 10);
    if (igual) { x.repetido = igual.momento.slice(11); x.si = false; }
  });
  r.sort((a, b) => a.momento < b.momento ? -1 : 1);
  r.info = { lineas: lineas.length, sinImporte, recientesSinImporte };
  return r;
}

// Al pulsar «Traer»: mira el portapapeles. Si no hay pagos nuevos, ofrece el rescate.
async function traerApplePay() {
  try { localStorage.removeItem('presu_rescate'); } catch (e) {}
  let texto = null;
  try { texto = await navigator.clipboard.readText(); } catch (e) { texto = null; }
  if (texto === null) return hojaRescate('sinPermiso');       // el iPhone no dejó leer (o se pulsó fuera de «Pegar»)
  usarTextoPagos(texto, true);
}
// Mira un texto (del portapapeles o del archivo) y abre la revisión, o explica por qué no hay nada
function usarTextoPagos(texto, desdePortapapeles) {
  const pagos = leerPagos(texto);
  if (pagos.length) return hojaPagos(pagos);
  const info = pagos.info;
  if (!info.lineas) return desdePortapapeles ? hojaRescate('sinPresu') : aviso('Ese archivo no tiene pagos de Pre$u');
  if (info.recientesSinImporte) return hojaRescate('sinImporte');
  return desdePortapapeles ? hojaRescate('sinNuevos') : aviso('No hay pagos nuevos ✓');
}

let movIni = null;   // periodo que se está viendo en Movimientos (null = el actual)

const fechaMin = () => inicioPeriodo(D.creado, D.periodo);

// Lo fijo que cuenta en un periodo (por semanas, lo mensual es lo del mes de esa semana, que se reparte)
function fijosDelPeriodo(ini, fin) {
  const h = hoyIso(), r = [], semanas = D.periodo === 'semana';
  const meter = (it, tipo, f, reparte) => {
    const c = D.cambios[clave(it, f)];
    let estado, valor = it.importe, espera = false;
    if (tipo === 'ingreso') {
      if (c) { valor = c.no ? 0 : c.importe; estado = c.no ? 'No llegó' : c.importe === it.importe ? 'Llegó' : 'Llegó otra cantidad'; }
      else if (f < D.creado) estado = 'Contado';
      else if (f > h) estado = 'Previsto';
      else { estado = 'Esperando respuesta'; espera = true; }
    } else {
      if (c) { valor = c.no ? 0 : c.importe; estado = c.no ? 'Esta vez no se paga' : 'Cambiado esta vez'; }
      else estado = 'Se resta solo';
    }
    r.push({ it, tipo, f, valor, estado, espera, no: !!(c && c.no), reparte });
  };
  // Lo de antes de empezar (y del mismo día) ya estaba en lo que tenías: no sale
  const ciclo = semanas ? cicloDeSemana(D, ini) : null, nSem = semanas ? Math.max(1, semanasDelCiclo(D, ciclo).length) : 0;
  [['ingreso', D.ingresos], ['fijo', D.fijos]].forEach(([tipo, lista]) => lista.forEach(it => {
    if (semanas && it.frec === 'mes') fechasDe(it, ciclo, finCiclo(ciclo)).filter(f => !yaEnSaldo(D, f)).forEach(f => meter(it, tipo, f, nSem));
    else fechasDe(it, ini, fin).filter(f => !yaEnSaldo(D, f)).forEach(f => meter(it, tipo, f, 0));
  }));
  return r.sort((a, b) => a.f < b.f ? -1 : a.f > b.f ? 1 : a.tipo === 'ingreso' ? -1 : 1);
}

function vistaMovimientos() {
  const P = D.periodo, h = hoyIso(), mes = P === 'mes';
  const primero = inicioPeriodo(D.creado, P), actual = inicioPeriodo(h, P) < primero ? primero : inicioPeriodo(h, P);
  const ultimo = inicioPeriodo(masDias(h, mes ? 365 : 364), P);   // se puede mirar hasta un año adelante
  if (!movIni || movIni > ultimo || movIni < primero) movIni = actual;
  const ini = movIni, fin = finPeriodo(ini, P), esActual = ini === actual;
  const anterior = periodoAnterior(ini, P);
  const futuro = ini > actual;
  const c = calcular(D, h, ini);
  const titulo = esActual ? (mes ? 'Este mes' : 'Esta semana')
    : siguientePeriodo(ini, P) === actual ? (mes ? 'El mes pasado' : 'La semana pasada')
    : siguientePeriodo(actual, P) === ini ? (mes ? 'El mes que viene' : 'La semana que viene') : textoRango(ini, fin);
  const queda = futuro ? `Tendrás unos <span class="${c.queda < 0 ? 'neg' : 'pos'}">${eur(c.queda)}</span>`
    : esActual ? `Te queda <span class="${c.queda < 0 ? 'neg' : 'pos'}">${eur(c.queda)}</span>`
    : c.queda >= 0 ? `Te sobraron <span class="pos">${eur(c.queda)}</span>` : `Te faltaron <span class="neg">${eur(-c.queda)}</span>`;

  const fijos = fijosDelPeriodo(ini, fin);
  const movs = D.movimientos.map((m, i) => ({ m, i })).filter(x => x.m.fecha >= ini && x.m.fecha <= fin)
    .sort((a, b) => a.m.fecha < b.m.fecha ? 1 : a.m.fecha > b.m.fecha ? -1 : b.i - a.i).map(x => x.m);
  const variasCtas = D.cuentas.length > 1;
  // Lo apuntado con fecha de antes de empezar con Pre$u no cuenta; sale en el primer periodo para poder borrarlo o cambiarle la fecha

      ${antes.length ? `<div class="sec-tit">Antes de empezar (no cuentan)</div>

        movIni = anterior; pintarApp();
      };
      $('mSig').onclick = () => { if (ini >= ultimo) return aviso('Puedes mirar hasta un año adelante'); movIni = siguientePeriodo(ini, P); pintarApp(); };
      document.querySelectorAll('#mFijos .mov').forEach(el => el.onclick = () => hojaFijo(fijos[+el.dataset.k]));
      document.querySelectorAll('#mMovs .mov, #mAntes .mov').forEach(el => {

}

function borrarMovimiento(id, despues) {
  const m = D.movimientos.find(x => x.id === id);
