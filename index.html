      if (tipo === 'ahorro' || tipo === 'mal') { reset(f, i); if (tipo === 'ahorro') sobro.push({ cuenta: f.k.id, importe: f.d, fecha: h, ts: ahora + i }); return; }
      if (tipo === 'hucha') {
        const m = mov({ id: nuevoId(), tipo: 'ingreso', importe: f.d, desc: '🐷 A la hucha (al cuadrar)', cuenta: f.k.id, fecha: h, ts: ahora + i, sinCuenta: true, destino: 'hucha', origen: 'cuadre' });
        reset(f, i); sobro.push({ cuenta: f.k.id, importe: f.d, fecha: h, ts: ahora + i, mov: m.id }); return;
      }
      if (tipo === 'ing') {   // el ingreso ya está en el banco: cuenta como llegado (dentro de lo que has puesto) y lo demás es descuadre
        const it = X.ingresos.find(x => x.id === itId);
        if (it) { X.cambios[clave(it, fe)] = { importe: it.importe, llego: h, llegoEn: ahora - 5 }; resto(f, f.d - it.importe, i); }
        reset(f, i); return;
      }
      if (tipo === 'cob' || tipo === 'nocob') {   // gasto fijo cobrado antes de su día (o aún sin cobrar): la cuenta se corrige, lo que te queda no cambia
        const it = X.fijos.find(x => x.id === itId);
        if (it) {
          const k = clave(it, fe), c0 = X.cambios[k], imp = c0 && !c0.no ? c0.importe : it.importe;
          X.cambios[k] = Object.assign({}, c0 && !c0.no ? c0 : {}, { importe: imp }, tipo === 'cob' ? { llego: h, llegoEn: ahora - 5 } : { llego: masDias(h, 1), llegoEn: 0 });
          resto(f, tipo === 'cob' ? f.d + imp : f.d - imp, i);
        }
        reset(f, i); return;
      }
      if (tipo === 'repartir') {
        mov({ id: nuevoId(), tipo: 'gasto', importe: r2(-f.d), desc: 'Descuadre (repartido)', cat: 'Descuadre', cuenta: f.k.id, fecha: h, ts: ahora + i, origen: 'cuadre', repartirHasta: hastaDeN(h, f.n, X.periodo) });
        return;
      }
      // 🧾 Gastos sin apuntar / 💶 dinero que no habías apuntado: un ⚖️ Descuadre (hoy o la semana pasada)
      const fecha = fechaDif();
      const m = mov({ id: nuevoId(), tipo: f.d < 0 ? 'gasto' : 'ingreso', importe: Math.abs(f.d), desc: 'Descuadre', cat: 'Descuadre', cuenta: f.k.id, fecha, ts: ahora + i, origen: 'cuadre' });
      // Con fecha de la semana pasada: la cuenta se pone directamente en lo que dice el banco (así cuadra aunque su punto de partida sea posterior)
      if (fecha < h) reset(f, i);
      if (f.d > 0) sobro.push({ cuenta: f.k.id, importe: f.d, fecha: h, ts: ahora + i, mov: m.id });
    });
    // Lo que sobró al cuadrar: si luego dices que te ha llegado un ingreso, se pregunta si era esto (q02)
    if (sobro.length) X.sobroCuadre = (X.sobroCuadre || []).concat(sobro).slice(-5);
  }
  function guardarCuadre(ds, ns, tr) {
    const ahora = Date.now();
    aplicarCuadre(D, ds, tr, ahora);
    D.cuadreNoes = 0;
    ns.forEach(f => Object.assign(f.k, { saldo: r2(real(f)), saldoFecha: h, saldoEn: ahora + 50 }));
    if (ds.length || hayAlguno) { D.cuadrado = h; D.cuadres = (D.cuadres || []).concat([{ f: h, dif: r2(ds.reduce((t, f) => t + Math.abs(f.d), 0)) }]).slice(-5); }
    guardarDatos(); cerrarHoja();
    aviso(ds.length ? 'Cuentas cuadradas ✓' : tr && tr.length ? 'Traspaso apuntado ✓' : ns.length ? 'Guardado ✓' : 'Todo cuadra ✓'); pintarApp();
  }
}

// ⚖️ «¿Es el dinero que sobraba al cuadrar?» (28/10, q02: Álex cuadró con 2.488 € de más, y días después dijo que le había llegado el sueldo → contado dos veces)
// Se pregunta al decir que te ha llegado un ingreso, si hace poco (10 días) cuadraste esa cuenta y sobraba dinero.
function siEraLoQueSobraba(it, f, imp, seguir) {
  const h = hoyIso(), k = D.cuentas.find(x => x.id === it.cuenta);
  const s = (D.sobroCuadre || []).filter(x => x.cuenta === it.cuenta && !x.preguntado && x.importe > 0.004 && x.fecha >= masDias(h, -10) && x.importe >= imp * 0.5).slice(-1)[0];
  if (!s || !k) return seguir();
  abrirHoja(() => ({
    html: `<h2>⚖️ ¿Es el dinero que sobraba?</h2>
      <p class="ayuda">El ${fechaCorta(s.fecha)} cuadraste ${esc(k.nombre)} y sobraban <b>${eur(s.importe)}</b>. ¿Eran ${esc(it.nombre)} (${eur(imp)}), que ya te había llegado?</p>
      <div class="botones-hoja"><button class="boton" id="esSi">Sí, era eso</button><button class="boton contorno" id="esNo">No, es otro dinero</button><button class="boton sec" id="hCancelar">Cancelar</button></div>`,
    montar() {
      $('esSi').onclick = () => {
        // Lo que se apuntó al cuadrar baja (no se cuenta dos veces) y el ingreso cuenta como ya dentro de lo que cuadraste
        const m = s.mov && D.movimientos.find(x => x.id === s.mov), usa = r2(Math.min(s.importe, imp));
        if (m) { m.importe = r2(m.importe - usa); if (m.importe < 0.005) D.movimientos = D.movimientos.filter(x => x !== m); }
        s.importe = r2(s.importe - usa);
        const reseteada = (k.saldoEn || 0) >= s.ts;   // ¿la cuenta se puso en lo del banco al cuadrar?
        D.cambios[clave(it, f)] = reseteada ? { importe: imp, llego: k.saldoFecha, llegoEn: (k.saldoEn || 0) - 1 } : llegada(imp);
        guardarDatos(); cerrarHoja(); aviso('Hecho: no se cuenta dos veces ✓'); pintarApp();
      };
      $('esNo').onclick = () => { s.preguntado = true; cerrarHoja(); seguir(); };
    }
  }));
}

// ---------- 🤝 Deudas ----------
// D.deudas = [{ id, tipo: 'meDeben'|'debo', persona, importe, desc, fecha, cuenta, cat?, grupo?, ts, pagos: [{ id, importe, fecha, modo: 'dinero'|'sinDinero', cuenta?, mov?, ts }] }]
// Reglas del dinero (decididas por Carles el 21/10: «solo cuenta tu parte»):
// - Te deben: lo que adelantas sale de la cuenta («Deberías tener»), pero NO de lo que te queda para gastar.
//   Recibido → vuelve a la cuenta. Saldar sin dinero (te invita a algo) → lo que faltaba pasa a ser gasto tuyo (sin tocar la cuenta: ya salió).
// - Debes: no cambia nada hasta que pagas. Pagado → gasto normal. Saldar sin dinero → no cambia nada.
// - Dividir un pago: tu parte es un gasto normal; la de los demás, una deuda por persona.
const pagadoDe = x => r2(x.pagos.reduce((s, p) => s + p.importe, 0));
const faltaDe = x => r2(x.importe - pagadoDe(x));
const abierta = x => faltaDe(x) > 0.004;
const letraDe = n => (String(n || '?').trim().match(/\S/u) || ['?'])[0].toUpperCase();
const avatar = (n, debo) => `<div class="avatar ${debo ? 'debo' : ''}">${esc(letraDe(n))}</div>`;
function personasRecientes() {
  const v = [];
  D.deudas.slice().sort((a, b) => (b.ts || 0) - (a.ts || 0)).forEach(x => {
    const n = x.persona.trim();
    if (n && !v.some(y => y.toLowerCase() === n.toLowerCase())) v.push(n);
  });
  return v.slice(0, 10);
}
let verSaldadas = false;

// En Inicio: una línea solo si hay deudas pendientes. Al tocarla se abre la lista.
function lineaDeudas() {
  const ab = D.deudas.filter(abierta);
  if (!ab.length) return '';
  const tot = t => r2(ab.filter(x => x.tipo === t).reduce((s, x) => s + faltaDe(x), 0));
  const md = tot('meDeben'), db = tot('debo');
  return `<button class="tarjeta deu-linea" id="iDeudas"><span class="deu-ico">👥</span>
      <span class="deu-txt">${md ? `<span>Te deben <b class="pos">${eur(md)}</b></span>` : ''}${md && db ? '<i>·</i> ' : ''}${db ? `<span>Debes <b class="neg">${eur(db)}</b></span>` : ''}</span>
      <span class="deu-flecha">${FLECHA_DER}</span></button>`;
}
// Lista de deudas. Los pagos divididos entre varios salen en UNA fila que se despliega (con cada persona debajo).
// ✓ en cada fila: pregunta en la misma fila «¿Cómo te ha pagado?» (con dinero / sin dinero) y luego se puede deshacer.
let gruposAbiertos = new Set(), preguntaPago = null, preguntaCuenta = null;
function hojaDeudas() {
  preguntaPago = null; preguntaCuenta = null;
  abrirHoja(() => {
    const abiertas = D.deudas.filter(abierta).sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.ts || 0) - (b.ts || 0));
    const ultimo = x => x.pagos.length ? x.pagos[x.pagos.length - 1].ts : 0;
    const saldadas = D.deudas.filter(x => !abierta(x)).sort((a, b) => ultimo(b) - ultimo(a));
    const delGrupo = g => D.deudas.filter(x => x.grupo === g);
    const fila = (x, hija) => {
      const debo = x.tipo === 'debo', pag = pagadoDe(x), ab = abierta(x);
      const sub = hija ? [] : [x.desc || (debo ? 'Le debes' : 'Te debe')];
      if (pag > 0 && ab) sub.push(eur(pag) + ' de ' + eur(x.importe));   // ha pagado una parte
      else if (!hija) sub.push(fechaCorta(x.fecha));
      if (!ab) sub.push(x.pagos.some(p => p.modo === 'sinDinero') ? 'sin dinero' : debo ? 'pagada' : 'pagado');
      const preg = preguntaPago === x.id;
      return `<div class="res-fila deu ${ab ? '' : 'saldada'} ${hija ? 'hija' : ''}" data-id="${x.id}">${avatar(x.persona, debo)}
        <div class="txt"><b>${esc(x.persona)}</b>${sub.length ? `<span>${sub.map(esc).join(' · ')}</span>` : ''}</div>
        <div class="cant">${eur(ab ? faltaDe(x) : x.importe)}</div>
        ${ab ? `<button class="tick ${preg ? 'on' : ''}" data-tick="${x.id}" aria-label="${debo ? 'Ya le he pagado' : 'Ya me ha pagado'}">${preg ? '✕' : '✓'}</button>` : ''}</div>
        ${preg && preguntaCuenta === x.id ? `<div class="como-pago ${hija ? 'hija' : ''}"><span>${debo ? '¿Con qué le has pagado?' : '¿Dónde te ha llegado?'}</span>
          <div class="chips">${D.cuentas.map(k => `<button class="chip ${k.id === cuentaApp(debo ? D.ultimaCuenta : x.cuenta) ? 'sug' : ''}" data-cta="${k.id}" data-id="${x.id}">${k.emoji} ${esc(k.nombre)}</button>`).join('')}</div></div>`
        : preg ? `<div class="como-pago ${hija ? 'hija' : ''}"><span>${debo ? '¿Cómo le has pagado?' : '¿Cómo te ha pagado?'}</span>
          <div><button class="mini-b si" data-pago="dinero" data-id="${x.id}">${debo ? '💸' : '💶'} Con dinero</button><button class="mini-b" data-pago="sinDinero" data-id="${x.id}">🤝 Sin dinero</button></div></div>` : ''}`;
    };
    // Una fila por pago dividido (si tiene 2 o más personas); las demás, sueltas
    const bloque = tipo => {
      const l = abiertas.filter(x => x.tipo === tipo), hechos = new Set(), out = [];
      l.forEach(x => {
        if (x.grupo && delGrupo(x.grupo).length > 1) {
          if (hechos.has(x.grupo)) return; hechos.add(x.grupo);
          const todos = delGrupo(x.grupo), falta = r2(todos.filter(abierta).reduce((s, y) => s + faltaDe(y), 0));
          const pagados = todos.filter(y => !abierta(y)).length, open = gruposAbiertos.has(x.grupo);
          out.push(`<div class="res-fila deu grupo-fila" data-grupo="${x.grupo}"><div class="avatar grupo">${x.cat ? emojiCat(x.cat) : '👥'}</div>
            <div class="txt"><b>${esc(x.desc || 'Pago dividido')}</b><span>${fechaCorta(x.fecha)} · ${pagados ? `${pagados} de ${todos.length} pagados` : todos.length + ' personas'}</span></div>
            <div class="cant">${eur(falta)}</div><span class="desplegar ${open ? 'on' : ''}">${FLECHA_DER}</span></div>
            ${open ? `<div class="hijas">${todos.slice().sort((a, b) => abierta(b) - abierta(a) || (a.ts || 0) - (b.ts || 0)).map(y => fila(y, true)).join('')}</div>` : ''}`);
        } else out.push(fila(x));
      });
      return out.join('');
    };
    const seccion = (tipo, tit, cls) => {
      const l = abiertas.filter(x => x.tipo === tipo);
      return l.length ? `<div class="deu-grupo"><div class="deu-tit"><span>${tit}</span><b class="${cls}">${eur(l.reduce((s, x) => s + faltaDe(x), 0))}</b></div>${bloque(tipo)}</div>` : '';
    };
    return {
      html: `<h2>Deudas</h2>
        <p class="ayuda">Pulsa ✓ cuando te paguen (o cuando pagues tú). Toca una fila para ver más opciones.</p>
        <div class="tarjeta" id="hDeudas">${abiertas.length ? seccion('meDeben', 'Te deben', 'pos') + seccion('debo', 'Debes', 'neg')
          : '<div class="vacio" style="padding:8px 10px">Nadie te debe nada y tú no debes nada 👌</div>'}
          ${saldadas.length ? `<button class="deu-mas" id="hSaldadas">${verSaldadas ? 'Ocultar las saldadas' : 'Ver las saldadas (' + saldadas.length + ')'}</button>
            ${verSaldadas ? `<div class="deu-grupo">${saldadas.map(x => fila(x)).join('')}</div>` : ''}` : ''}</div>
        <div class="botones-hoja"><button class="boton contorno" id="hNuevaDeuda">＋ Apuntar otra</button><button class="boton sec" id="hCancelar">Cerrar</button></div>`,
      montar() {
        $('hNuevaDeuda').onclick = () => hojaNuevaDeuda({ volver: hojaDeudas });
        if ($('hSaldadas')) $('hSaldadas').onclick = () => { verSaldadas = !verSaldadas; pintarHoja(); };
        document.querySelectorAll('#hDeudas .grupo-fila').forEach(el => el.onclick = () => {
          const g = el.dataset.grupo; if (gruposAbiertos.has(g)) gruposAbiertos.delete(g); else gruposAbiertos.add(g); preguntaPago = null; pintarHoja();
        });
        document.querySelectorAll('#hDeudas .res-fila.deu[data-id]').forEach(el => el.onclick = () => {
          const x = D.deudas.find(d => d.id === el.dataset.id); if (x) hojaDeuda(x, hojaDeudas);
        });
        document.querySelectorAll('#hDeudas [data-tick]').forEach(b => b.onclick = e => {
          e.stopPropagation(); preguntaPago = preguntaPago === b.dataset.tick ? null : b.dataset.tick; preguntaCuenta = null; pintarHoja();
        });
        const pagar = (x, modo, cuenta) => {
          const falta = faltaDe(x), debo = x.tipo === 'debo';
          pagarDeuda(x, falta, modo, cuenta);
          const pago = x.pagos[x.pagos.length - 1];
          preguntaPago = null; preguntaCuenta = null; guardarDatos(); pintarApp(); pintarHoja();
          const cta = modo === 'dinero' && D.cuentas.length > 1 ? ' (' + nombreCta(pago.cuenta) + ')' : '';
          const t = modo === 'sinDinero' ? (debo ? 'Saldado con ' + x.persona : 'Saldado con ' + x.persona + ' · ' + eur(falta) + ' cuentan como gasto')
            : debo ? 'Le has pagado ' + eur(falta) + ' a ' + x.persona + cta : x.persona + ' te ha pagado ' + eur(falta) + cta;
          avisoDeshacer(t, () => { deshacerPago(x, pago); guardarDatos(); pintarApp(); if ($('hDeudas')) pintarHoja(); aviso('Deshecho'); });
        };
        document.querySelectorAll('#hDeudas [data-pago]').forEach(b => b.onclick = e => {
          e.stopPropagation();
          const x = D.deudas.find(d => d.id === b.dataset.id); if (!x || !abierta(x)) return;
          // Con dinero y varias cuentas: antes se elige la cuenta (como en Apuntar), para que «Deberías tener» cuadre
          if (b.dataset.pago === 'dinero' && D.cuentas.length > 1) { preguntaCuenta = x.id; return pintarHoja(); }
          pagar(x, b.dataset.pago, x.tipo === 'debo' ? D.ultimaCuenta : x.cuenta);
        });
        document.querySelectorAll('#hDeudas [data-cta]').forEach(b => b.onclick = e => {
          e.stopPropagation();
          const x = D.deudas.find(d => d.id === b.dataset.id); if (!x || !abierta(x)) return;
          pagar(x, 'dinero', b.dataset.cta);
        });
      }
    };
  });
}
// Aviso con botón «Deshacer» (5 segundos)
let tDeshacer = null;
function avisoDeshacer(t, fn) {
  let el = $('deshacer');
  if (!el) { el = document.createElement('div'); el.id = 'deshacer'; document.body.appendChild(el); }
  el.innerHTML = `<span>${esc(t)}</span><button>Deshacer</button>`;
  el.classList.add('ver');
  el.querySelector('button').onclick = () => { el.classList.remove('ver'); clearTimeout(tDeshacer); fn(); };
  clearTimeout(tDeshacer); tDeshacer = setTimeout(() => el.classList.remove('ver'), 5000);
}

// Apuntar una deuda. Primero: ¿qué ha pasado? (he pagado por más gente · alguien me debe · yo debo)
// pre (opcional): lo escrito en Apuntar (importe, desc, cat, cuenta, fecha), alGuardar() y volver() (para regresar a la lista)
function hojaNuevaDeuda(pre) {
  pre = pre || {};
  const h = hoyIso();
  const E = { paso: pre.desdeMov ? 'form' : 'elegir', tipo: 'meDeben', modo: pre.desdeMov ? 'dividir' : 'una', persona: '', importe: pre.importe || '', desc: pre.desc || '', cuenta: cuentaApp(pre.cuenta || D.ultimaCuenta),
    fecha: pre.fecha || '', verFecha: false, gente: [], nuevo: '', yo: true,
    cat: D.categorias.includes(pre.cat) ? pre.cat : D.categorias.includes('Comida') ? 'Comida' : D.categorias[0] };
  const OPCIONES = [
    ['dividir', '👥', 'He pagado por más gente', 'Una cena, un regalo… Se divide y cada uno te debe su parte'],
    ['meDeben', '🙋', 'Alguien me debe dinero', 'Le has prestado o le has pagado algo'],
    ['debo', '🫵', 'Yo debo dinero', 'Alguien ha pagado algo por ti']];
  const dividir = () => E.tipo === 'meDeben' && E.modo === 'dividir';
  // Lo que no has cambiado a mano se reparte a partes iguales. Tú vas el último: si sobra algún céntimo, es tuyo.
  function reparto() {
    const t = num(E.importe) > 0 ? r2(num(E.importe)) : 0;
    const manual = E.gente.filter(p => p.manual), auto = E.gente.filter(p => !p.manual);
    manual.forEach(p => { p.v = num(p.txt) > 0 ? r2(num(p.txt)) : 0; });
    const resto = r2(t - manual.reduce((s, p) => s + p.v, 0)), n = auto.length + (E.yo ? 1 : 0);
    auto.forEach((p, i) => { p.v = resto > 0 ? parteDe(resto, n, i) : 0; });
    const otros = r2(E.gente.reduce((s, p) => s + p.v, 0));
    return { t, otros, mia: r2(t - otros), n: E.gente.length + (E.yo ? 1 : 0) };
  }
  function textoReparto() {
    const r = reparto();
    if (!E.gente.length) return 'Añade a las personas que te tienen que pagar.';
    if (!r.t) return `Entre ${r.n} ${r.n === 1 ? 'persona' : 'personas'}${E.yo ? ' (contándote a ti)' : ''}. Pon cuánto has pagado.`;
    if (E.yo && r.mia < 0) return `<b class="neg">Las partes suman ${eur(r.otros)}, más que el total.</b>`;
    if (!E.yo && Math.abs(r.mia) > 0.004) return `<b class="neg">Las partes suman ${eur(r.otros)}: ${r.mia > 0 ? 'faltan' : 'sobran'} ${eur(Math.abs(r.mia))}.</b>`;
    return `Entre ${r.n} personas${E.yo ? ' (contándote a ti)' : ''}. ` + (E.yo ? `Tu parte: <b>${eur(r.mia)}</b>, cuenta como gasto. ` : '') + `Te deben <b>${eur(r.otros)}</b>.`;
  }
  // Cambia las cantidades y el resumen sin volver a pintar (así no se cierra el teclado)
  function refrescar() {
    reparto();
    document.querySelectorAll('.persona input').forEach(inp => { const p = E.gente[+inp.dataset.i]; if (!p.manual) inp.value = p.v ? fmtImporte(p.v) : ''; });
    if ($('dRes')) $('dRes').innerHTML = textoReparto();
  }
  const filaFecha = (min) => `<div class="fila" style="margin-top:12px"><span>📅 ${textoFecha(E.fecha)}</span><button class="enlace" id="dCambiarFecha">${E.verFecha ? 'Listo' : 'Cambiar'}</button></div>
      ${E.verFecha ? `<input id="dFecha" class="texto campo" type="date" ${min ? `min="${min}"` : ''} max="${h}" value="${E.fecha || h}">` : ''}`;
  const chipsCuenta = tit => D.cuentas.length > 1 ? `<div class="etq">${tit}</div><div class="chips" id="dCtas">${D.cuentas.map(k =>
    `<button class="chip ${E.cuenta === k.id ? 'on' : ''}" data-v="${k.id}">${k.emoji} ${esc(k.nombre)}</button>`).join('')}</div>` : '';

  abrirHoja(() => {
    if (E.paso === 'elegir') return {
      html: `<h2>¿Qué ha pasado?</h2>
        <div class="opciones" id="dOpciones" style="margin-top:14px">${OPCIONES.map(([v, ico, tit, sub]) => `<button class="opcion" data-v="${v}">
          <div class="ico">${ico}</div><div><b>${tit}</b><span class="sub">${sub}</span></div><span class="deu-flecha">${FLECHA_DER}</span></button>`).join('')}</div>
        ${!pre.volver && D.deudas.length ? '<button class="deu-mas" id="dVerTodas">Ver tus deudas</button>' : ''}
        <div class="botones-hoja"><button class="boton sec" id="dAtras">${pre.volver ? '‹ Volver' : 'Cancelar'}</button></div>`,
      montar() {
        document.querySelectorAll('#dOpciones .opcion').forEach(b => b.onclick = () => {
          const v = b.dataset.v;
          E.tipo = v === 'debo' ? 'debo' : 'meDeben'; E.modo = v === 'dividir' ? 'dividir' : 'una'; E.paso = 'form';
          pintarHoja();
          const foco = $(v === 'dividir' ? (num(E.importe) > 0 ? 'dNuevo' : 'dImp') : (num(E.importe) > 0 ? 'dPer' : 'dImp'));
          if (foco) setTimeout(() => foco.focus(), 50);
        });
        if ($('dVerTodas')) $('dVerTodas').onclick = hojaDeudas;
        $('dAtras').onclick = pre.volver || cerrarHoja;
      }
    };
    const meDeben = E.tipo === 'meDeben', div = dividir();
    const recientes = personasRecientes().filter(n => !E.gente.some(p => p.nombre.toLowerCase() === n.toLowerCase()));
    let cuerpo;
    if (!div) cuerpo = `<div class="tarjeta">
        <div class="etq" style="margin-top:0;text-align:center">${meDeben ? '¿Cuánto te debe?' : '¿Cuánto le debes?'}</div>
        <input id="dImp" class="importe" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0 €" value="${esc(E.importe)}">
        <input id="dPer" class="texto campo" type="text" maxlength="30" enterkeyhint="done" autocomplete="off" placeholder="¿Quién? (nombre)" value="${esc(E.persona)}">
        ${recientes.length ? `<div class="chips" id="uRecientes">${recientes.map(n => `<button class="chip ${n === E.persona ? 'on' : ''}" data-v="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : ''}
        <input id="dDesc" class="texto campo" type="text" maxlength="40" enterkeyhint="done" autocomplete="off" placeholder="¿De qué? (ej: entradas del concierto)" value="${esc(E.desc)}">
        ${meDeben ? chipsCuenta('¿De qué cuenta salió el dinero?') : ''}
        ${filaFecha('')}
      </div>
      <p class="nota" style="margin:10px 6px 0">${meDeben ? 'Sale de tu cuenta, pero no de lo que te queda para gastar: es dinero que te van a devolver.'
        : 'No cambia nada hasta que se lo pagues. Entonces contará como gasto.'}</p>`;
    else cuerpo = `<div class="tarjeta">
        <div class="etq" style="margin-top:0;text-align:center">¿Cuánto has pagado en total?</div>
        <input id="dImp" class="importe" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0 €" value="${esc(E.importe)}">
        <input id="dDesc" class="texto campo" type="text" maxlength="40" enterkeyhint="done" autocomplete="off" placeholder="¿Qué era? (ej: cena, regalo de Marta)" value="${esc(E.desc)}">
      </div>
      <div class="etq">¿Entre quién se divide?</div>
      <div class="tarjeta">
        <div class="fila yo-fila"><span>🙋 Yo también pongo mi parte</span><button class="interruptor ${E.yo ? 'on' : ''}" id="dYo" aria-label="Yo también pongo mi parte"></button></div>
        ${E.gente.map((p, i) => `<div class="saldo-fila persona"><span>${avatar(p.nombre)}<i>${esc(p.nombre)}</i></span>
          <input data-i="${i}" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0 €" value="${esc(p.manual ? p.txt : (p.v ? fmtImporte(p.v) : ''))}">
          <button class="quitar" data-i="${i}" aria-label="Quitar">✕</button></div>`).join('')}
        <div class="deu-anadir"><input id="dNuevo" class="texto campo" type="text" maxlength="30" enterkeyhint="done" autocomplete="off" placeholder="Nombre de alguien" value="${esc(E.nuevo)}">
          <button class="mini-b si" id="dAnadir">Añadir</button></div>
        ${recientes.length ? `<div class="chips" id="dRecientes">${recientes.map(n => `<button class="chip" data-v="${esc(n)}">＋ ${esc(n)}</button>`).join('')}</div>` : ''}
        <p class="nota" id="dRes">${textoReparto()}</p>
      </div>
      <div class="tarjeta" style="margin-top:12px">
        ${E.yo ? `<div class="etq" style="margin-top:0">Tu parte es un gasto de…</div><div class="chips" id="dCats">${D.categorias.map(k =>
          `<button class="chip ${E.cat === k ? 'on' : ''}" data-v="${esc(k)}">${emojiCat(k)} ${esc(k)}</button>`).join('')}</div>` : ''}
        ${chipsCuenta('¿Con qué has pagado?')}
        ${filaFecha(fechaMin())}
      </div>`;
    return {
      html: `<h2>${div ? '👥 He pagado por más gente' : meDeben ? '🙋 Alguien me debe' : '🫵 Yo debo'}</h2>
        <div style="margin-top:12px">${cuerpo}</div>
        ${pre.desdeMov ? '<p class="nota" style="margin:10px 6px 0">El gasto que ya tenías apuntado pasa a ser solo tu parte, y los demás quedan debiéndote la suya.</p>' : ''}
        <div class="botones-hoja"><button class="boton" id="hGuardar">${div ? 'Dividir' : 'Guardar'}</button><button class="boton sec" id="dAtras">${pre.desdeMov ? 'Cancelar' : '‹ Otra opción'}</button></div>`,
      montar() {
        $('hGuardar').onclick = guardarNueva;
        $('dAtras').onclick = () => { if (pre.desdeMov) return cerrarHoja(); E.paso = 'elegir'; pintarHoja(); };
        $('dImp').oninput = e => { E.importe = e.target.value; if (div) refrescar(); };
        $('dDesc').oninput = e => { E.desc = e.target.value; };
        if ($('dPer')) $('dPer').oninput = e => {
          E.persona = e.target.value;
          document.querySelectorAll('#uRecientes .chip').forEach(b => b.classList.toggle('on', b.dataset.v === E.persona.trim()));
        };
        document.querySelectorAll('#uRecientes .chip').forEach(b => b.onclick = () => {
          E.persona = b.dataset.v; $('dPer').value = E.persona;
          document.querySelectorAll('#uRecientes .chip').forEach(x => x.classList.toggle('on', x === b));
        });
        document.querySelectorAll('#dCtas .chip').forEach(b => b.onclick = () => { E.cuenta = b.dataset.v; pintarHoja(); });
        document.querySelectorAll('#dCats .chip').forEach(b => b.onclick = () => { E.cat = b.dataset.v; pintarHoja(); });
        $('dCambiarFecha').onclick = () => {
          E.verFecha = !E.verFecha; pintarHoja();
          if (E.verFecha) { const i = $('dFecha'); i.focus(); try { i.showPicker(); } catch (e) {} }
        };
        if ($('dFecha')) $('dFecha').onchange = $('dFecha').oninput = e => {
          const v = e.target.value, min = div ? fechaMin() : '';
          if (!v || v > h || (min && v < min)) return;
          E.fecha = v === h ? '' : v;
          $('dCambiarFecha').previousElementSibling.textContent = '📅 ' + textoFecha(E.fecha);
        };
        if (!div) return;
        $('dYo').onclick = () => { E.yo = !E.yo; reparto(); pintarHoja(); };
        const anadir = n => {
          n = String(n || '').trim();
          if (!n) return aviso('Escribe el nombre');
          if (E.gente.some(p => p.nombre.toLowerCase() === n.toLowerCase())) return aviso(n + ' ya está');
          E.gente.push({ nombre: n, txt: '', manual: false, v: 0 }); E.nuevo = ''; reparto(); pintarHoja();
        };
        $('dNuevo').oninput = e => { E.nuevo = e.target.value; };
        $('dAnadir').onclick = () => { anadir(E.nuevo); if ($('dNuevo')) $('dNuevo').focus(); };
        document.querySelectorAll('#dRecientes .chip').forEach(b => b.onclick = () => anadir(b.dataset.v));
        document.querySelectorAll('.persona input').forEach(inp => {
          inp.oninput = () => { const p = E.gente[+inp.dataset.i]; p.txt = inp.value; p.manual = inp.value.trim() !== ''; refrescar(); };
          inp.onfocus = () => inp.select();
        });
        document.querySelectorAll('.persona .quitar').forEach(b => b.onclick = () => { E.gente.splice(+b.dataset.i, 1); reparto(); pintarHoja(); });
      }
    };
  });
  function guardarNueva() {
    const ahora = Date.now(), fecha = E.fecha || h;
    if (!dividir()) {
      const imp = num(E.importe), persona = E.persona.trim();
      if (!(imp > 0)) { aviso('Escribe la cantidad'); return $('dImp').focus(); }
      if (!persona) { aviso('Escribe quién'); return $('dPer').focus(); }
      D.deudas.push({ id: nuevoId(), tipo: E.tipo, persona, importe: r2(imp), desc: E.desc.trim(), fecha, cuenta: cuentaApp(E.cuenta), ts: ahora, pagos: [] });
      if (E.tipo === 'meDeben') D.ultimaCuenta = cuentaApp(E.cuenta);
      return terminado(E.tipo === 'meDeben' ? persona + ' te debe ' + eur(imp) + ' ✓' : 'Le debes ' + eur(imp) + ' a ' + persona);
    }
    const r = reparto();
    if (!r.t) { aviso('Escribe cuánto has pagado'); return $('dImp').focus(); }
    if (E.nuevo.trim()) { aviso('Pulsa «Añadir» para añadir a ' + E.nuevo.trim()); return; }
    if (!E.gente.length) { aviso('Añade a quien te tiene que pagar'); return $('dNuevo').focus(); }
    if (E.gente.some(p => !(p.v > 0))) return aviso('A ' + E.gente.find(p => !(p.v > 0)).nombre + ' le toca 0 €: ponle una cantidad o quítalo');
    if (E.yo && r.mia < 0) return aviso('Las partes suman más que el total');
    if (!E.yo && Math.abs(r.mia) > 0.004) return aviso('Las partes no suman el total');
    const grupo = nuevoId(), cuenta = cuentaApp(E.cuenta), desc = E.desc.trim();
    const mov = pre.desdeMov && D.movimientos.find(m => m.id === pre.desdeMov);
    if (mov) {   // dividir un gasto ya apuntado: ese gasto pasa a ser tu parte (o se quita si no pones nada)
      if (E.yo && r.mia > 0) Object.assign(mov, { importe: r.mia, desc: desc || mov.desc, cat: E.cat, cuenta, fecha, reparto: grupo });
      else D.movimientos = D.movimientos.filter(m => m !== mov);
    } else if (E.yo && r.mia > 0) D.movimientos.push({ id: nuevoId(), tipo: 'gasto', importe: r.mia, desc: desc || E.cat, cat: E.cat, cuenta, fecha, ts: ahora, reparto: grupo });
    E.gente.forEach((p, i) => D.deudas.push({ id: nuevoId(), tipo: 'meDeben', persona: p.nombre, importe: p.v, desc: desc || 'Pago dividido', fecha, cuenta,
      cat: E.yo ? E.cat : undefined, grupo, ts: ahora + 1 + i, pagos: [] }));
    D.ultimaCuenta = cuenta;
    terminado(`Dividido ✓ Te deben ${eur(r.otros)}`);
  }
  function terminado(t) {
    guardarDatos();
    if (pre.alGuardar) pre.alGuardar();
    aviso(t); pintarApp();
    if (pre.volver) pre.volver(); else cerrarHoja();
  }
}

// Marcar como recibido / pagado (todo o una parte) o saldarla sin dinero
function pagarDeuda(x, imp, modo, cuenta) {
  const h = hoyIso(), ahora = Date.now(), debo = x.tipo === 'debo';
  const p = { id: nuevoId(), importe: r2(imp), fecha: h, modo, ts: ahora };
  if (modo === 'dinero') p.cuenta = cuentaApp(cuenta);
  const desc = x.desc ? ' · ' + x.desc : '';
  // Debes y pagas con dinero: gasto normal. Te debían y lo saldáis sin dinero: lo que faltaba pasa a ser gasto tuyo (no sale de la cuenta: ya salió).
  if (debo && modo === 'dinero') {
    const m = { id: nuevoId(), tipo: 'gasto', importe: p.importe, desc: 'Pagado a ' + x.persona + desc, cat: x.cat || 'Deudas', cuenta: p.cuenta, fecha: h, ts: ahora, deuda: x.id };
    D.movimientos.push(m); p.mov = m.id; D.ultimaCuenta = p.cuenta;
  } else if (!debo && modo === 'sinDinero') {
    const m = { id: nuevoId(), tipo: 'gasto', importe: p.importe, desc: 'Saldada con ' + x.persona + desc, cat: x.cat || 'Deudas', cuenta: cuentaApp(x.cuenta), fecha: h, ts: ahora, deuda: x.id, sinCuenta: true };
    D.movimientos.push(m); p.mov = m.id;
  }
  x.pagos.push(p);
}
function deshacerPago(x, p) {
  x.pagos = x.pagos.filter(y => y !== p);
  if (p.mov) D.movimientos = D.movimientos.filter(m => m.id !== p.mov);
}

function hojaDeuda(x, volver) {
  const debo = x.tipo === 'debo', mes = D.periodo === 'mes';
  const E = { paso: 'ver', cuenta: cuentaApp(debo ? D.ultimaCuenta : x.cuenta), otra: '', persona: x.persona, importe: fmtImporte(x.importe), desc: x.desc || '' };
  const listo = t => { guardarDatos(); aviso(t); pintarApp(); if (volver && D.deudas.length) volver(); else cerrarHoja(); };
  const chipsCuenta = () => D.cuentas.length > 1 ? `<div class="etq">${debo ? '¿Con qué pagas?' : '¿Dónde lo has recibido?'}</div><div class="chips" id="dCtas">${D.cuentas.map(k =>
    `<button class="chip ${E.cuenta === k.id ? 'on' : ''}" data-v="${k.id}">${k.emoji} ${esc(k.nombre)}</button>`).join('')}</div>` : '';
  const titulo = () => debo ? 'Le debes a ' + esc(x.persona) : esc(x.persona) + ' te debe';
  const modoTxt = p => p.modo === 'sinDinero' ? '🤝 Sin dinero' : debo ? '💸 Pagado' : '💶 Recibido';

  abrirHoja(() => {
    const falta = faltaDe(x), pag = pagadoDe(x), sub = [x.desc, fechaCorta(x.fecha) + (x.fecha.slice(0, 4) !== hoyIso().slice(0, 4) ? ' ' + x.fecha.slice(0, 4) : '')].filter(Boolean).map(esc).join(' · ');
    const historial = x.pagos.length ? `<div class="etq">Historial</div><div class="tarjeta historial">${x.pagos.map(p =>
      `<div class="res-fila"><div class="ico">${modoTxt(p).split(' ')[0]}</div><div class="txt"><b>${modoTxt(p).slice(modoTxt(p).indexOf(' ') + 1)}</b><span>${textoFecha(p.fecha)}${p.cuenta && D.cuentas.length > 1 ? ' · ' + esc(nombreCta(p.cuenta)) : ''}</span></div><div class="cant">${eur(p.importe)}</div></div>`).join('')}</div>` : '';

    if (E.paso === 'otra') return {
      html: `<h2>${debo ? '¿Cuánto le has pagado?' : '¿Cuánto te ha dado?'}</h2>
        <p class="ayuda">${debo ? 'Le debes' : 'Te debe'} ${eur(falta)}. Lo que falte seguirá pendiente.</p>
        <div class="tarjeta"><input id="dOtra" class="importe" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0 €" value="${esc(E.otra)}">${chipsCuenta()}</div>
        <div class="botones-hoja"><button class="boton" id="hGuardar">Guardar</button><button class="boton sec" id="dVolver">Volver</button></div>`,
      montar() {
        $('dOtra').oninput = e => { E.otra = e.target.value; };
        setTimeout(() => $('dOtra') && $('dOtra').focus(), 300);
        document.querySelectorAll('#dCtas .chip').forEach(b => b.onclick = () => { E.cuenta = b.dataset.v; pintarHoja(); });
        $('dVolver').onclick = () => { E.paso = 'ver'; pintarHoja(); };
        $('hGuardar').onclick = () => {
          const n = num(E.otra);
          if (!(n > 0)) return aviso('Escribe la cantidad');
          if (r2(n) > falta) return aviso('Solo ' + (debo ? 'le debes ' : 'te debe ') + eur(falta));
          pagarDeuda(x, n, 'dinero', E.cuenta);
          listo(abierta(x) ? (debo ? 'Pagado ' : 'Recibido ') + eur(n) + ' · faltan ' + eur(faltaDe(x)) : (debo ? 'Deuda pagada ✓' : 'Recibido todo ✓'));
        };
      }
    };

    if (E.paso === 'sinDinero') {
      const c = calcular(D), despues = r2(c.queda - falta);
      return {
        html: `<h2>¿Saldar sin dinero?</h2>
          <p class="ayuda">${debo ? `Si se lo has devuelto de otra forma (por ejemplo, invitándole a algo). La deuda queda saldada y no cambia lo que te queda para gastar.`
            : `Si ${esc(x.persona)} te ha invitado a algo o te lo ha devuelto de otra forma. Ese dinero ya no vuelve, así que los <b>${eur(falta)}</b> pasan a contar como gasto tuyo.`}</p>
          ${debo ? '' : `<div class="tarjeta cuadre-efecto"><span>Te queda ${mes ? 'este mes' : 'esta semana'}</span>
            <div><s>${eur(c.queda)}</s> → <b class="${despues < 0 ? 'neg' : ''}">${eur(despues)}</b></div></div>`}
          <div class="botones-hoja"><button class="boton" id="hGuardar">Saldar</button><button class="boton sec" id="dVolver">Volver</button></div>`,
        montar() {
          $('dVolver').onclick = () => { E.paso = 'ver'; pintarHoja(); };
          $('hGuardar').onclick = () => { pagarDeuda(x, falta, 'sinDinero'); listo('Deuda saldada 🤝'); };
        }
      };
    }

    if (E.paso === 'editar') return {
      html: `<h2>Cambiar deuda</h2>
        <div class="tarjeta" style="margin-top:12px">
          <input id="dImp" class="importe" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0 €" value="${esc(E.importe)}">
          <input id="dPer" class="texto campo" type="text" maxlength="30" enterkeyhint="done" autocomplete="off" placeholder="¿Quién?" value="${esc(E.persona)}">
          <input id="dDesc" class="texto campo" type="text" maxlength="40" enterkeyhint="done" autocomplete="off" placeholder="¿De qué?" value="${esc(E.desc)}">
        </div>
        ${pag > 0 ? `<p class="nota" style="margin:10px 6px 0">Ya ${debo ? 'has pagado' : 'te ha dado'} ${eur(pag)}: no puede ser menos que eso.</p>` : ''}
        <div class="botones-hoja"><button class="boton" id="hGuardar">Guardar cambios</button><button class="boton sec" id="dVolver">Volver</button></div>`,
      montar() {
        $('dImp').oninput = e => { E.importe = e.target.value; };
        $('dPer').oninput = e => { E.persona = e.target.value; };
        $('dDesc').oninput = e => { E.desc = e.target.value; };
        $('dVolver').onclick = () => { E.paso = 'ver'; pintarHoja(); };
        $('hGuardar').onclick = () => {
          const n = num(E.importe), per = E.persona.trim();
          if (!(n > 0)) return aviso('Escribe la cantidad');
          if (!per) return aviso('Escribe quién');
          if (r2(n) < pag) return aviso('No puede ser menos de ' + eur(pag));
          Object.assign(x, { importe: r2(n), persona: per, desc: E.desc.trim() });
          listo('Cambiado ✓');
        };
      }
    };

    // Ver
    const abiertaYa = falta > 0.004;
    return {
      html: `<h2 style="text-align:center">${titulo()}</h2>
        <div class="deu-grande ${abiertaYa ? (debo ? '' : 'pos') : ''}">${eur(abiertaYa ? falta : x.importe)}</div>
        <p class="deu-sub">${sub}${pag > 0 && abiertaYa ? '<br>' + (debo ? 'Ya has pagado ' : 'Ya te ha dado ') + eur(pag) + ' de ' + eur(x.importe) : ''}${!abiertaYa ? '<br><b class="pos">✓ Saldada</b>' : ''}</p>
        ${abiertaYa && D.cuentas.length > 1 ? `<div class="tarjeta">${chipsCuenta().replace('class="etq"', 'class="etq" style="margin-top:0"')}</div>` : ''}
        <div class="botones-hoja">
          ${abiertaYa ? `<button class="boton" id="dTodo">${debo ? '✓ Pagado' : '✓ Recibido'}${pag > 0 ? ' (' + eur(falta) + ')' : ''}</button>
            <button class="boton suave" id="dOtraB">Otra cantidad</button>
            <button class="boton suave" id="dSinDinero">🤝 Saldar sin dinero</button>` : ''}
        </div>
        ${historial}
        <div class="botones-hoja">
          ${!abiertaYa && x.pagos.length ? '<button class="boton suave" id="dDeshacer">Deshacer lo último</button>' : ''}
          ${abiertaYa ? '<button class="boton sec" id="dEditar">Cambiar</button>' : ''}
          <button class="boton rojo-txt" id="dBorrar">Borrar deuda</button>
          <button class="boton sec" id="${volver ? 'dVolverLista' : 'hCancelar'}">${volver ? '‹ Volver' : abiertaYa ? 'Cancelar' : 'Cerrar'}</button>
        </div>`,
      montar() {
        if ($('dVolverLista')) $('dVolverLista').onclick = volver;
        document.querySelectorAll('#dCtas .chip').forEach(b => b.onclick = () => { E.cuenta = b.dataset.v; pintarHoja(); });
        if ($('dTodo')) $('dTodo').onclick = () => { pagarDeuda(x, falta, 'dinero', E.cuenta); listo(debo ? 'Deuda pagada ✓' : 'Recibido ' + eur(falta) + ' ✓'); };
        if ($('dOtraB')) $('dOtraB').onclick = () => { E.paso = 'otra'; pintarHoja(); };
        if ($('dSinDinero')) $('dSinDinero').onclick = () => { E.paso = 'sinDinero'; pintarHoja(); };
        if ($('dEditar')) $('dEditar').onclick = () => { E.paso = 'editar'; pintarHoja(); };
        if ($('dDeshacer')) $('dDeshacer').onclick = () => { deshacerPago(x, x.pagos[x.pagos.length - 1]); listo('Deshecho: vuelve a estar pendiente'); };
        $('dBorrar').onclick = () => {
          if (!confirm('¿Borrar la deuda ' + (debo ? 'con ' : 'de ') + x.persona + ' (' + eur(x.importe) + ')?' + (x.pagos.some(p => p.mov) ? '\nTambién se borrará lo apuntado al pagarla.' : ''))) return;
          x.pagos.slice().forEach(p => deshacerPago(x, p));
          D.deudas = D.deudas.filter(d => d !== x);
          listo('Deuda borrada');
        };
      }
    };
  });
}

// ---------- 💾 Copia de seguridad ----------
// Los datos solo están en el móvil: la copia es un archivo .json con todo (D) que se guarda en Archivos o se envía.
// Al recuperarla se cambia todo por la copia (antes se guarda lo que había en 'presu_antes_de_recuperar', por si acaso).
const DIAS_AVISO_COPIA = 14;
const esMovil = () => /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
const diasDesde = f => Math.round((aUTC(hoyIso()) - aUTC(f)) / 864e5);
function textoUltimaCopia() {
  if (!D.ultimaCopia) return 'Aún no has hecho ninguna copia';
  const n = diasDesde(D.ultimaCopia);
  return 'Tu última copia es ' + (n <= 0 ? 'de hoy' : n === 1 ? 'de ayer' : 'de hace ' + n + ' días');
}
// ¿La copia es vieja? (ninguna, o de hace 2 semanas o más): en Ajustes sale en rojo
const copiaVieja = () => !D.ultimaCopia || diasDesde(D.ultimaCopia) >= DIAS_AVISO_COPIA;

// ---------- 📊 Exportar a Excel (CSV) ----------
// Todo lo que ha pasado desde que empezaste: lo que apuntaste + los gastos fijos + los ingresos fijos que te llegaron.
// Separado por «;» y con coma decimal, que es como lo abre Excel en España.
function textoExcel() {
  const h = hoyIso(), filas = [];
  const cta = id => nombreCta(cuentaApp(id)) || '';
  D.movimientos.forEach(m => {
    if (m.tipo === 'apartar') return;   // no es un movimiento de dinero (solo cambia lo que te queda)
    const tipo = m.tipo === 'traspaso' ? 'Traspaso' : m.tipo === 'ingreso' ? 'Ingreso' : 'Gasto';

function quitarDeHucha(x) {

// Deshacer «Usar el dinero» (al borrar su gasto): lo que sobró vuelve de donde se mandó y el objetivo sigue como antes
function reabrirObjetivo(o) {
  const f = o.final || {}, resto = f.resto || 0;
  if (resto > 0) {
    if (f.destino === 'hucha') quitarDeHucha(resto);
    else { const m = movDeObjetivo(o); if (m) D.movimientos.splice(D.movimientos.indexOf(m), 1); }
  }
  delete o.cerrado; delete o.cerradoEn; delete o.final; delete o.borrado;
}
const movDeObjetivo = o => D.movimientos.find(x => x.origen === 'objetivo' && x.tipo === 'ingreso' && x.fecha === o.cerradoEn && x.desc === 'De tu objetivo «' + o.nombre + '»');
// Arreglo (24/10, 21:10): objetivos cerrados con «Usar el dinero» cuyo gasto se borró después (la versión antigua no deshacía nada:
// el dinero desaparecía). Se toman como borrados ese día: lo de esa semana vuelve a esa semana y lo de antes, a la hucha.
function arreglarUsosHuerfanos() {
  if (D.arregloUsos) return;
  const P = D.periodo;
  (D.objetivos || []).forEach(o => {
    if (o.borrado || !o.cerradoEn || !o.final || !(o.final.gastado > 0)) return;
    if (D.movimientos.some(x => x.objetivo === o.id)) return;   // el gasto sigue ahí: está bien
    const sem = inicioPeriodo(o.cerradoEn, P);
    if (o.cerrado !== siguientePeriodo(sem, P)) return;
    const accIni = (calcular(D, hoyIso(), sem).objAccIni || {})[o.id];
    const v = aporteObjetivo(o, sem, P, accIni == null ? o.inicial || 0 : accIni);
    const deAntes = r2(Math.max(0, o.final.gastado - v));
    o.cerrado = sem; o.borrado = true;
    if (deAntes > 0) volverAHucha(deAntes, D.ultimaCuenta);
    o.final = Object.assign({}, o.final, { gastado: 0, resto: r2((o.final.resto || 0) + deAntes), destino: deAntes > 0 ? 'hucha' : o.final.destino, arreglo: 'usoBorrado' });
  });
  D.arregloUsos = true;
  guardarDatos();
}
// Arreglo (24/10): antes, al borrar un objetivo, lo de esa semana se seguía restando y se mandaba a la hucha (o a «para gastar»).
// Se corrige una sola vez en los objetivos ya borrados: esa semana deja de apartarse y se quita lo mismo de donde se mandó (el total no cambia).
function arreglarObjetivosBorrados() {
  if (D.arregloBorrados) return;
  const P = D.periodo;
  (D.objetivos || []).forEach(o => {
    if (!o.borrado || !o.cerradoEn || !o.final) return;
    const sem = inicioPeriodo(o.cerradoEn, P);
    if (o.cerrado !== siguientePeriodo(sem, P)) return;
    const accIni = (calcular(D, hoyIso(), sem).objAccIni || {})[o.id];
    const v = aporteObjetivo(o, sem, P, accIni == null ? o.inicial || 0 : accIni);
    o.cerrado = sem;
    if (!(v > 0) || !(o.final.resto >= v - 0.004)) return;
    o.final.resto = r2(o.final.resto - v);
    if (o.final.destino === 'hucha') {
      quitarDeHucha(v);
      // si la hucha solo existía por esto, desaparece
      const a = D.ahorro;
      if (a && a.modo === 'hucha' && Math.abs(a.importe) < 0.005 && !Object.keys(a.porCuenta || {}).length && !D.movimientos.some(x => x.hucha || x.destino === 'hucha')) D.ahorro = null;
    }
    else {
      const m = movDeObjetivo(o);
      if (m) { m.importe = r2(m.importe - v); if (!(m.importe > 0)) D.movimientos.splice(D.movimientos.indexOf(m), 1); }
    }
  });
  D.arregloBorrados = true;
  guardarDatos();
}
// Cerrar un objetivo (al usar el dinero o al borrarlo). Lo que sobra va a la hucha o pasa a ser para gastar este periodo.
// Deja de apartar desde el periodo que viene; lo de antes no cambia (por eso no se borra de verdad: queda como cerrado).
// Al BORRARLO, deja de apartar ya desde este periodo: lo de esta semana (o mes) vuelve a lo que te queda (arreglo del 24/10).
function cerrarObjetivo(o, gastado, desc, cuenta, destino, borrar) {
  const P = D.periodo, h = hoyIso(), act = inicioPeriodo(h, P), ahora = Date.now();
  const c = calcular(D), estaVez = borrar ? aporteEsta(o, c) : 0;
  const lleva = r2(infoObjetivo(o, c).lleva - estaVez), resto = r2(lleva - gastado);
  cuenta = cuentaApp(cuenta);
  if (gastado > 0) D.movimientos.push({ id: nuevoId(), tipo: 'gasto', importe: gastado, desc, cat: 'Objetivos', cuenta, fecha: h, ts: ahora, objetivo: o.id });
  if (resto > 0) {
    if (destino === 'hucha') volverAHucha(resto, cuenta);
    else D.movimientos.push({ id: nuevoId(), tipo: 'ingreso', importe: resto, desc: 'De tu objetivo «' + o.nombre + '»', cuenta, fecha: h, ts: ahora + 1, sinCuenta: true, origen: 'objetivo' });
  }
  Object.assign(o, { cerrado: borrar ? act : siguientePeriodo(act, P), cerradoEn: h, final: { gastado, resto: resto > 0 ? resto : 0, destino } });
  if (borrar) o.borrado = true;
  D.ultimaCuenta = cuenta;
  guardarDatos(); cerrarHoja();
  aviso(borrar ? 'Objetivo borrado' : '¡A disfrutarlo! 🎉'); pintarApp();
}

// Cambiar el día en que empieza «tu mes» (el día que cobras): se recalcula todo con el nuevo día
// Cambiar hasta cuándo te tiene que durar lo que tenías al empezar (si no cobras cada mes)
function hojaInicial() {
  const P = D.periodo, h = hoyIso(), act = inicioPeriodo(h, P), c = calcular(D), mes = P === 'mes';
  const rapidas = fechasRapidas();
  let f = D.inicialHasta > h ? D.inicialHasta : '', otra = f && !rapidas.some(([, x]) => x === f);
  // Lo que queda por repartir desde este periodo (incluido)
  const desdeAhora = r2((c.inicialQueda || 0) + (c.ini === act ? c.deInicio : 0));
  abrirHoja(() => {
    const n = f ? Math.max(1, contarPeriodos(act, inicioPeriodo(f, P), P)) : 0;
    return {
      html: `<h2>💳 ¿Hasta cuándo te tiene que durar?</h2>
        <p class="ayuda">Lo que tenías al empezar se reparte a partes iguales hasta esta fecha. Te quedan <b>${eur(desdeAhora)}</b> contando ${mes ? 'este mes' : 'esta semana'}.</p>
        <div class="tarjeta">
          <div class="chips" id="iRapidas">${rapidas.map(([t, x]) => `<button class="chip ${!otra && f === x ? 'on' : ''}" data-f="${x}">${t}</button>`).join('')}
            <button class="chip ${otra ? 'on' : ''}" data-f="otra">Otra fecha</button></div>
          ${otra ? `<input id="iFecha" class="texto campo" type="date" min="${masDias(h, 1)}" value="${f}" style="margin-top:12px">` : ''}
          ${f ? `<div class="nota" style="margin-top:12px">Desde ${mes ? 'este mes' : 'esta semana'}: unos <b>${eur(parteDe(desdeAhora, n, 0))}</b> ${mes ? 'al mes' : 'a la semana'} hasta el ${fechaCorta(f)} ${f.slice(0, 4)}. Lo de antes no cambia.</div>` : ''}
        </div>
        <div class="botones-hoja"><button class="boton" id="hGuardar">Guardar</button><button class="boton sec" id="hCancelar">Cancelar</button></div>`,
      montar() {
        $('iRapidas').querySelectorAll('.chip').forEach(b => b.onclick = () => {
          if (b.dataset.f === 'otra') { otra = true; f = ''; pintarHoja(); $('iFecha').focus(); return; }
          otra = false; f = b.dataset.f; pintarHoja();
        });
        if ($('iFecha')) $('iFecha').onchange = e => { if (e.target.value > h) { f = e.target.value; pintarHoja(); } };
        $('hGuardar').onclick = () => {
          if (!f) return aviso('Elige una fecha');
          if (f === D.inicialHasta) return cerrarHoja();
          // Lo de periodos anteriores se queda igual; lo que queda se reparte desde este periodo hasta la nueva fecha
          const primero = inicioPeriodo(D.creado, P);
          let tr = tramosInicial(D);
          if (!tr.length) tr = [{ desde: primero, ultimo: primero, n: 1, total: r2(D.inicial) }];   // regla antigua: todo en el primer periodo
          const ant = periodoAnterior(act, P);
          const antes = tr.filter(t => t.desde <= ant).map(t => Object.assign({}, t, { ultimo: t.ultimo > ant ? ant : t.ultimo }));
          const ultimo = inicioPeriodo(f, P);
          D.repartoInicial = antes.concat(desdeAhora > 0 ? [{ desde: act, ultimo, n: Math.max(1, contarPeriodos(act, ultimo, P)), total: desdeAhora }] : []);
          D.inicialHasta = f;
          guardarDatos(); cerrarHoja(); aviso('Ahora te dura hasta el ' + fechaCorta(f)); pintarApp();
        };

  });
}

// Al cambiar de semanas a meses (o el día que empieza tu mes), los ahorros repartidos se vuelven a repartir con los periodos nuevos.
// Se mira ANTES del cambio cuánto se ha repartido en total, y se devuelve una función que lo reparte DESPUÉS del cambio.
// - Ahorros para gastar: el total se vuelve a repartir hasta la misma fecha.
// - Si ya no son para gastar (los pasaste a la hucha o los quitaste): lo que ya se repartió se queda repartido en los mismos días.
function prepararReparto() {
  const P = D.periodo, t = tramosAhorro(D);
  if (!t.length) return () => {};
  const total = r2(t.reduce((s, x) => s + sumaTramo(x, P), 0));
  const finDia = finPeriodo(t.reduce((m, x) => x.ultimo > m ? x.ultimo : m, ''), P);
  return () => {
    if (D.ahorro && D.ahorro.modo === 'gastar') { D.ahorro.importe = total; delete D.repartoAhorro; return; }
    const desde = inicioPeriodo(D.creado, D.periodo), ultimo = inicioPeriodo(finDia, D.periodo);
    D.repartoAhorro = total > 0 && ultimo >= desde ? [{ desde, ultimo, n: contarPeriodos(desde, ultimo, D.periodo), total }] : [];
  };
}

// Objetivos al cambiar semanas ↔ meses: «para una fecha» se reparte otra vez hasta la misma fecha; «cada semana» pasa a su equivalente al mes (o al revés)
function prepararObjetivos(nuevoP) {
  const viejoP = D.periodo;
  return () => (D.objetivos || []).forEach(o => {
    if (o.cerrado) return;
    const desde = inicioPeriodo(o.creado || D.creado, D.periodo);
    if (o.modo === 'semanal' && nuevoP !== viejoP) o.cuota = r2(nuevoP === 'mes' ? o.cuota * 52 / 12 : o.cuota * 12 / 52);
    o.planes = [planObjetivo(o, desde, o.inicial || 0, D.periodo)];
  });
}
// Lo mismo con «lo que tenías al empezar» repartido hasta una fecha: lo que quede en total se vuelve a repartir hasta la misma fecha
function prepararInicial() {
  const P = D.periodo, t = tramosInicial(D);
  if (!t.length) return () => {};
  const total = r2(t.reduce((s, x) => s + sumaTramo(x, P), 0));
  const finDia = finPeriodo(t.reduce((m, x) => x.ultimo > m ? x.ultimo : m, ''), P);
  return () => {
    const desde = inicioPeriodo(D.creado, D.periodo), ultimo = inicioPeriodo(finDia, D.periodo);
    D.repartoInicial = total > 0 && ultimo >= desde ? [{ desde, ultimo, n: contarPeriodos(desde, ultimo, D.periodo), total }] : [];
  };
}
// «Para gastar»: lo que queda por repartir (contando este periodo) y hasta cuándo. Junta los ahorros para gastar y,
// si no cobras cada mes, lo que tenías al empezar (son lo mismo para ti: dinero que se reparte hasta una fecha).
function infoGastar(c) {
  const a = D.ahorro, ini = !!D.inicialHasta;
  const deIni = ini ? r2((c.inicialQueda || 0) + (c.deInicio || 0)) : 0;
  const deAho = r2((c.gastarQueda || 0) + (c.deAhorros || 0));
  let hasta = '';
  if (deIni > 0) hasta = D.inicialHasta;
  if (deAho > 0) { const f = D.gastarHasta || (a && a.modo === 'gastar' ? a.hasta : '') || finPeriodo(tramosAhorro(D).reduce((m, x) => x.ultimo > m ? x.ultimo : m, ''), D.periodo); if (f > hasta) hasta = f; }
  return { queda: r2(deIni + deAho), hasta };
}
const fechaLarga = f => fechaCorta(f) + (f.slice(0, 4) !== hoyIso().slice(0, 4) ? ' de ' + f.slice(0, 4) : '');
// Pasar de semanas a meses (o al revés): se recalcula todo con el nuevo periodo
function cambiarPeriodo(v) {
  if (!confirm(v === 'mes' ? '¿Ver tu dinero por meses? Se recalcula todo por meses.' : '¿Ver tu dinero por semanas? Se recalcula todo por semanas (lo mensual se reparte entre las semanas).')) return pintarApp();
  const rehacer = prepararReparto();
  const rehacerIni = prepararInicial(), rehacerObj = prepararObjetivos(v);
  D.periodo = v; movIni = null; rehacer(); rehacerIni(); rehacerObj(); guardarDatos();
  aviso(v === 'mes' ? 'Ahora lo ves por meses' : 'Ahora lo ves por semanas'); pintarApp();
}

// Guardar un ingreso o gasto fijo: si cambia algo que afecta a las cuentas, la versión vieja acaba ayer y la nueva empieza hoy
function guardarItem(lista, orig, nuevo) {
  const h = hoyIso();
  if (!orig) { lista.push(Object.assign({ id: nuevoId(), desde: h }, nuevo)); return; }
  const cambia = ['importe', 'frec', 'dia', 'cuenta', 'mes'].some(k => orig[k] !== nuevo[k]);
  if (!cambia || orig.desde === h) { Object.assign(orig, nuevo); if (!esAnual(orig)) delete orig.mes; return; }
  const nueva = Object.assign({}, orig, nuevo, { id: nuevoId(), desde: h, serie: orig.serie || orig.id });
  delete nueva.hasta;
  if (!esAnual(nueva)) delete nueva.mes;
  orig.hasta = masDias(h, -1); orig.nombre = nuevo.nombre;
  // Lo ya contestado para hoy o más adelante pasa a la versión nueva
  Object.keys(D.cambios).forEach(k => { const [id, f] = k.split('|'); if (id === orig.id && f >= h) { D.cambios[nueva.id + '|' + f] = D.cambios[k]; delete D.cambios[k]; } });
  lista.splice(lista.indexOf(orig) + 1, 0, nueva);
}
function quitarItem(lista, orig) {
  const h = hoyIso();
  Object.keys(D.cambios).forEach(k => { const [id, f] = k.split('|'); if (id === orig.id && f >= h) delete D.cambios[k]; });
  if (orig.desde === h) lista.splice(lista.indexOf(orig), 1);   // creado hoy: se quita del todo
  else orig.hasta = masDias(h, -1);                              // lo de antes se queda como estaba
}

function hojaItem(tipo, orig) {
  const ing = tipo === 'ingreso', lista = ing ? D.ingresos : D.fijos;
  const mesSig = (+hoyIso().slice(5, 7) % 12) + 1;
  const E = orig ? { nombre: orig.nombre, importe: fmtImporte(orig.importe), frec: orig.frec, dia: orig.dia || 1, mes: orig.mes || mesSig, cuenta: cuentaApp(orig.cuenta) }
    : { nombre: '', importe: '', frec: 'mes', dia: 1, mes: mesSig, cuenta: cuentaApp(D.ultimaCuenta) };
  // 🗓️ Cada año: cuánto se aparta hasta el próximo pago y después (para que se vea antes de guardarlo)
  const notaAnual = () => {
    const n = num(E.importe), P = D.periodo, mes = P === 'mes', h = hoyIso();
    if (!(n > 0)) return 'Cada ' + (mes ? 'mes' : 'semana') + ' se aparta un poco y, el día que lo pagas, sale de lo apartado (no de lo que te queda).';
    const it = { frec: 'año', dia: E.dia, mes: E.mes }, [f1, f2] = fechasDe(it, h, masDias(h, 800));
    const n1 = contarPeriodos(inicioPeriodo(h, P), inicioPeriodo(f1, P), P), n2 = contarPeriodos(siguientePeriodo(inicioPeriodo(f1, P), P), inicioPeriodo(f2, P), P);
    const u = mes ? ' al mes' : ' a la semana';
    // Ya existía: lo que lleva apartado se queda y, si cambias algo, desde hoy se aparta lo que falte
    const px = orig && esAnual(orig) ? (calcular(D).proximosAnual || []).find(x => (x.it.serie || x.it.id) === (orig.serie || orig.id)) : null;
    if (px) return `Llevas <b>${eur(px.apartado)}</b> apartados para el ${fechaLarga(px.fecha)}. Si cambias algo, se queda y desde hoy se aparta lo que falte. `
      + `Ese día sale de lo apartado, no de lo que te queda.`;
    return `Hasta el ${fechaLarga(f1)} apartas unos <b>${eur(n / n1)}</b>${u}. Después, unos <b>${eur(n / n2)}</b>${u}. Ese día sale de lo apartado, no de lo que te queda.`;
  };
  abrirHoja(() => ({
    html: `<h2>${orig ? orig.emoji + ' ' + esc(orig.nombre) : ing ? '✨ Nuevo ingreso' : '📌 Nuevo gasto fijo'}</h2>
      <p class="ayuda">${orig ? 'Si cambias la cantidad, el día o la cuenta, cuenta desde hoy. Lo de antes no cambia.' : E.frec === 'año' ? 'Se apartará un poco cada ' + (D.periodo === 'mes' ? 'mes' : 'semana') + ', desde hoy.' : 'Se ' + (ing ? 'sumará' : 'restará') + ' solo cada vez que toque, desde hoy.'}</p>
      <div class="tarjeta">
        <input id="iNom" class="texto campo" type="text" maxlength="30" placeholder="${ing ? 'Nombre (ej: beca)' : 'Nombre (ej: gimnasio)'}" value="${esc(E.nombre)}">
        <input id="iImp" class="importe" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0 €" value="${esc(E.importe)}" style="margin-top:8px">
        <div class="etq">¿Cada cuánto?</div>
        ${seg('iFrec', [['semana', 'Cada semana'], ['mes', 'Cada mes'], ...(ing ? [] : [['año', 'Cada año']])], E.frec).replace('class="seg"', ing ? 'class="seg"' : 'class="seg tres"')}
        ${E.frec === 'año'
          ? `<div class="etq">¿Cuándo lo pagas?</div>
             <div class="paso-dia"><span>Mes</span><div class="ctrl"><button id="mMenos" aria-label="Mes anterior">−</button><b id="mMes" style="min-width:96px">${MESES_L[E.mes - 1]}</b><button id="mMas" aria-label="Mes siguiente">+</button></div></div>
             <div class="paso-dia" style="margin-top:8px"><span>Día</span><div class="ctrl"><button id="dMenos" aria-label="Un día menos">−</button><b id="dDia">${E.dia}</b><button id="dMas" aria-label="Un día más">+</button></div></div>
             <p class="nota" id="iNotaAnual">${notaAnual()}</p>`
          : E.frec === 'semana'
          ? `<div class="etq">¿Qué día?</div><div class="dias" id="iDias">${DIAS_SEM.map((d, k) => `<button data-v="${k + 1}" class="${E.dia === k + 1 ? 'on' : ''}">${d}</button>`).join('')}</div>`
          : `<div class="etq">¿Qué día del mes?</div><div class="paso-dia"><span>Día</span><div class="ctrl"><button id="dMenos" aria-label="Un día menos">−</button><b id="dDia">${E.dia}</b><button id="dMas" aria-label="Un día más">+</button></div></div>
             <div class="nota">Si el mes es más corto, cuenta el último día.</div>`}
        ${D.cuentas.length > 1 ? `<div class="etq">${ing ? '¿Dónde te llega?' : '¿Desde qué cuenta lo pagas?'}</div><div class="chips" id="iCtas">${D.cuentas.map(k =>
          `<button class="chip ${E.cuenta === k.id ? 'on' : ''}" data-v="${k.id}">${k.emoji} ${esc(k.nombre)}</button>`).join('')}</div>` : ''}
      </div>
      <div class="botones-hoja">
        <button class="boton" id="hGuardar">${orig ? 'Guardar cambios' : 'Añadir'}</button>
        ${orig ? `<button class="boton rojo-txt" id="hQuitar">${ing ? 'Ya no lo recibo' : 'Ya no lo pago'}</button>` : ''}
        <button class="boton sec" id="hCancelar">Cancelar</button>
      </div>`,
    montar() {
      $('iNom').oninput = e => { E.nombre = e.target.value; };
      const refAnual = () => { if ($('iNotaAnual')) $('iNotaAnual').innerHTML = notaAnual(); };
      $('iImp').oninput = e => { E.importe = e.target.value; refAnual(); };
      segmento('iFrec', v => { if (v !== E.frec) { E.frec = v; E.dia = 1; pintarHoja(); } });
      if ($('mMas')) { const mm = n => { E.mes = ((E.mes - 1 + n + 12) % 12) + 1; $('mMes').textContent = MESES_L[E.mes - 1]; refAnual(); }; $('mMas').onclick = () => mm(1); $('mMenos').onclick = () => mm(-1); }
      document.querySelectorAll('#iDias button').forEach(b => b.onclick = () => { E.dia = +b.dataset.v; pintarHoja(); });
      if ($('dMas')) { const mover = n => { E.dia = ((E.dia - 1 + n + 31) % 31) + 1; $('dDia').textContent = E.dia; refAnual(); }; $('dMas').onclick = () => mover(1); $('dMenos').onclick = () => mover(-1); }
      document.querySelectorAll('#iCtas .chip').forEach(b => b.onclick = () => { E.cuenta = b.dataset.v; pintarHoja(); });
      if (!orig) setTimeout(() => $('iNom') && $('iNom').focus(), 300);
      $('hGuardar').onclick = () => {
        const n = num(E.importe);
        if (!E.nombre.trim()) return aviso('Ponle un nombre');
        if (!(n > 0)) return aviso('Escribe la cantidad');
        const nuevo = { nombre: E.nombre.trim(), importe: r2(n), frec: E.frec, dia: E.dia, cuenta: E.cuenta };
        if (E.frec === 'año') nuevo.mes = E.mes;
        if (!orig) Object.assign(nuevo, ing ? { tipo: 'otro', emoji: '✨' } : { emoji: '📌' });
        guardarItem(lista, orig, nuevo);
        guardarDatos(); cerrarHoja(); aviso(orig ? 'Guardado ✓' : 'Añadido ✓'); pintarApp();
      };
      if ($('hQuitar')) $('hQuitar').onclick = () => {
        if (!confirm('¿Quitar «' + orig.nombre + '»? Lo de antes se queda como estaba.')) return;
        quitarItem(lista, orig); guardarDatos(); cerrarHoja(); aviso('Quitado'); pintarApp();
      };
    }
  }));
}

// «Para gastar» a partir de lo que hay en el banco (decidido por Carles el 22/10):
//   para repartir desde el periodo que viene = banco − hucha − lo ahorrado − lo que te queda este periodo − lo que ya tiene destino
// «Lo que ya tiene destino»: lo de tu sueldo (u otro ingreso mensual) que ya está repartido entre las próximas semanas de este mes,
// los gastos fijos ya contados que aún no se han cobrado (siguen en el banco), los ingresos ya contados que aún no han llegado
// (no están en el banco) y lo que te deben tus amigos (no está en el banco, pero volverá).
function calculoParaGastar(totalBanco, hucha) {
  const P = D.periodo, h = hoyIso(), act = inicioPeriodo(h, P), c = calcular(D), semanas = P === 'semana';
  const conMes = [...D.ingresos, ...D.fijos].some(x => x.frec === 'mes');
  const repartoIni = tramosInicial(D).length > 0;
  // Semanas que vienen y van con el mismo mes de cobro que esta (su parte del sueldo ya está en el banco)
  let comp = 0, ultimaP = act, finMes = finPeriodo(act, P);
  if (semanas && conMes) {
    const cy = cicloDeSemana(D, act); finMes = finCiclo(cy);
    for (let p = siguientePeriodo(act, P); cicloDeSemana(D, p) === cy; p = siguientePeriodo(p, P)) {
      const r = calcular(D, h, p);
      comp += r.entra - r.fijos + (repartoIni ? 0 : r.deInicio);   // (lo que tenías al empezar, si va «hasta que cobres»)
      ultimaP = p;
    }
  }
  const H = finPeriodo(ultimaP, P);   // lo semanal, hasta el final de la última semana de este mes; lo mensual, hasta el final del mes de cobro
  const val = (it, f) => { const x = D.cambios[clave(it, f)]; return x ? (x.no ? 0 : x.importe) : it.importe; };
  const futuro = lista => lista.reduce((s, it) => s + fechasDe(it, masDias(h, 1), it.frec === 'mes' ? finMes : H).reduce((a, f) => a + val(it, f), 0), 0);
  const ingFut = futuro(D.ingresos), fijFut = futuro(D.fijos.filter(x => !esAnual(x)));
  const meDeben = (D.deudas || []).filter(x => x.tipo === 'meDeben' && abierta(x)).reduce((s, x) => s + faltaDe(x), 0);
  // (+ lo que queda por repartir de un ingreso extra que elegiste repartir hasta una fecha: ya tiene su reparto)
  // (+ lo apartado para lo de cada año, que sigue en el banco hasta que lo pagas; − lo que queda por restar de un gasto repartido, que ya salió)
  const destino = r2(comp - ingFut + fijFut - meDeben + (c.repartosQueda || 0) + (c.apartadoAnual || 0) - (c.gastosRepQueda || 0));   // positivo: dinero del banco que ya tiene destino
  const ahorrado = r2(c.ahorrado || 0), queda = r2(c.queda), objetivos = r2(c.objetivosAhorrado || 0);
  return { pool: r2(totalBanco - hucha - ahorrado - objetivos - queda - destino), ahorrado, objetivos, queda, destino, c, act };
}

// Ahorros: pones lo que tienes en el banco y lo que quieres guardar en la hucha; lo que se puede gastar sale solo.
// Este periodo sigue igual; lo demás se reparte desde el que viene hasta la fecha que elijas.
function hojaAhorro() {
  const P = D.periodo, h = hoyIso(), act = inicioPeriodo(h, P), c = calcular(D), a = D.ahorro, mes = P === 'mes';
  const rapidas = fechasRapidas(), ig0 = infoGastar(c), sig = siguientePeriodo(act, P);
  const esteP = mes ? 'este mes' : 'esta semana', queVieneP = mes ? 'el mes que viene' : 'la semana que viene';
  const E = { banco: {}, hucha: {}, hasta: ig0.hasta && ig0.hasta > h ? ig0.hasta : '', otra: false };
  D.cuentas.forEach(k => { const s = saldoCuenta(k); if (s !== null) E.banco[k.id] = txtSaldo(s); const hu = huchaEnCuenta(k.id, c); if (hu) E.hucha[k.id] = txtSaldo(hu); });
  E.otra = !!E.hasta && !rapidas.some(([, f]) => f === E.hasta);
  const n0 = t => { const n = num(t); return isFinite(n) ? n : 0; };
  const totalBanco = () => r2(D.cuentas.reduce((s, k) => s + n0(E.banco[k.id]), 0));
  const totalHucha = () => r2(D.cuentas.reduce((s, k) => s + Math.max(0, n0(E.hucha[k.id])), 0));
  const faltaBanco = () => D.cuentas.find(k => !String(E.banco[k.id] ?? '').trim() || isNaN(num(E.banco[k.id])));
  const fila = (t, v, cls) => `<div class="linea"><span>${t}</span><b class="${cls || ''}">${v}</b></div>`;
  function cuentas() {
    if (faltaBanco()) return `<p class="nota" style="margin:0">Pon lo que tienes en ${D.cuentas.length > 1 ? 'cada cuenta' : 'tu cuenta'} y te digo cuánto puedes gastar.</p>`;
    const r = calculoParaGastar(totalBanco(), totalHucha());
    let html = fila('En el banco', eur(totalBanco())) + (totalHucha() ? fila('🐷 Hucha', '−' + eur(totalHucha())) : '')
      + (r.ahorrado ? fila('💰 Lo que has ahorrado', '−' + eur(r.ahorrado)) : '')
      + (r.objetivos ? fila('🎯 Tus objetivos', '−' + eur(r.objetivos)) : '')
      + fila('Lo que te queda ' + esteP, (r.queda < 0 ? '+' : '−') + eur(Math.abs(r.queda)))
      + (r.destino >= 0.005 ? fila('Ya tiene destino <small>(lo de tu sueldo para las próximas semanas, gastos fijos sin cobrar…)</small>', '−' + eur(r.destino))
        : r.destino <= -0.005 ? fila('Te va a llegar <small>(lo que te deben, ingresos de ' + esteP + ' que aún no tienes…)</small>', '+' + eur(-r.destino)) : '')
      + `<div class="linea total"><span>💸 Para gastar desde ${queVieneP}</span><b class="${r.pool < 0 ? 'neg' : 'pos'}">${eur(r.pool)}</b></div>`;
    if (r.pool < 0) html += `<p class="nota" style="margin:8px 0 0">Tienes ${eur(-r.pool)} menos de lo que Pre$u cree. Revisa lo que has puesto; si está bien, al guardar se restará de lo que te queda ${esteP}.</p>`;
    else if (r.pool > 0 && E.hasta > h) {
      const n = Math.max(1, contarPeriodos(sig, inicioPeriodo(E.hasta < sig ? sig : E.hasta, P), P));
      html += `<p class="nota" style="margin:8px 0 0">Unos <b>${eur(parteDe(r.pool, n, 0))}</b> ${mes ? 'al mes' : 'a la semana'} hasta el ${fechaLarga(E.hasta)}, además de lo que te entre.</p>`;
    } else if (r.pool > 0) html += `<p class="nota" style="margin:8px 0 0">Elige hasta cuándo te tiene que durar.</p>`;
    return html;
  }
  const filasCta = (cls, vals) => D.cuentas.map(k => `<div class="saldo-fila"><span>${k.emoji} ${esc(k.nombre)}</span>
      <input class="${cls}" data-id="${k.id}" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0 €" value="${esc(vals[k.id] ?? '')}"></div>`).join('');
  abrirHoja(() => ({
    html: `<h2>Tus ahorros</h2>
      <p class="ayuda">Pon lo que tienes en el banco y lo que quieres guardar. Lo que puedes gastar sale solo. ${mayus(esteP)} sigue igual.</p>
      <div class="etq">💳 ¿Cuánto tienes ahora en el banco?</div>
      <div class="tarjeta">${filasCta('bk-imp', E.banco)}<p class="nota" style="margin:8px 2px 0">Lo que dice la app de tu banco, con la hucha incluida.</p></div>
      <div class="etq">🐷 Hucha · no se toca</div>
      <div class="tarjeta">${filasCta('hu-imp', E.hucha)}<p class="nota" style="margin:8px 2px 0">Lo que quieres guardar y no gastar. Si hay un imprevisto, al apuntar un gasto podrás pagar con la hucha.</p></div>
      <div class="etq">💸 Para gastar</div>
      <div class="tarjeta"><div id="ahCalc">${cuentas()}</div>
        <div class="etq" style="margin-top:14px">¿Hasta cuándo te tiene que durar?</div>
        <div class="chips" id="aRap">${rapidas.map(([t, f]) => `<button class="chip ${!E.otra && E.hasta === f ? 'on' : ''}" data-f="${f}">${t}</button>`).join('')}
          <button class="chip ${E.otra ? 'on' : ''}" data-f="otra">Otra fecha</button></div>
        ${E.otra ? `<input id="aHasta" class="texto campo" type="date" min="${masDias(h, 1)}" value="${E.hasta}" style="margin-top:10px">` : ''}
      </div>
      ${c.pendientes.length ? `<p class="nota" style="margin:10px 6px 0">⚠️ Antes contesta en Inicio «¿Te ha llegado…?»: si ya te llegó y está en el banco, se contaría dos veces.</p>` : ''}
      <div class="botones-hoja"><button class="boton" id="hGuardar">Guardar</button><button class="boton sec" id="hCancelar">Cancelar</button></div>`,
    montar() {
      const recalc = () => { $('ahCalc').innerHTML = cuentas(); };
      document.querySelectorAll('.bk-imp').forEach(i => { i.oninput = () => { E.banco[i.dataset.id] = i.value; recalc(); }; i.onfocus = () => i.select(); });
      document.querySelectorAll('.hu-imp').forEach(i => { i.oninput = () => { E.hucha[i.dataset.id] = i.value; recalc(); }; i.onfocus = () => i.select(); });
      $('aRap').querySelectorAll('.chip').forEach(b => b.onclick = () => {
        if (b.dataset.f === 'otra') { E.otra = true; pintarHoja(); if ($('aHasta')) $('aHasta').focus(); return; }
        E.otra = false; E.hasta = b.dataset.f; pintarHoja();
      });
      if ($('aHasta')) $('aHasta').onchange = e => { E.hasta = e.target.value; recalc(); };
      $('hGuardar').onclick = () => {
        const f = faltaBanco();
        if (f) return aviso('Pon lo que tienes en ' + f.nombre + ' (aunque sea 0)');
        const malH = D.cuentas.find(k => String(E.hucha[k.id] ?? '').trim() && isNaN(num(E.hucha[k.id])));
        if (malH) return aviso('Revisa la hucha de ' + malH.nombre);
        const pasa = D.cuentas.find(k => n0(E.hucha[k.id]) > n0(E.banco[k.id]) + 0.004);
        if (pasa) return aviso('En ' + pasa.nombre + ' la hucha es más de lo que tienes');
        const r = calculoParaGastar(totalBanco(), totalHucha()), pool = r.pool;
        if (pool > 0 && !(E.hasta > h)) return aviso('Elige hasta cuándo te tiene que durar');
        const ahora = Date.now();
        // 1) Para gastar: este periodo se queda igual; lo de antes también. Lo nuevo empieza el periodo que viene.
        const cortar = tr => tr.filter(t => t.desde <= act).map(t => Object.assign({}, t, { ultimo: t.ultimo > act ? act : t.ultimo }));
        const trAho = tramosAhorro(D), trIni = tramosInicial(D);
        const ultimo = pool > 0 ? inicioPeriodo(E.hasta < sig ? sig : E.hasta, P) : '';
        const nuevo = pool > 0 ? [{ desde: sig, ultimo, n: Math.max(1, contarPeriodos(sig, ultimo, P)), total: pool }] : [];
        if (D.inicialHasta) {
          D.repartoInicial = cortar(trIni).concat(nuevo);
          if (pool > 0) D.inicialHasta = E.hasta;
          D.repartoAhorro = cortar(trAho); delete D.gastarHasta;
        } else {
          D.repartoAhorro = cortar(trAho).concat(nuevo);
          if (pool > 0) D.gastarHasta = E.hasta; else delete D.gastarHasta;
        }
        // Si hay menos dinero del que Pre$u creía: se resta de lo que te queda este periodo
        if (pool < 0) D.movimientos.push({ id: nuevoId(), tipo: 'gasto', importe: r2(-pool), desc: 'Descuadre', cat: 'Descuadre', cuenta: cuentaApp(D.ultimaCuenta), fecha: h, ts: ahora, origen: 'cuadre' });
        // 2) Hucha (por cuenta)
        const hu = totalHucha();
        if (hu > 0) {
          const usado = D.movimientos.filter(m => m.hucha).reduce((s, m) => s + m.importe, 0), porCuenta = {};
          D.cuentas.forEach(k => { const v = n0(E.hucha[k.id]); if (v > 0) porCuenta[k.id] = r2(v); });
          D.ahorro = { importe: r2(hu + usado), modo: 'hucha', hasta: '', cuenta: cuentaMayor(porCuenta, cuentaApp(a && a.cuenta)), porCuenta };
        } else D.ahorro = null;
        // Los ingresos extra que mandaste a la hucha ya están en lo que acabas de poner (hucha o para gastar): no se suman otra vez
        D.movimientos.forEach(x => { if (conDestino(x) && x.destino === 'hucha') x.destino = 'banco'; });
        // 3) Lo que hay en el banco pasa a ser «Deberías tener»
        D.cuentas.forEach((k, i) => Object.assign(k, { saldo: r2(n0(E.banco[k.id])), saldoFecha: h, saldoEn: ahora + 50 + i }));
        D.cuadrado = h; D.cuadreNoes = 0;
        guardarDatos(); cerrarHoja(); aviso('Guardado ✓'); pintarApp();
      };
    }
  }));
}

function hojaCuenta(k) {
  let nombre = k ? k.nombre : '';
  abrirHoja(() => ({
    html: `<h2>${k ? k.emoji + ' ' + esc(k.nombre) : '🏦 Nueva cuenta'}</h2>
      <p class="ayuda">${k ? 'Cámbiale el nombre o quítala.' : 'Un banco, una tarjeta o efectivo.'}</p>
      <div class="tarjeta"><input id="cNom" class="texto campo" type="text" maxlength="24" placeholder="Nombre (ej: Revolut, Efectivo)" value="${esc(nombre)}" enterkeyhint="done">
        ${k ? '' : `<div class="chips" id="cRap" style="margin-top:12px">${['Revolut', 'BBVA', 'Santander', 'CaixaBank', 'ING', 'Efectivo'].filter(n => !D.cuentas.some(c => c.nombre.toLowerCase() === n.toLowerCase()))
          .map(n => `<button class="chip" data-v="${n}">${emojiCuenta(n)} ${n}</button>`).join('')}</div>`}</div>
      <div class="botones-hoja"><button class="boton" id="hGuardar">${k ? 'Guardar' : 'Añadir'}</button>
        ${k && D.cuentas.length > 1 ? '<button class="boton rojo-txt" id="hQuitar">Quitar cuenta</button>' : ''}
        <button class="boton sec" id="hCancelar">Cancelar</button></div>`,
    montar() {
      $('cNom').oninput = e => { nombre = e.target.value; };
      document.querySelectorAll('#cRap .chip').forEach(b => b.onclick = () => { nombre = b.dataset.v; $('cNom').value = nombre; });
      if (!k) setTimeout(() => $('cNom') && $('cNom').focus(), 300);
      $('hGuardar').onclick = () => {
        const n = nombre.trim();
        if (!n) return aviso('Ponle un nombre');
        if (D.cuentas.some(c => c !== k && c.nombre.toLowerCase() === n.toLowerCase())) return aviso('Ya tienes una cuenta con ese nombre');
        if (k) Object.assign(k, { nombre: n, emoji: emojiCuenta(n) });
        else D.cuentas.push({ id: nuevoId(), nombre: n, emoji: emojiCuenta(n) });
        guardarDatos(); cerrarHoja(); aviso(k ? 'Guardado ✓' : 'Cuenta añadida ✓'); pintarApp();
      };
      if ($('hQuitar')) $('hQuitar').onclick = () => {
        const otra = D.cuentas.find(c => c !== k);
        if (!confirm('¿Quitar «' + k.nombre + '»? Lo que estaba en ella pasará a «' + otra.nombre + '».')) return;
        // «Deberías tener»: el dinero de la cuenta que se quita se suma a la otra (si las dos tenían saldo puesto)
        const sQuita = saldoCuenta(k), sOtra = saldoCuenta(otra);
        [...D.ingresos, ...D.fijos, ...D.movimientos, ...D.deudas, ...D.deudas.flatMap(x => x.pagos)].forEach(x => { if (x.cuenta === k.id) x.cuenta = otra.id; if (x.a === k.id) x.a = otra.id; });
        // Traspasos que ahora irían de una cuenta a la misma: ya no tienen sentido
        D.movimientos = D.movimientos.filter(x => !(x.tipo === 'traspaso' && x.cuenta === x.a));
        if (sOtra !== null) Object.assign(otra, { saldo: r2(sOtra + (sQuita || 0)), saldoFecha: hoyIso(), saldoEn: Date.now() });
        if (D.ahorro && D.ahorro.cuenta === k.id) D.ahorro.cuenta = otra.id;
        if (D.ahorro && D.ahorro.porCuenta && D.ahorro.porCuenta[k.id]) {
          D.ahorro.porCuenta[otra.id] = r2((D.ahorro.porCuenta[otra.id] || 0) + D.ahorro.porCuenta[k.id]); delete D.ahorro.porCuenta[k.id];
        }
        if (D.ultimaCuenta === k.id) D.ultimaCuenta = otra.id;
        D.cuentas = D.cuentas.filter(c => c !== k);
        guardarDatos(); cerrarHoja(); aviso('Cuenta quitada'); pintarApp();
      };
    }
  }));
}

pintar();

// ---------- 📊 Contador anónimo (GoatCounter) ----------
// Solo cuenta que alguien ha abierto Pre$u y si es la app instalada o el navegador (GoatCounter ve también el tipo de móvil).
// NUNCA se envía nada de lo que se apunta (gastos, cuentas, nombre…). Sin cookies. Sin internet no cuenta (no pasa nada).
// Solo cuenta en la web publicada (GitHub Pages), no en el simulador del PC. Si CONTADOR está vacío, no cuenta nada.
const CONTADOR_PAUSA = 30 * 60e3;   // al volver tras más de 30 min fuera cuenta como otra vez que se abre
let contadoEn = 0, contadorFuera = 0;
function contarApertura() {
  try {
    if (!CONTADOR || !/\.github\.io$/.test(location.hostname) || navigator.onLine === false) return;
    const instalada = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    const url = 'https://' + CONTADOR + '.goatcounter.com/count?p=' + encodeURIComponent(instalada ? '/app' : '/navegador')
      + '&t=' + encodeURIComponent('Pre$u') + '&s=' + (screen.width || 0) + '&rnd=' + Math.random().toString(36).slice(2);
    const img = new Image(); img.referrerPolicy = 'no-referrer'; img.src = url;
    contadoEn = Date.now();
  } catch (e) {}
}
contarApertura();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { contadorFuera = Date.now(); return; }
  if (contadorFuera && Date.now() - contadorFuera > CONTADOR_PAUSA && Date.now() - contadoEn > CONTADOR_PAUSA) contarApertura();
});

// Para que se pueda instalar y abra sin internet (solo funciona en un servidor, como GitHub Pages o el simulador)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
